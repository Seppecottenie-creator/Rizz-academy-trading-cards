<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2C">
<title>Rizz Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Graduate&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   RIZZ ACADEMY — "The House" (RIZZ · Est. MMXXVI)
   Een Amerikaans studentenhuis: behang, lambrisering, lichtslingers,
   wimpels, koperen plaquettes, enveloppen met waszegel.
   Prestaties: geen backdrop-filter of blend-modi, enkel transform/opacity-animaties.
   ===================================================================== */
:root{
  --navy:#14213D; --navy2:#1F2E52; --oxford:#0B1426; --crimson:#9B1B30; --crimson2:#B8243C; --wine:#5E0F1E;
  --gold:#C9A227; --gold2:#E6C873; --gold-deep:#8C6A12; --ivory:#F5EEDC; --paper:#EFE4C8; --cream:#F5EEDC;
  --hunter:#1F4D3A; --wood:#4A2617; --wood2:#6B3A22; --wood-dark:#2A140A;
  --ink:#F2ECDD; --ink-soft:#C9C1AE; --muted:#8F8A7E; --line:rgba(201,162,39,.22);
  --panel:#13203A; --bg2:#0F1A2E;
  /* Wordle */
  --green:#2E7D4F; --green-soft:#7FD3A1; --yellow:#C9A227; --yellow-soft:#E6C873;
  --amber:var(--gold); --amber-soft:var(--gold2); --grey:#8F8A7E; --cat:#3F6F5A;
  --r:16px; --r-sm:12px;
  --display:'Cinzel','Trajan Pro','Times New Roman',serif;
  --varsity:'Graduate','Rockwell',Georgia,serif;
  --serif:'Cormorant Garamond','Garamond',Georgia,serif;
  --cond:'Cinzel','Times New Roman',serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.2,1.5,.35,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0E1A2C}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{margin:0 0 10px;line-height:1.05;color:var(--ivory);font-family:var(--display)}
h1{font:900 clamp(40px,6.4vw,78px)/.95 var(--display);letter-spacing:.02em}
h2{font:700 clamp(26px,3vw,36px)/1.05 var(--display);letter-spacing:.04em}
h3{font:700 19px/1.15 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}
h4{font:700 12.5px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
button,input,textarea,select{font:inherit}
a{color:var(--gold2)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--ink-soft);margin:0 0 16px;max-width:72ch}
.col{max-width:760px}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.loading{padding:80px 16px;text-align:center;color:var(--gold2);font:600 20px var(--display);letter-spacing:.24em;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#view{animation:view-in .45s var(--ease-out) both}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}}

/* ---------- Het studentenhuis (vaste achtergrond, bijna volledig statisch) ---------- */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#0E1A2C}
.wall{position:absolute;inset:0;
  background:
    radial-gradient(34% 30% at 22% 34%,rgba(255,196,120,.15),transparent 70%),
    radial-gradient(34% 30% at 84% 34%,rgba(255,196,120,.15),transparent 70%),
    radial-gradient(70% 45% at 50% 0%,rgba(255,214,160,.12),transparent 70%),
    repeating-linear-gradient(90deg,rgba(201,162,39,.075) 0 2px,transparent 2px 10px,rgba(255,255,255,.022) 10px 11px,transparent 11px 58px),
    linear-gradient(180deg,#15263F,#10203A 55%,#0C1729)}
/* Houten Griekse letters aan de muur */
.letters{position:absolute;left:50%;top:20vh;transform:translateX(-50%);white-space:nowrap;
  font:900 22vh/1 var(--display);letter-spacing:.14em;color:#E9DDC0;opacity:.14;
  -webkit-text-stroke:.05em #9B1B30;paint-order:stroke fill;text-shadow:.035em .035em 0 #C9A227,0 18px 30px rgba(0,0,0,.65)}
@media (min-width:900px){.letters{left:calc(50% + 134px)}}
/* Vilten wimpels */
.pennant{position:absolute;opacity:.42;width:min(330px,30vw);aspect-ratio:3.2/1;display:flex;align-items:center;padding-left:13%;
  clip-path:polygon(0 0,100% 50%,0 100%);background:
    repeating-linear-gradient(35deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px),var(--pc,#9B1B30);
  box-shadow:inset 18px 0 0 var(--ivory);filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.pennant span{font:900 clamp(16px,2.2vw,30px)/1 var(--display);letter-spacing:.14em;color:var(--pt,#F5EEDC);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pennant.p1{right:-9vw;top:30vh;transform:rotate(-14deg);--pc:#9B1B30}
.pennant.p2{right:-7vw;top:56vh;transform:rotate(10deg);--pc:#1F4D3A;width:min(260px,24vw)}
.pennant.p3{display:none}
/* In de app zelf staan de wimpels in de weg van de inhoud: enkel op het inlogscherm */
body:has(.shell) .pennant{display:none}
/* De grote muurletters enkel in de app (op het inlogscherm vallen ze half achter de titel) */
body:not(:has(.shell)) .letters{display:none}
/* Lichtslinger */
.lights{position:absolute;left:0;right:0;top:0;height:16vh}
.lights svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{position:absolute;width:11px;height:15px;margin:-2px 0 0 -5.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 40%,#FFFBE8,#FFD98A 55%,#F2B04A);box-shadow:0 0 10px 3px rgba(255,200,110,.55),0 0 26px 8px rgba(255,180,80,.22)}
.bulb::before{content:"";position:absolute;left:3px;top:-5px;width:5px;height:6px;border-radius:1px;background:#2A2520}
.bulb.tw{animation:bulb 2.6s ease-in-out infinite alternate}
@keyframes bulb{to{opacity:.45}}
/* Lambrisering onderaan */
.wainscot{position:absolute;left:0;right:0;bottom:0;height:28vh;
  background:
    linear-gradient(180deg,#8A5532 0 5px,#4A2617 5px 9px,rgba(0,0,0,.45) 9px 12px,transparent 12px),
    repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.32) 22px 25px,rgba(255,220,180,.07) 25px 27px,transparent 27px 230px,rgba(0,0,0,.38) 230px 234px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 8px),
    linear-gradient(180deg,#56301A,#3A1D0E)}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(4,8,16,.6))}
#bgfx{position:absolute;inset:0;width:100%;height:100%;z-index:3}
@media (max-width:899px){
  .letters{top:32vh;font-size:12vh}
  .pennant.p2{display:none}
  .pennant.p1{width:52vw;top:44vh;right:-22vw}
  .lights{height:11vh}
  .wainscot{height:22vh}
}
.lite .bulb.tw{animation:none}

/* ---------- App-indeling: zijbalk + hoofdvlak (+ dock op gsm) ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px 18px;display:flex;flex-direction:column;gap:20px;z-index:30;
  background:repeating-linear-gradient(90deg,rgba(201,162,39,.05) 0 1px,transparent 1px 7px),linear-gradient(180deg,#0E1830,#0A1224);
  border-right:3px double rgba(201,162,39,.45);box-shadow:20px 0 50px -30px rgba(0,0,0,.9)}
.logo{display:flex;align-items:center;gap:12px;padding:0 4px;color:#fff;text-decoration:none}
.logo-txt{display:grid;line-height:1}
.logo-txt b{font:800 19px var(--display);letter-spacing:.08em;color:var(--ivory)}
.logo-txt small{font:600 10.5px var(--display);letter-spacing:.32em;color:var(--gold);margin-top:6px}
.crest{position:relative;width:46px;height:54px;flex-shrink:0;display:grid;place-items:center;padding-bottom:8px;overflow:hidden;
  font:800 11.5px var(--display);letter-spacing:0;color:var(--gold2);background:linear-gradient(160deg,#B8243C,#5E0F1E);
  clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);
  box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 4px #5E0F1E,inset 0 0 0 5px rgba(230,200,115,.6)}
.crest::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,65%{transform:translateX(0)}100%{transform:translateX(200%)}}
.crest.big{width:78px;height:92px;font-size:19px;padding-bottom:14px}
.nav{display:grid;gap:4px;margin:0;padding:0}
.nav-btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:4px;background:none;color:var(--ink-soft);
  font:700 13.5px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:left;transition:color .15s,background .2s,transform .15s var(--ease-out)}
.nav-btn .ni{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.25);font-size:16px;flex-shrink:0;transition:transform .2s var(--spring)}
.nav-btn:hover{color:#fff;transform:translateX(3px)}
.nav-btn:hover .ni{transform:rotate(-8deg) scale(1.08)}
/* Actief: een crimson wimpel met zwaluwstaart */
.nav-btn[aria-current="page"]{color:var(--ivory);background:linear-gradient(90deg,#B8243C,#7E1428);clip-path:polygon(0 0,100% 0,93% 50%,100% 100%,0 100%);box-shadow:inset 4px 0 0 var(--gold)}
.nav-btn[aria-current="page"] .ni{background:var(--gold);border-color:var(--gold2)}
.nav-btn .tab-badge{margin-left:auto;margin-right:16px}
.side-foot{margin-top:auto;display:grid;gap:10px}
.me-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.me-btn:hover{background:rgba(255,255,255,.07);border-color:rgba(201,162,39,.5)}
.me-name{display:grid;line-height:1.2;min-width:0}
.me-name b{font:700 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-name small{color:var(--gold);font:600 10.5px var(--display);letter-spacing:.2em;text-transform:uppercase}
.avbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background-color:var(--navy2);background-size:cover;background-position:center;color:var(--ivory);
  font:700 17px var(--display);display:grid;place-items:center;padding:0;flex-shrink:0;box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.main{min-width:0;padding:20px clamp(16px,2.6vw,36px) 48px;position:relative;overflow-x:clip}
.mtop{display:none}
.dock{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:12px 14px 112px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .mtop .logo-txt b{font-size:16px}
  .mtop .logo-txt small{font-size:9px;letter-spacing:.24em}
  .mtop .crest{width:36px;height:42px;font-size:9px;padding-bottom:6px}
  .mtop .logo{padding:0;gap:9px}
  .mtop-right{display:flex;align-items:center;gap:8px}
  .dock{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:60;gap:2px;padding:6px;overflow-x:auto;scrollbar-width:none;
    border-radius:16px;background:linear-gradient(180deg,#5A311C,#3A1D0E);border:1px solid rgba(201,162,39,.45);
    box-shadow:0 18px 40px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,220,180,.15)}
  .dock::-webkit-scrollbar{display:none}
  .dock .nav-btn{flex:1 0 60px;display:grid;justify-items:center;gap:4px;padding:6px 4px;font:700 8.5px/1 var(--display);letter-spacing:.08em;border-radius:10px;transform:none;clip-path:none;color:#E8D9BC}
  .dock .nav-btn .ni{width:30px;height:28px;font-size:16px;background:none;border:0;border-radius:0}
  .dock .nav-btn[aria-current="page"]{background:linear-gradient(180deg,#B8243C,#7E1428);box-shadow:inset 0 2px 0 var(--gold);clip-path:none}
  .dock .nav-btn[aria-current="page"] .ni{background:none;transform:scale(1.15)}
  .dock .nav-btn .tab-badge{position:absolute;top:2px;right:6px;margin:0}
}
.tab-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#D2232A;color:#fff;font:700 12px/1 var(--body);box-shadow:0 0 0 2px #0A1224;animation:badge-pop .6s var(--spring)}
@keyframes badge-pop{from{transform:scale(0)}}
.coinpill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,#E6C873,#C9A227 55%,#A9841A);color:#2A1A05;font:800 16px/1 var(--display);letter-spacing:.06em;white-space:nowrap;box-shadow:0 3px 0 #6E5410}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(201,162,39,.1);border:1px solid var(--line);color:var(--ink-soft);font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.pill-turn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A05;border-color:transparent}

/* ---------- Koperen plaquettes op een houten lat (bovenaan) ---------- */
.plaques{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding:10px 14px;border-radius:10px;
  background:
    repeating-linear-gradient(91deg,rgba(255,220,180,.05) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 23px),
    linear-gradient(180deg,#6B3A22,#4A2617 55%,#3A1D0E);
  border:1px solid #2A140A;box-shadow:inset 0 1px 0 rgba(255,220,180,.2),inset 0 -2px 0 rgba(0,0,0,.35),0 14px 30px -14px rgba(0,0,0,.9)}
.plaque{position:relative;flex:0 0 auto;min-width:128px;padding:7px 18px 6px;border-radius:5px;display:grid;gap:1px;text-align:center;
  background:linear-gradient(180deg,#F1DC92,#D4B048 40%,#B8922A 75%,#D9BA5A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 1px #6E5410,0 3px 6px rgba(0,0,0,.5)}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF1C0,#8C6A12)}
.plaque::before{left:6px} .plaque::after{right:6px}
.pl-label{font:700 9.5px var(--display);letter-spacing:.26em;text-transform:uppercase;color:#5A420A}
.pl-val{font:800 22px/1.05 var(--display);letter-spacing:.06em;color:#3A2705;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.motto{flex:1;min-width:0;text-align:right;font:600 15px var(--display);letter-spacing:.32em;color:var(--gold2);text-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motto i{font:italic 600 17px var(--serif);letter-spacing:.04em;color:#E8D9BC;margin-left:8px}
@media (max-width:899px){
  .plaques{gap:8px;padding:7px;margin-bottom:16px}
  .plaque{flex:1;min-width:0;padding:6px 8px 5px}
  .plaque::before,.plaque::after{display:none}
  .pl-label{font-size:8px;letter-spacing:.16em}
  .pl-val{font-size:18px}
  .motto{display:none}
}

/* ---------- Paginatitels ---------- */
.page-head{margin-bottom:20px}
.ph-row{display:flex;align-items:center;gap:14px}
.page-head h2{margin:0;font:800 clamp(32px,4.2vw,52px)/1 var(--display);letter-spacing:.03em;color:var(--ivory);text-shadow:0 2px 0 var(--wine),0 10px 24px rgba(0,0,0,.55)}
.page-head::after{content:"";display:block;width:min(320px,70%);height:9px;margin-top:10px;
  background:linear-gradient(var(--gold),var(--gold)) left center/calc(50% - 10px) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) right center/calc(50% - 10px) 1px no-repeat,
    linear-gradient(45deg,transparent 35%,var(--gold) 35% 65%,transparent 65%) center/9px 9px no-repeat}
.kicker{display:block;font:700 11.5px var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.info-btn{width:32px;height:32px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(201,162,39,.7);background:rgba(201,162,39,.1);color:var(--gold2);
  font:italic 600 18px/1 var(--serif);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .25s var(--spring),background .2s}
.info-btn:hover{transform:scale(1.12) rotate(-8deg);background:rgba(201,162,39,.25)}

/* ---------- Knoppen en formulieren ---------- */
.btn{position:relative;overflow:hidden;width:100%;min-height:50px;padding:12px 24px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#F1DC92,#D4B048 45%,#B8922A);color:#2A1A05;font:800 15px/1.1 var(--display);letter-spacing:.16em;text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
  box-shadow:0 5px 0 #6E5410,0 12px 24px -10px rgba(201,162,39,.55),inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(110,84,16,.35);
  transition:transform .12s ease,box-shadow .12s ease,filter .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transition:transform .6s ease}
.btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-2px)}
.btn:hover:not(:disabled)::after{transform:translateX(200%)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #6E5410,inset 0 1px 0 rgba(255,255,255,.75)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.4)}
.btn.small{width:auto;min-height:0;padding:10px 16px;font-size:12.5px;box-shadow:0 4px 0 #6E5410,inset 0 1px 0 rgba(255,255,255,.75)}
.btn.small:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #6E5410}
.btn small{font:700 11px var(--body);letter-spacing:0;opacity:.8;margin-left:4px;text-transform:none}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(201,193,174,.4);cursor:pointer;padding:10px 6px;font:600 15px var(--body)}
.link:hover{color:var(--gold2);text-decoration-color:currentColor}
.link.danger{color:#F08A8F}
.form{display:grid;gap:16px;margin:22px 0 8px}
.form label{display:grid;gap:7px;font:700 11.5px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.form input,.form textarea,.tselect,.idea-set{border:1px solid rgba(201,162,39,.3);background:rgba(5,10,22,.6);color:var(--ink);border-radius:8px;padding:14px;min-height:52px;
  font:500 16px/1.4 var(--body);letter-spacing:0;text-transform:none;resize:vertical;transition:border-color .2s,box-shadow .2s}
.form input:focus,.form textarea:focus,.tselect:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.18)}
.tselect{width:100%;min-height:50px;padding:12px}
.tselect option{background:#13203A}
.msg{margin:0;min-height:1.5em;font:600 15px var(--body)}
.msg.err,.err{color:#F08A8F}
.msg.ok{color:var(--green-soft)}

/* Panelen: donker navy met een dunne koperen lijst */
.stat-card,.friend-row,.trade-card,.battle-box,.idea,.shop-pack,.round-closed,.odds,.battle-result,.battle-log,.infobox,.accbox,.packbox,.update-bar,.glass{
  background:linear-gradient(180deg,rgba(24,38,68,.96),rgba(15,25,46,.96));border:1px solid rgba(201,162,39,.35);
  box-shadow:inset 0 0 0 4px rgba(15,25,46,.96),inset 0 0 0 5px rgba(201,162,39,.12),0 20px 40px -24px rgba(0,0,0,.9)}

/* ---------- Inlogscherm ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:clamp(20px,4vw,60px);max-width:1180px;margin:0 auto;padding:40px clamp(16px,4vw,48px)}
.auth-hero{position:relative;display:grid;gap:14px;justify-items:start}
.auth h1{color:var(--ivory);margin:6px 0 0;text-shadow:0 2px 0 var(--gold-deep),0 4px 0 var(--wine),0 16px 30px rgba(0,0,0,.7)}
.auth h1 em{display:block;font:700 clamp(15px,1.9vw,22px)/1 var(--display);letter-spacing:.42em;color:var(--gold2);font-style:normal;margin-top:16px;text-shadow:none}
.auth-tag{color:var(--ink-soft);font:italic 500 21px/1.4 var(--serif);max-width:42ch;margin:0}
.fan{position:relative;height:260px;width:min(420px,100%);margin-top:14px}
.fan .cw{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;transition:transform .5s var(--spring);animation:float 5s ease-in-out infinite}
.fan .cw:nth-child(1){transform:translateX(-120px) rotate(-16deg) translateY(26px);animation-delay:-1.5s}
.fan .cw:nth-child(2){z-index:2;animation-delay:-.4s}
.fan .cw:nth-child(3){transform:translateX(120px) rotate(16deg) translateY(26px);animation-delay:-2.7s}
.fan:hover .cw:nth-child(1){transform:translateX(-160px) rotate(-22deg) translateY(20px)}
.fan:hover .cw:nth-child(3){transform:translateX(160px) rotate(22deg) translateY(20px)}
@keyframes float{50%{translate:0 -12px}}
.auth-box{padding:30px clamp(20px,3vw,34px);border-radius:14px;position:relative;
  background:linear-gradient(180deg,#F7F0DE,#EADFC2);color:#2A2438;border:1px solid #B8922A;
  box-shadow:inset 0 0 0 6px #F7F0DE,inset 0 0 0 7px rgba(155,27,48,.5),0 40px 80px -30px rgba(0,0,0,.95)}
.auth-box .kicker{color:var(--crimson)}
.auth-box h2{font-size:34px;margin-bottom:4px;color:#14213D}
.auth-box .hint{color:#5A5268}
.auth-box .form label{color:#7A1626}
.auth-box .form input{background:#FFFDF6;color:#1B1B2F;border-color:#C9B78A}
.auth-box .link{color:#5A5268}
.auth-box .link:hover{color:var(--crimson)}
.auth-box .msg.err{color:#B3202A} .auth-box .msg.ok{color:#1E6B40}
.auth-links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
@media (max-width:899px){
  .auth{grid-template-columns:1fr;padding:22px 16px 40px;gap:8px}
  .auth-hero{justify-items:center;text-align:center}
  .auth-tag{font-size:18px}
  .fan{height:200px;width:100%}
  .fan .cw{width:118px;margin-left:-59px}
  .fan .cw:nth-child(1){transform:translateX(-86px) rotate(-14deg) translateY(20px)}
  .fan .cw:nth-child(3){transform:translateX(86px) rotate(14deg) translateY(20px)}
}

/* ---------- Welkomst-uitnodiging ---------- */
.welcome-banner{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding:16px 22px;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,#F7F0DE,#EADFC2);color:#2A2438;border:1px solid #B8922A;
  box-shadow:inset 0 0 0 5px #F7F0DE,inset 0 0 0 6px rgba(155,27,48,.45),0 20px 40px -20px rgba(0,0,0,.8)}
.welcome-banner::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);animation:shine 6s ease-in-out infinite}
.wb-icon{width:52px;height:52px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font:800 11px var(--display);color:#F7D9A0;
  background:radial-gradient(circle at 40% 35%,#D63A4A,#9B1B30 60%,#6E1020);box-shadow:0 0 0 3px #8A1626,0 4px 8px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.3)}
.wb-text{flex:1;min-width:200px;color:#5A5268}
.wb-text strong{display:block;font:800 22px/1.1 var(--display);letter-spacing:.04em;color:#14213D;margin-bottom:2px}
.welcome-banner .btn{width:auto;position:relative;z-index:1}

/* ---------- Today: Wordle op een houten plaquette ---------- */
.today-grid{display:grid;gap:28px;align-items:start}
.today-grid .col{max-width:none}
@media (min-width:1100px){.today-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.board-frame{position:relative;max-width:560px;padding:20px 20px 18px;border-radius:14px;
  background:
    radial-gradient(90% 60% at 50% 0%,rgba(255,220,170,.14),transparent 65%),
    repeating-linear-gradient(92deg,rgba(255,220,180,.05) 0 2px,transparent 2px 8px,rgba(0,0,0,.09) 8px 10px,transparent 10px 21px),
    linear-gradient(180deg,#5E331D,#47250F 55%,#3A1D0E);
  border:1px solid #2A140A;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 0 0 7px rgba(201,162,39,.45),inset 0 2px 0 8px rgba(255,220,180,.06),0 30px 60px -24px rgba(0,0,0,.95)}
.bf-head{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px auto 16px;width:fit-content;max-width:100%;padding:8px 22px 7px;border-radius:5px;
  background:linear-gradient(180deg,#F1DC92,#D4B048 40%,#B8922A 75%,#D9BA5A);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px #6E5410,0 4px 8px rgba(0,0,0,.5)}
.bf-title{font:800 18px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:#3A2705;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.bf-num{font:italic 700 20px/1 var(--serif);color:#5A420A}
.bf-head .info-btn{width:26px;height:26px;font-size:15px;color:#5A420A;border-color:#8C6A12;background:rgba(255,255,255,.2)}
.round-tabs{display:flex;gap:8px;margin-bottom:14px;max-width:560px}
.round-tab{flex:1;display:grid;gap:1px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--ink);background:rgba(255,255,255,.04);font:700 14px var(--display);letter-spacing:.08em;cursor:pointer}
.round-tab small{font:600 12.5px var(--body);color:var(--ink-soft);letter-spacing:0}
.round-tab.active{border-color:var(--gold);background:rgba(201,162,39,.12)}
.wboard{--rows:6;position:relative;display:grid;gap:7px;width:min(310px,100%,calc((100vh - 470px) * 5 / var(--rows)));min-width:210px;margin:0 auto 10px}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.wrow.shake{animation:shake .4s ease}
/* Ivoren lettertegels in uitgefreesde vakjes */
.wtile{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;user-select:none;color:#2A1A10;font:800 clamp(22px,6.4vw,32px)/1 var(--display);text-transform:uppercase;
  background:rgba(0,0,0,.32);box-shadow:inset 0 3px 6px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,220,180,.12)}
.wtile.filled{background:linear-gradient(180deg,#FBF5E4,#E8DCBC);box-shadow:0 3px 0 #9C8A60,0 5px 8px rgba(0,0,0,.4),inset 0 1px 0 #fff;animation:tile-pop .14s ease}
.wtile.g{background:linear-gradient(180deg,#3E9A63,#25683F);color:#F5EEDC;box-shadow:0 3px 0 #164428,0 5px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.wtile.y{background:linear-gradient(180deg,#E6C873,#C9A227);color:#2A1A05;box-shadow:0 3px 0 #6E5410,0 5px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.wtile.x{background:linear-gradient(180deg,#6E6670,#544D57);color:#D9D1C4;box-shadow:0 3px 0 #2E2A31,0 5px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.wtile.flip{animation:wflip .55s ease-in-out both;animation-delay:calc(var(--i) * .22s)}
@keyframes wflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg) scale(.96)}100%{transform:rotateX(0)}}
@keyframes tile-pop{50%{transform:scale(1.1)}}
.wmsg{text-align:center;min-height:1.4em;margin:0 auto 10px;max-width:440px;color:#F2E6CC}
.board-frame .msg.ok{color:#B9F0CC}
.board-frame .msg.err{color:#FFB3B8}
/* Ronde typemachinetoetsen */
.wkeys{display:grid;gap:7px;width:min(520px,100%);margin:0 auto}
.wkrow{display:flex;gap:clamp(3px,1vw,7px);justify-content:center}
.wkey{flex:0 0 auto;width:clamp(27px,8.2vw,42px);aspect-ratio:1;height:auto;padding:0;border:0;border-radius:50%;cursor:pointer;touch-action:manipulation;
  background:radial-gradient(circle at 50% 32%,#FFFDF5,#EFE5CB 58%,#D3C49E);color:#1B1B2F;font:800 clamp(12px,3.4vw,16px)/1 var(--display);
  box-shadow:0 0 0 2.5px #C8C4BA,0 0 0 4px #4A4640,0 4px 0 3px #24211D,0 7px 10px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s,filter .15s}
.wkey:hover{filter:brightness(1.06)}
.wkey:active{transform:translateY(3px);box-shadow:0 0 0 2.5px #C8C4BA,0 0 0 4px #4A4640,0 1px 0 3px #24211D}
.wkey.wide{width:auto;aspect-ratio:auto;height:clamp(27px,8.2vw,42px);padding:0 clamp(8px,2.4vw,14px);border-radius:999px;font-size:clamp(10px,2.8vw,13px);letter-spacing:.08em}
.wkey.g{background:radial-gradient(circle at 50% 32%,#6FCB93,#2E7D4F 70%);color:#F5EEDC}
.wkey.y{background:radial-gradient(circle at 50% 32%,#F4DE95,#C9A227 70%);color:#2A1A05}
.wkey.x{background:radial-gradient(circle at 50% 32%,#5E5862,#38333B 70%);color:#8F8892}
.whelp{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;margin-top:12px}
.whelp .link{font-size:14px;padding:4px 2px;color:#E8D9BC}
.whelp .link:disabled{opacity:.4;cursor:default}
.hint-chip{background:rgba(201,162,39,.2);border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:3px 10px;font:700 13px var(--body)}
.round-closed{text-align:center;padding:36px 10px;border-radius:var(--r)}
.big-lock{font-size:52px;line-height:1;margin-bottom:10px}
.countdown{font:800 40px var(--display);letter-spacing:.08em;color:var(--gold2);margin:6px 0 0}

/* Tafel met lamplicht waarop de envelop/kaart ligt */
.stage{position:relative;display:grid;justify-items:center;gap:14px;min-height:420px;align-content:start;padding-top:8px;isolation:isolate}
.stage::before{content:"";position:absolute;left:50%;top:-30px;width:min(520px,100%);height:calc(100% + 30px);transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(50% 45% at 50% 40%,rgba(255,214,150,.16),transparent 70%)}
.stage::after{content:"";position:absolute;left:50%;bottom:6px;width:min(360px,86%);height:40px;transform:translateX(-50%);z-index:-1;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.stage .cw{width:min(340px,84vw,calc((100vh - 240px) * .714))}
.stage-placeholder{display:grid;justify-items:center;gap:18px;padding:30px 20px 64px;text-align:center;color:var(--ink-soft)}
.stage-placeholder p{margin:0;font:italic 500 22px var(--serif);color:var(--ink-soft)}
.ghost-pack{position:relative;width:200px;aspect-ratio:4/5;border-radius:6px;display:grid;place-items:center;animation:float 4s ease-in-out infinite;
  background:linear-gradient(180deg,#E9DEC2,#D8C9A3);box-shadow:0 30px 40px -20px rgba(0,0,0,.8);opacity:.9;font-size:0}
.ghost-pack::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 49.4%,rgba(120,96,60,.35) 50%,transparent 50.6%),linear-gradient(20deg,transparent 49.4%,rgba(120,96,60,.35) 50%,transparent 50.6%);border-radius:inherit}
.ghost-pack::after{content:"?";position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 26px var(--display);color:#F7D9A0;
  background:radial-gradient(circle at 40% 35%,#D63A4A,#9B1B30 60%,#6E1020);box-shadow:0 0 0 3px #8A1626,0 4px 8px rgba(0,0,0,.4)}
.result{margin:0;text-align:center;font:600 17px/1.45 var(--body);color:var(--ink);max-width:46ch;position:relative;z-index:3}
.odds{margin:4px 0 22px;border-radius:var(--r-sm);padding:14px 18px}
.odds-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
.odds-table th,.odds-table td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.odds-table th{color:var(--gold2);font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.odds-table td{color:var(--ink-soft)}
.odds-table tr:last-child td{border-bottom:0;font-style:italic}
@media (max-width:899px){
  .stage:has(.stage-placeholder){display:none}
  .board-frame{padding:16px 10px 14px}
  .bf-head{padding:7px 14px 6px;gap:8px}
  .bf-title{font-size:14px;letter-spacing:.14em}
}

/* ---------- Envelop met waszegel ---------- */
.pack-stage{position:relative;display:grid;justify-items:center;gap:18px;width:100%;padding-top:110px}
.rays{position:absolute;left:50%;top:calc(110px + min(160px,38vw));width:720px;height:720px;margin:-360px 0 0 -360px;border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,160,.2) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);
  animation:spin 30s linear infinite;transition:transform .6s var(--ease-out),opacity .6s}
.rays.r-epic{background:repeating-conic-gradient(from 0deg,rgba(255,110,140,.26) 0deg 5deg,transparent 5deg 15deg)}
.rays.r-legendary{background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.4) 0deg 6deg,transparent 6deg 14deg)}
.rays.charge{animation-duration:3s;transform:scale(1.15)}
.rays.burst{transform:scale(1.9);opacity:0;transition:transform 1.1s var(--ease-out),opacity 1.4s ease}
@keyframes spin{to{rotate:360deg}}
.pack{position:relative;z-index:2;width:min(260px,64vw);aspect-ratio:4/5;background:none;border:0;padding:0;cursor:pointer;container-type:inline-size;perspective:900px;
  animation:pack-idle 3s ease-in-out infinite;filter:drop-shadow(0 24px 26px rgba(0,0,0,.7))}
/* achterkant van de envelop (binnenkant) */
.pack::before{content:"";position:absolute;inset:0;border-radius:2.4cqw;background:linear-gradient(180deg,#CDBB92,#BFAA7C);transition:opacity .5s,transform .5s ease-in}
.pack-card{position:absolute;left:10%;right:10%;top:5%;z-index:1;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.stage .pack-card .cw,.stage .pack-slot .cw{width:100%}
/* voorkant: zakje met V-vorm */
.pack-body{position:absolute;inset:0;z-index:2;border-radius:2.4cqw;display:grid;align-content:end;justify-items:center;padding:0 8cqw 9cqw;
  clip-path:polygon(0 22%,50% 56%,100% 22%,100% 100%,0 100%);
  background:
    linear-gradient(160deg,transparent 49.6%,rgba(110,84,50,.25) 50%,transparent 50.6%) 0 0/50% 100% no-repeat,
    linear-gradient(200deg,transparent 49.6%,rgba(110,84,50,.25) 50%,transparent 50.6%) 100% 0/50% 100% no-repeat,
    repeating-linear-gradient(35deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px),
    linear-gradient(180deg,#F3EAD3,#E2D3AF);
  transition:transform .5s ease-in,opacity .5s ease-in}
.pack-label{position:relative;display:grid;justify-items:center;gap:1.4cqw;text-align:center;color:#2A2438}
.pack-logo{font:800 8.4cqw/1 var(--display);letter-spacing:.14em;color:#14213D}
.pack-sub{font:italic 600 6cqw/1 var(--serif);color:#7A1626}
.pack-count{margin-top:1.6cqw;padding:1.2cqw 4cqw;border-top:.4cqw solid rgba(20,33,61,.4);font:700 4cqw/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:#5A5268}
/* klep */
.pack-top{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;transform-origin:50% 0;
  clip-path:polygon(0 0,100% 0,100% 36%,50% 94%,0 36%);
  background:linear-gradient(180deg,#EADFC4,#D9C8A0);box-shadow:inset 0 -2px 0 rgba(0,0,0,.1);transition:transform .6s cubic-bezier(.4,0,.2,1)}
/* waszegel */
.seal{position:absolute;left:50%;top:52%;z-index:4;width:24cqw;height:24cqw;margin:-12cqw 0 0 -12cqw;border-radius:50%;display:grid;place-items:center;
  font:800 5.2cqw/1 var(--display);color:#F7D9A0;text-shadow:0 1px 0 rgba(0,0,0,.4);
  background:radial-gradient(circle at 40% 35%,#E04656,#A81E33 55%,#6E1020);
  box-shadow:0 0 0 1.4cqw #9B1B30,0 0 0 2cqw rgba(110,16,32,.6),0 1.6cqw 2.4cqw rgba(0,0,0,.45),inset 0 .8cqw 1.4cqw rgba(255,255,255,.3),inset 0 -1cqw 1.6cqw rgba(0,0,0,.35);
  transition:transform .35s ease-in,opacity .35s ease-in}
.pack-hint{position:relative;z-index:2;margin:0;font:italic 600 21px var(--serif);color:var(--gold2);animation:blink 1.8s ease-in-out infinite}
.pack.charging{animation:pack-charge .9s ease-in both}
.pack.charging .seal{transform:scale(1.08)}
.pack.charging.r-epic{filter:drop-shadow(0 0 26px #FF5A7A) drop-shadow(0 20px 26px rgba(0,0,0,.7))}
.pack.charging.r-legendary{filter:drop-shadow(0 0 32px #FFD25A) drop-shadow(0 20px 26px rgba(0,0,0,.7))}
.pack.torn .seal{transform:scale(1.6) rotate(20deg);opacity:0}
.pack.torn .pack-top{transform:rotateX(180deg);z-index:0}
.pack.torn .pack-card{transform:translateY(-58%) rotate(-2deg)}
.pack.done::before,.pack.done .pack-body,.pack.done .pack-top{transform:translateY(55%);opacity:0}
.pack.done .pack-card{transition:opacity .35s;opacity:0}
@keyframes pack-idle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-8px)}}
@keyframes pack-charge{0%{transform:scale(1)}20%{transform:scale(1.03) rotate(-4deg)}40%{transform:scale(1.06) rotate(4deg)}60%{transform:scale(1.08) rotate(-4deg)}80%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1.12) rotate(0)}}
.pack-results{position:relative;z-index:2;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;perspective:1200px}
.pack-slot{position:relative;width:min(300px,78vw)}
.pack-results.multi .pack-slot{width:min(200px,28vw)}
.pack-slot .flipper{position:relative;z-index:1;transition:transform .24s ease-in}
.pack-slot .flipper.rise{animation:rise .7s var(--spring) both}
@keyframes rise{from{transform:translateY(60px) scale(.6);opacity:0}}
.pack-slot .flipper.turning{transform:rotateY(90deg) scale(.96)}
.pack-slot .flipper.turning-back{transition:transform .24s ease-out}
.glow{position:absolute;inset:-35%;pointer-events:none;border-radius:50%;filter:blur(34px);opacity:0;animation:glow-in .8s ease-out both}
@keyframes glow-in{from{opacity:0;transform:scale(.5)}to{opacity:.6;transform:scale(1)}}
.glow.common{background:radial-gradient(circle,#F5EEDC,transparent 70%)}
.glow.epic{background:radial-gradient(circle,#FF5A7A,transparent 70%)}
.glow.legendary{background:radial-gradient(circle,#FFD25A,transparent 70%);animation:glow-in .8s ease-out both,glow-pulse 1.6s ease-in-out .8s infinite}
.glow.cat{background:radial-gradient(circle,#8FD3B0,transparent 70%)}
@keyframes glow-pulse{50%{opacity:.85;transform:scale(1.08)}}
.particles{position:absolute;inset:0;pointer-events:none;z-index:3}
.particle{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--pc,#fff);box-shadow:0 0 8px var(--pc,#fff);opacity:0;animation:spark-fly 1.2s ease-out forwards;animation-delay:var(--pd,0s)}
@keyframes spark-fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.2)}}
.shake{animation:shake .4s ease}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.cardflip{animation:card-flip .9s cubic-bezier(.2,1.35,.35,1) both}
@keyframes card-flip{0%{transform:perspective(900px) rotateY(180deg) scale(.35);opacity:0}60%{transform:perspective(900px) rotateY(-14deg) scale(1.07);opacity:1}100%{transform:none;opacity:1}}

/* Flits, inktstempel en schok voor de grote momenten */
.flash{position:fixed;inset:0;z-index:900;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,236,180,.85) 40%,rgba(255,220,140,0) 75%);animation:flash .9s ease-out forwards}
.flash.epic{background:radial-gradient(circle at 50% 45%,#fff,rgba(255,130,160,.8) 40%,rgba(255,80,120,0) 75%)}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
/* Rubberen inktstempel: kader, gebroken inkt, schuin neergeslagen */
.stamp{position:fixed;left:50%;top:44%;z-index:950;pointer-events:none;transform:translate(-50%,-50%) rotate(-11deg);white-space:nowrap;text-align:center;
  padding:.1em .34em .06em;border:.06em solid currentColor;border-radius:.06em;outline:.022em solid currentColor;outline-offset:.05em;
  font:900 clamp(64px,12vw,160px)/1 var(--display);letter-spacing:.04em;color:#E0303A;background:rgba(10,6,8,.18);
  -webkit-mask-image:repeating-linear-gradient(118deg,#000 0 9px,rgba(0,0,0,.72) 9px 11px,#000 11px 23px,rgba(0,0,0,.86) 23px 24px);
  mask-image:repeating-linear-gradient(118deg,#000 0 9px,rgba(0,0,0,.72) 9px 11px,#000 11px 23px,rgba(0,0,0,.86) 23px 24px);
  text-shadow:0 0 1px currentColor;animation:stamp 2s cubic-bezier(.2,1.3,.4,1) forwards}
.stamp small{display:block;font:italic 700 clamp(15px,1.9vw,24px)/1.1 var(--serif);letter-spacing:.06em;margin:.15em 0 .1em}
.stamp.k-grade{font-size:clamp(90px,17vw,220px)}
.stamp.k-legendary{color:#F2C94C}
.stamp.k-epic{color:#FF5A7A}
.stamp.k-common{color:#F5EEDC}
.stamp.k-cat{color:#8FD3B0;transform:translate(-50%,-50%) rotate(7deg)}
.stamp.k-fail{font-size:clamp(90px,17vw,220px);transform:translate(-50%,-50%) rotate(8deg)}
@keyframes stamp{0%{opacity:0;scale:2.6}12%{opacity:.95;scale:.94}18%{scale:1.02}24%{scale:1}80%{opacity:.95}100%{opacity:0;scale:1.04}}
.quake{animation:quake .5s ease}
@keyframes quake{10%,90%{translate:-2px 1px}20%,80%{translate:4px -2px}30%,50%,70%{translate:-8px 3px}40%,60%{translate:8px -3px}}

/* ---------- Kaarten: jaarboekportret op ivoorpapier ---------- */
.cw{container-type:inline-size;width:100%;position:relative}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:30%;--glare:0;position:relative;aspect-ratio:5/7;border-radius:3.6cqw;overflow:hidden;isolation:isolate;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 3px),var(--paper);color:var(--ink-c);
  transition:transform .5s var(--ease-out),box-shadow .3s;
  box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.35),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75)}
.card.tilting{--glare:1;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry))}
/* dubbele koperen lijst */
.cframe{position:absolute;inset:2.4cqw;border:.5cqw solid var(--gilt);border-radius:2.4cqw;pointer-events:none;z-index:1}
.cframe::after{content:"";position:absolute;inset:1cqw;border:.25cqw solid var(--gilt);border-radius:1.6cqw;opacity:.7}
.cbadge{position:absolute;top:5cqw;left:6.4cqw;z-index:3;width:12cqw;height:13cqw;display:grid;place-items:center;padding-bottom:2cqw;
  font:800 2.5cqw/1 var(--display);color:var(--ribbon-ink);background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);box-shadow:inset 0 0 0 .5cqw var(--gilt)}
.hp{position:absolute;top:5.6cqw;right:6.4cqw;z-index:3;font:800 4.4cqw/1 var(--display);letter-spacing:.08em;color:var(--ink-c);white-space:nowrap}
/* portretvenster met gotische boog */
.win{position:absolute;top:10cqw;left:13cqw;right:13cqw;height:86cqw;z-index:2;border-radius:35cqw 35cqw 2cqw 2cqw;overflow:hidden;background:var(--art);
  box-shadow:0 0 0 .8cqw var(--gilt),0 0 0 1.4cqw var(--paper-edge,rgba(0,0,0,.08)),inset 0 0 4cqw rgba(0,0,0,.5)}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:repeating-linear-gradient(135deg,transparent 0 6cqw,rgba(255,255,255,.04) 6cqw 7cqw),var(--art)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.jnum{display:none}
.ptile{position:relative;display:grid;place-items:center;transform:rotate(-6deg) translateY(2cqw);
  font:400 46cqw/1 var(--varsity);color:var(--ivory);-webkit-text-stroke:1.1cqw var(--gilt);paint-order:stroke fill;
  text-shadow:0 .8cqw 0 rgba(0,0,0,.3),0 2.4cqw 3cqw rgba(0,0,0,.45)}
.ptile.cat{font-size:30cqw;-webkit-text-stroke:0}
.plate{position:absolute;left:5cqw;right:5cqw;top:91cqw;bottom:4.6cqw;z-index:3;display:flex;flex-direction:column;align-items:center;gap:1cqw;text-align:center}
.cname{order:-1;max-width:100%;padding:1.6cqw 8cqw 1.2cqw;background:var(--ribbon);color:var(--ribbon-ink);
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);
  font:800 6cqw/1.12 var(--display);letter-spacing:.05em;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cname.xl{font-size:5.2cqw} .cname.xxl{font-size:4.5cqw}
.tagline{font:700 3.3cqw/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-top:.6cqw}
.cstats{display:flex;gap:4cqw;align-items:baseline;justify-content:center;margin-top:auto}
.cstat{display:flex;align-items:baseline;gap:1.2cqw;font:800 6cqw/1 var(--display);color:var(--ink-c)}
.cstat i{font:700 3cqw/1 var(--display);font-style:normal;letter-spacing:.16em;color:var(--accent)}
.flavor{display:none;font:italic 600 4.6cqw/1.2 var(--serif);color:var(--ink-c);opacity:.85}
.special{font:italic 700 4.6cqw/1.15 var(--serif);color:var(--accent)}
.special small{display:none;font:italic 500 4.2cqw/1.2 var(--serif);color:var(--ink-c);opacity:.85}
/* Grote kaart (bv. ingezoomd): kleiner venster, plaats voor citaat en special */
@container (min-width:300px){
  .win{left:15cqw;right:15cqw;height:75cqw}
  .plate{top:80cqw}
  .flavor{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .special small{display:block}
}
/* glans die de muis volgt + folie (zonder blend-modi) */
.card::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;opacity:var(--glare);transition:opacity .3s;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.34),rgba(255,255,255,.07) 30%,transparent 55%)}
.card::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;opacity:0}
/* common: ivoorpapier, navy lint */
.r-common{--rc:#1F2E52;--paper:linear-gradient(170deg,#FBF6E8,#EDE2C6);--gilt:#B8922A;--ribbon:#1F2E52;--ribbon-ink:#F5EEDC;--ink-c:#2A2438;--accent:#7A1626;
  --art:radial-gradient(120% 90% at 50% 30%,#2F4675,#14213D 65%,#0A1226)}
/* epic: crimson papier met goud */
.r-epic{--rc:#9B1B30;--paper:linear-gradient(170deg,#A82238,#6E1020);--gilt:#E6C873;--ribbon:#E6C873;--ribbon-ink:#3A0A14;--ink-c:#F5EEDC;--accent:#F2D58A;
  --art:radial-gradient(120% 90% at 50% 30%,#3B5486,#14213D 65%,#0A1226)}
.r-epic::before{opacity:.14;background:linear-gradient(125deg,#ff3e7f 0%,#ffd23e 14%,#3effa5 28%,#3ec5ff 42%,#b43eff 56%,#ff3e7f 70%,#ffd23e 84%,#3effa5 100%) var(--mx) var(--my)/300% 300%}
.r-epic.tilting::before{opacity:.26}
/* legendary: bladgoud met glitter */
.r-legendary{--rc:#B8922A;--paper:linear-gradient(150deg,#FFF3C4,#E6C873 25%,#B8922A 50%,#F1DC92 72%,#C9A227);--gilt:#7A5A0A;--ribbon:#9B1B30;--ribbon-ink:#F7E3A6;--ink-c:#3A2705;--accent:#7A1626;--paper-edge:rgba(122,90,10,.3);
  --art:radial-gradient(120% 90% at 50% 30%,#9B1B30,#5E0F1E 65%,#2E0610);
  box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.5),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75),0 0 6cqw -1cqw rgba(255,210,90,.6)}
.r-legendary::before{opacity:.4;background:
    radial-gradient(circle,rgba(255,255,255,.95) 0 .35cqw,transparent .6cqw) 0 0/7cqw 7cqw,
    radial-gradient(circle,rgba(255,255,255,.7) 0 .25cqw,transparent .5cqw) 3.5cqw 3.5cqw/9cqw 9cqw,
    linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 35%,rgba(255,240,190,.4) 45%,transparent 58%,rgba(255,255,255,.35) 74%,transparent 90%) var(--mx) var(--my)/260% 260%}
.r-legendary.tilting::before{opacity:.6}
/* detention: schoolbord */
.r-cat{--rc:#2E5444;--paper:radial-gradient(circle at 25% 70%,rgba(255,255,255,.06),transparent 30%),linear-gradient(170deg,#3A6553,#22412F);--gilt:#B88A55;--ribbon:#F2EEE4;--ribbon-ink:#22412F;--ink-c:#F2EEE4;--accent:#BFE8D2;
  --art:radial-gradient(120% 90% at 50% 30%,#2E5444,#173328 70%)}
.card.locked{filter:saturate(.25) brightness(.72)}
.card.locked .art{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 3cqw,transparent 3cqw 6cqw),#0A1226}
.q{font:800 40cqw/1 var(--display);color:rgba(255,255,255,.2)}
.dupe{position:absolute;right:-6px;top:-8px;z-index:7;padding:4px 10px;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A05;font:800 13px/1 var(--display);box-shadow:0 4px 12px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.card{transform:none !important}}

/* Achterkant van de kaart: afbeelding (cards/card-back.webp) met RIZZ op het lint.
   Iets ingezoomd zodat de afgeronde hoeken van de afbeelding wegvallen. */
.cardback{position:relative;aspect-ratio:5/7;border-radius:3.6cqw;overflow:hidden;
  background:#14213D url('cards/card-back.webp') 50% 50%/auto 104% no-repeat;
  box-shadow:inset 0 0 0 .5cqw rgba(201,162,39,.35),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75)}
.cardback::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);animation:shine 5s ease-in-out infinite}
.book .cardback::after,.grid .cardback::after,.lite .cardback::after{display:none}
.cb-ribbon{position:absolute;left:50%;top:66.3%;transform:translate(-50%,-50%);white-space:nowrap;
  font:900 8cqw/1 var(--display);letter-spacing:.32em;padding-left:.32em;color:#6E1020;text-shadow:0 .25cqw 0 rgba(255,255,255,.6)}

/* ---------- Kaart groot bekijken ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;overflow:visible;color:var(--ink)}
dialog::backdrop{background:radial-gradient(circle at 50% 40%,rgba(20,33,61,.88),rgba(4,8,16,.95))}
@keyframes zoom-in{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:none}}
.zoombox{width:min(430px,88vw,calc((92vh - 80px) * .714));display:grid;gap:12px;justify-items:center;animation:zoom-in .3s var(--spring) both}
.zoom-card{width:100%;background:none;border:0;padding:0;cursor:pointer;display:block;text-align:left;color:inherit;font:inherit;touch-action:none}
.zoom-inner{transition:transform .2s ease-in}
.zoom-card.turning .zoom-inner{transform:rotateY(90deg) scale(.96)}
.zoom-card.turning-back .zoom-inner{transition:transform .2s ease-out}
.zoomhint{color:var(--ink-soft);font:italic 500 17px var(--serif);margin:0;text-align:center}
.zoombox .link{color:#fff}
@media (prefers-reduced-motion:reduce){.zoom-inner,.zoom-card.turning-back .zoom-inner{transition:none}}

/* ---------- Pop-ups ---------- */
.infobox,.accbox,.packbox{position:relative;border-radius:14px;animation:zoom-in .3s var(--spring) both;color:var(--ink)}
.infobox{width:min(540px,92vw);max-height:88vh;overflow-y:auto;padding:26px}
.infobox h2{color:var(--gold2)}
.infobox p,.infobox li{color:var(--ink-soft)}
.infobox ul{padding-left:20px;margin:8px 0 12px}
.infobox .link{padding-left:0}
.accbox{width:min(440px,92vw);max-height:92vh;overflow-y:auto;padding:28px;display:grid;gap:6px}
.accbox h2{margin-bottom:4px}
.packbox{width:min(780px,94vw);max-height:92vh;overflow-y:auto;padding:26px;display:grid;gap:10px;justify-items:center;text-align:center;overflow-x:hidden}
.packbox .stage{margin-top:4px;min-height:0}
.packbox .stage::before,.packbox .stage::after{display:none}
.photorow{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.photopreview{width:68px;height:68px;border-radius:50%;background-color:var(--navy2);background-size:cover;background-position:center;border:3px solid var(--gold);color:#fff;display:grid;place-items:center;font:800 24px var(--display);flex-shrink:0}
.accbox .rowbtns{display:flex;gap:12px;margin-top:6px;align-items:center}
.accbox .rowbtns .btn{width:auto;flex:1}
.acc-switch{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;display:grid;gap:8px}
.acc-switch h4{margin:0}
.acc-switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc-switch-row small{color:var(--muted)}
.acc-switch .link{justify-self:start;padding-left:0}
.update-bar{position:fixed;left:0;right:0;margin:0 auto;bottom:22px;z-index:1000;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 24px);padding:12px 18px;border-radius:12px;font-weight:600;animation:zoom-in .3s var(--spring) both}
.update-bar .btn{width:auto}
@media (max-width:899px){.update-bar{bottom:96px}}

/* ---------- Yearbook: leren jaarboek ---------- */
.book{position:relative;padding:18px;border-radius:18px;perspective:2200px;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.06),transparent 40%),repeating-radial-gradient(circle at 70% 60%,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),linear-gradient(160deg,#8E1530,#55091C 60%,#3A0613);
  box-shadow:inset 0 0 0 2px #C9A227,inset 0 0 0 7px #55091C,inset 0 0 0 8px rgba(230,200,115,.6),0 40px 80px -30px rgba(0,0,0,.95)}
.spread{position:relative;display:grid;grid-template-columns:300px 1fr;min-height:640px;border-radius:8px;overflow:hidden;color:#14213D;
  background:linear-gradient(90deg,#F4EAD2,#FFF8E8 12%,#FFF8E8 88%,#F1E5CA);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.spread::before{content:"";position:absolute;left:300px;top:0;bottom:0;width:36px;margin-left:-18px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 45%,rgba(0,0,0,.28) 50%,rgba(0,0,0,.12) 55%,transparent)}
.index-page{padding:28px 18px 22px 22px;overflow-y:auto;max-height:860px;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(20,33,61,.06) 31px 32px)}
.index-title{display:flex;align-items:center;gap:10px;margin:0 0 4px;font:800 28px/1 var(--display);letter-spacing:.06em;text-transform:none;color:var(--crimson)}
.index-page .info-btn{width:26px;height:26px;margin:0;font-size:15px;color:#8C6A12;border-color:#B8922A;background:rgba(201,162,39,.15)}
.index-page .sub{display:block;font:italic 600 16px var(--serif);color:#7A6A4E;margin:0 0 16px}
.index-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.index-list button{width:100%;display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
  padding:8px 10px;border:0;border-radius:8px;background:none;color:#14213D;cursor:pointer;font:700 15.5px var(--body);transition:background .15s,transform .15s var(--ease-out)}
.index-list button:hover{background:rgba(20,33,61,.06);transform:translateX(3px)}
.ix-av{grid-row:1/3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--varsity);color:var(--ivory);background:linear-gradient(160deg,#2F4675,#14213D);box-shadow:inset 0 0 0 2px var(--gold)}
.ix-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.index-list .frac{font:700 13px var(--display);letter-spacing:.06em;color:#7A6A4E;font-variant-numeric:tabular-nums}
.ix-bar{grid-column:2/4;height:4px;border-radius:4px;background:rgba(20,33,61,.1);overflow:hidden;margin-top:4px}
.ix-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson2),var(--gold));border-radius:4px}
.index-list button[aria-current="true"]{background:linear-gradient(90deg,#14213D,#1F2E52);color:#fff;box-shadow:0 8px 20px -10px rgba(20,33,61,.8)}
.index-list button[aria-current="true"] .frac{color:var(--gold2)}
.index-list button[aria-current="true"] .ix-bar{background:rgba(255,255,255,.15)}
.index-list .index-dupes{border-top:1px dashed rgba(20,33,61,.2);margin-top:6px;padding-top:6px}
.ix-av.det{background:linear-gradient(160deg,#3A6553,#173328)}
.ix-av.dup{background:linear-gradient(160deg,var(--gold2),#8C6A12);color:#2A1A05;font:800 13px var(--display)}
.page-body{position:relative;padding:28px 30px 22px;display:flex;flex-direction:column;transform-origin:left center}
.pname{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px;font:800 clamp(30px,3.6vw,46px)/1 var(--display);letter-spacing:.03em;text-transform:none;color:#14213D}
.pname .ribbon{font:700 10.5px/1 var(--display);letter-spacing:.28em;text-transform:uppercase;color:#fff;background:var(--crimson);padding:6px 14px 5px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.pcount{color:#5A5170;font:italic 600 17px var(--serif);margin:0 0 6px}
.pbar{height:6px;border-radius:6px;background:rgba(20,33,61,.1);overflow:hidden;margin:4px 0 22px;max-width:420px}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--crimson2),var(--gold))}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;flex:1;align-content:start;max-width:760px}
.slot{display:block;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
button.slot{cursor:pointer;transition:transform .25s var(--ease-out)}
button.slot:hover{transform:translateY(-6px)}
.pageturn{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px dashed rgba(20,33,61,.2)}
.pageturn button{background:#14213D;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:700 12.5px var(--display);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #070A1C;transition:transform .1s}
.pageturn button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #070A1C}
.pageturn button:disabled{opacity:.25;cursor:default}
.pageturn .pnum{font:italic 600 18px var(--serif);color:#7A6A4E}
.page-body.turning{animation:pageturn .6s var(--ease-out)}
.page-body.turning::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 40%);animation:pageshade .6s ease-out forwards}
@keyframes pageturn{0%{opacity:.2;transform:rotateY(-70deg)}100%{opacity:1;transform:none}}
@keyframes pageshade{to{opacity:0}}
@media (max-width:899px){
  .book{padding:8px;border-radius:14px}
  .spread{grid-template-columns:minmax(0,1fr);min-height:0}
  .index-page{min-width:0}
  .spread::before{display:none}
  .index-page{max-height:none;padding:14px 12px 10px;border-bottom:1px dashed rgba(20,33,61,.2);overflow:visible}
  .index-title{font-size:24px}
  .index-page .sub{margin-bottom:10px}
  .index-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .index-list li{flex:0 0 auto;scroll-snap-align:start}
  .index-list .index-dupes{border:0;margin:0;padding:0}
  .index-list button{grid-template-columns:28px auto auto;padding:6px 10px;background:rgba(20,33,61,.05);font-size:14px}
  .ix-av{width:28px;height:28px;font-size:14px}
  .ix-bar{display:none}
  .page-body{padding:18px 12px 14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

/* ---------- Transcript (statistieken) ---------- */
.two-col,.three-col,.stats-wrap{display:grid;gap:24px 36px;align-items:start}
@media (min-width:1000px){
  .two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .three-col{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  #view .stats-wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
.bars-title{margin-top:6px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat-card{position:relative;border-radius:6px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  background:linear-gradient(180deg,#FBF6E8,#EDE2C6);border:1px solid #B8922A;box-shadow:inset 0 0 0 4px #FBF6E8,inset 0 0 0 5px rgba(155,27,48,.35),0 16px 30px -18px rgba(0,0,0,.9)}

.friend-name{flex:1;font-weight:700}

.friend-open:hover .friend-name{color:var(--gold2)}

.dup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}

.stepper{display:flex;align-items:center;gap:8px;margin-left:auto}

.trade-card{border-radius:12px;padding:18px 20px;display:grid;gap:8px}
.trade-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trade-side-label{font:700 10.5px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);min-width:86px}
.trade-arrow{text-align:center;color:var(--gold2);font:italic 600 19px var(--serif);margin:2px 0}
.trade-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.tmsg:empty{display:none}
.soon{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- Battle: op de parketvloer van het huis ---------- */
.battle-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.battle-top .page-head{margin-bottom:8px}
.diff-btn small,#challengeBattle small{font-weight:700;opacity:.8;margin-left:4px}
.battle-pick{display:flex;gap:16px;overflow-x:auto;padding:18px 8px 16px 14px;margin-top:6px;scroll-snap-type:x proximity}
.battle-pick .pick{flex:0 0 136px;scroll-snap-align:start}
@media (max-width:560px){.battle-pick .pick{flex-basis:120px}}
.pick{position:relative;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .25s var(--spring),opacity .2s,filter .2s;opacity:.72;filter:saturate(.7)}

  background:radial-gradient(circle at 40% 35%,#D63A4A,#9B1B30 60%,#6E1020);box-shadow:0 0 0 2px #8A1626,0 4px 12px rgba(0,0,0,.5)}

.battle-or{color:var(--ink-soft);font:700 10.5px var(--display);letter-spacing:.2em;text-transform:uppercase}
.battle-box{border-radius:12px;padding:12px 20px;max-width:680px;margin-bottom:6px}
.battle-box.highlight{border-color:var(--gold);box-shadow:inset 0 0 0 4px rgba(15,25,46,.96),inset 0 0 0 5px rgba(201,162,39,.35),0 0 34px -10px rgba(201,162,39,.5)}
.battle-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);max-width:680px}

.result-tag{font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:4px}

.result-tag.lost{background:#4A1520;color:#FFB3B8}

.leaderboard td:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 8px;font:800 18px var(--display);color:var(--gold2)}
.leaderboard td:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.leaderboard tr.me td{background:linear-gradient(90deg,rgba(155,27,48,.8),rgba(20,33,61,.92));font-weight:700;color:#fff}
.bt-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.bt-head h2{margin:0}
.bt-head .link{padding-left:0}
.bt-head .forfeit{margin-left:auto}
.bt-layout{display:grid;gap:18px;align-items:start}
@media (min-width:1100px){.bt-layout{grid-template-columns:auto minmax(0,1fr)}.bt-layout .battle-log{max-height:480px}.bt-layout .battle-result{margin-top:0}}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;width:min(640px,100%);margin-top:6px;padding:20px 18px;border-radius:12px;
  background:
    radial-gradient(70% 60% at 50% 30%,rgba(255,214,150,.16),transparent 70%),
    repeating-linear-gradient(0deg,transparent 0 58px,rgba(0,0,0,.35) 58px 60px),
    repeating-linear-gradient(90deg,#7A4528 0 34px,#5E331D 34px 36px,#8A5532 36px 70px,#5E331D 70px 72px,#6E3C22 72px 106px,#5E331D 106px 108px);
  border:3px solid #2A140A;box-shadow:inset 0 0 50px rgba(0,0,0,.6),0 30px 60px -24px rgba(0,0,0,.9)}
.bt-arena{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.bt-side{min-width:0}
.bt-name{font:800 16px var(--display);letter-spacing:.12em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.fighter{display:grid;gap:8px;justify-items:center}
.fighter-card{position:relative;width:100%;max-width:min(230px,calc((100vh - 330px) * .714))}
.bt-side .fighter-card{max-width:min(200px,calc((100vh - 480px) * .714))}
.fighter.hit .fighter-card{animation:shake .4s ease}
.fighter.ko .fighter-card .card{filter:grayscale(1) brightness(.5);transition:filter .3s}
.hpbar{width:100%;max-width:260px;height:12px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.6);border:1px solid rgba(201,162,39,.4)}
.hpfill{height:100%;background:linear-gradient(180deg,#6FCB93,#2E7D4F);transition:width .4s ease,background .4s}
.hpfill.mid{background:linear-gradient(180deg,#E6C873,#C9A227)}
.hpfill.low{background:linear-gradient(180deg,#F08A8F,#B8243C)}
.hptext{font:800 14px var(--display);letter-spacing:.08em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.energy{display:flex;gap:2px}
.energy .pip{font-size:15px;filter:grayscale(1);opacity:.3}
.energy .pip.on{filter:none;opacity:1}
.bench{display:grid;gap:5px;width:100%;max-width:220px}
.bench-card{display:flex;justify-content:space-between;gap:8px;min-width:0;padding:6px 10px;border-radius:6px;border:1px solid rgba(201,162,39,.3);background:rgba(10,18,36,.85);color:var(--ink);font:600 13px var(--body);text-align:left}
.bench-card span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-card .bench-hp{color:var(--green-soft);white-space:nowrap}
.bench-card.out{opacity:.4}
.bench-card.out .bench-hp{color:#F08A8F}
.bench-card:disabled{cursor:default}
.bt-side.choosing .bench-card:not(:disabled){cursor:pointer;border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(201,162,39,.25)}}
.vs{align-self:center;font:900 44px/1 var(--display);color:var(--gold2);text-shadow:0 3px 0 var(--wine),0 0 18px rgba(201,162,39,.45);animation:vs-pulse 2.4s ease-in-out infinite}
@keyframes vs-pulse{50%{transform:scale(1.08) rotate(-4deg)}}
@media (max-width:560px){.arena{gap:8px;padding:14px 10px}.vs{font-size:26px}.bt-head h2{font-size:24px}}
.bt-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:stretch;width:min(640px,100%)}
.move-btn{display:grid;justify-items:center;align-content:center;gap:3px;min-width:100px;flex:1;padding:9px 8px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#F1DC92,#D4B048 50%,#B8922A);color:#2A1A05;font:800 12px var(--display);letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 4px 0 #6E5410,inset 0 1px 0 rgba(255,255,255,.7);transition:transform .1s ease,box-shadow .1s ease,filter .2s}
.move-btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px)}
.move-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #6E5410}
.move-btn:disabled{opacity:.35;cursor:not-allowed}
.move-btn .move-icon{font-size:20px;line-height:1}
.move-btn small{font:600 11.5px var(--body);letter-spacing:0;text-transform:none;opacity:.8}
.move-btn[data-move="power"]{background:linear-gradient(180deg,#D63A4A,#9B1B30);color:#F5EEDC;box-shadow:0 4px 0 #5E0F1E,inset 0 1px 0 rgba(255,255,255,.35)}
.move-btn[data-move="special"]{background:linear-gradient(135deg,#FFF3C4,#E6C873 40%,#B8922A);box-shadow:0 4px 0 #6E5410,0 0 20px rgba(201,162,39,.5)}
.move-btn[data-move="guard"]{background:linear-gradient(180deg,#3B5486,#1F2E52);color:#F5EEDC;box-shadow:0 4px 0 #0A1226,inset 0 1px 0 rgba(255,255,255,.25)}
.move-btn[data-move="switch"]{background:linear-gradient(180deg,#3E9A63,#25683F);color:#F5EEDC;box-shadow:0 4px 0 #164428,inset 0 1px 0 rgba(255,255,255,.25)}

.battle-log .round-lines{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.battle-log li.mine{color:var(--green-soft)}
.battle-log li.theirs{color:#FFB3B8}
.battle-log li.ko-line{color:#fff}
.battle-result{max-width:680px;margin-top:18px;padding:20px 22px;border-radius:12px}
.battle-result h3{font-size:32px;margin-bottom:6px;text-transform:none}
.battle-result.won h3{color:var(--green-soft)}
.battle-result.lost h3{color:#F08A8F}
.battle-result p{color:var(--ink-soft);margin:0 0 12px}

/* ---------- Campus bookstore (shop) ---------- */
.shop-balance{font-size:17px;padding:8px 16px}
.shop-packs{display:grid;gap:14px}
.shop-pack{display:flex;gap:18px;align-items:center;border-radius:12px;padding:14px 18px;transition:transform .25s var(--ease-out),border-color .2s}
.shop-pack:hover{transform:translateY(-3px);border-color:rgba(201,162,39,.6)}

.shop-pack-info{display:grid;gap:6px;justify-items:start}
.shop-pack-info strong{font:800 20px/1.1 var(--display);letter-spacing:.06em}
.shop-pack-info small{color:var(--ink-soft)}
.shop-list{max-height:calc(100vh - 280px);overflow-y:auto;padding-right:6px}
.shop-list .battle-row{padding:6px 0}

/* ---------- Student council (ideeënbus) ---------- */
.ideas-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
@media (max-width:999px){.ideas-grid{grid-template-columns:1fr}}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink-soft);font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A05}
.idea-list{display:grid;gap:10px;max-height:calc(100vh - 260px);overflow-y:auto;padding-right:6px}
@media (max-width:999px){.idea-list{max-height:none}}
.idea{display:flex;gap:14px;align-items:flex-start;border-radius:10px;padding:12px 16px}
.idea.status-done,.idea.status-rejected{opacity:.6}
.vote{display:grid;justify-items:center;min-width:50px;padding:6px 4px;border:1px solid rgba(201,162,39,.35);border-radius:8px;background:rgba(0,0,0,.3);color:var(--ink-soft);cursor:pointer;font:800 17px/1 var(--display);transition:transform .2s var(--spring),border-color .2s}
.vote:active{transform:scale(.9)}
.vote .vote-arrow{font-size:12px;line-height:1.2}
.vote.on{border-color:var(--gold);background:rgba(201,162,39,.15);color:var(--gold2)}
.idea-main{flex:1;min-width:0}
.idea-body{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.idea-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;color:var(--muted);font-size:13px}
.idea-status{font-weight:700;color:var(--ink-soft)}
.idea-set{min-height:0;padding:3px 8px;font-size:12.5px;border-radius:6px}
.idea-meta .link{font-size:13px;padding:0}

/* Zuinige stand voor trage toestellen (wordt automatisch aangezet, zie autoLite) */
.lite .crest::after,.lite .welcome-banner::after{animation:none}
@media (prefers-reduced-motion:reduce){
  #view,.bulb.tw,.crest::after,.cardback::after,.pack,.pack-top,.seal,.glow,.page-body.turning,.shake,.particle,.rays,.fan .cw,.ghost-pack,.vs,.welcome-banner::after,.cb-in::after,.pack-hint,.stamp,.flash,.quake{animation:none !important}
}

// Werkt alle plekken bij die het saldo, de collectie en de streak tonen (scorebord, shop)
function syncCoinUI() {
  document.querySelectorAll('[data-coin]').forEach(el => { el.textContent = state.wallet; });
  document.querySelectorAll('[data-coll]').forEach(el => { el.textContent = collectionText(); });
  document.querySelectorAll('[data-streak]').forEach(el => { el.textContent = computeStreak(state.playDates); });
}
function collectionText() {
  const people = state.cards.filter(c => c.rarity !== 'cat');
  return `${people.filter(c => state.owned.has(c.id)).length}/${people.length}`;
}
// Aantal opeenvolgende dagen (tot en met vandaag of gisteren) dat er gespeeld is
function computeStreak(playedDates) {
  let streak = 0;
  const cursor = new Date(todayBrussels() + 'T00:00:00');
  if (!playedDates.has(todayBrussels())) cursor.setDate(cursor.getDate() - 1);
  while (playedDates.has(cursor.toLocaleDateString('sv-SE'))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

const todayBrussels = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' });
const LAUNCH_DATE = '2026-10-04';
const wordleNumber = (d = todayBrussels()) => Math.max(1, Math.round((Date.parse(d) - Date.parse(LAUNCH_DATE)) / 864e5) + 1);
const dateLabel = () => new Date().toLocaleDateString('nl-BE', { timeZone: 'Europe/Brussels', weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
const plural = n => n === 1 ? 'poging' : 'pogingen';

// ---------- Opstart en routing ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'PASSWORD_RECOVERY') {
      state.session = s; state.recovery = true;
      renderResetPassword();
      return;
    }
    const changed = s?.user?.id !== state.session?.user?.id;
    state.session = s;
    if (changed) route();
  });
  route();
}

// ---------- Snel wisselen tussen accounts op dit toestel ----------
// Sessies van eerder gebruikte accounts worden lokaal bewaard, zodat je zonder
// opnieuw in te loggen kan wisselen (bv. tussen admin en een gewoon testaccount).
const SAVED_KEY = 'rizz-saved-accounts';
function savedAccounts() {
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || {}; } catch (_) { return {}; }
}
function writeSavedAccounts(list) {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch (_) {}
}
async function saveCurrentAccount() {
  const { data: { session } } = await sb.auth.getSession(); // altijd de meest recente tokens
  if (!session) return;
  const list = savedAccounts();
  list[session.user.id] = {
    email: session.user.email, name: state.name || session.user.email,
    access_token: session.access_token, refresh_token: session.refresh_token
  };
  writeSavedAccounts(list);
}
function forgetAccount(userId) {
  const list = savedAccounts();
  delete list[userId];
  writeSavedAccounts(list);
}
async function switchAccount(userId) {
  await saveCurrentAccount();
  const target = savedAccounts()[userId];
  const { error } = await sb.auth.setSession({ access_token: target.access_token, refresh_token: target.refresh_token });
  if (error) {
    forgetAccount(userId);
    throw new Error(`Sessie van ${target.email} is verlopen. Log opnieuw in met dat account.`);
  }
}
async function addAnotherAccount() {
  await saveCurrentAccount();
  // Enkel de lokale sessie wissen (geen signOut), zodat de bewaarde sessie geldig blijft
  try { localStorage.removeItem(sb.auth.storageKey); } catch (_) {}
  location.reload();
}

async function route() {
  if (!state.session) {
    if (state.recovery && !authLinkError) authLinkError = 'De resetlink is ongeldig of verlopen.';
    state.recovery = false;
    renderAuth('login');
    return;
  }
  if (state.recovery) { renderResetPassword(); return; }
  app.innerHTML = '<p class="loading">Laden…</p>';
  try {
    await loadData();
    saveCurrentAccount();
    renderMain();
  } catch (e) {
    app.innerHTML = `<main class="wrap"><p role="alert" class="err">${esc(e.message)}</p><button class="btn" id="out">Uitloggen</button></main>`;
    $('#out').onclick = () => sb.auth.signOut();
  }
}

async function loadData() {
  const uid = state.session.user.id;
  const [cards, mine, prof, wallet, requests, admin, battlesIn, welcome, played] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('profiles').select('display_name, avatar_url, friend_code').eq('id', uid).maybeSingle(),
    sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle(),
    sb.from('friend_requests').select('id', { count: 'exact', head: true }).eq('recipient_id', uid),
    sb.from('admins').select('user_id').eq('user_id', uid).maybeSingle(),
    sb.from('tbattles').select('player_a, player_b, status, moved:state->moved').eq('mode', 'pvp').in('status', ['pending', 'active']).or(`player_a.eq.${uid},player_b.eq.${uid}`),
    sb.from('welcome_packs').select('user_id').eq('user_id', uid).maybeSingle(),
    sb.from('wordle_games').select('round_date').eq('user_id', uid).neq('status', 'playing')
  ]);
  for (const r of [cards, mine, prof, wallet]) if (r.error) throw new Error(r.error.message);
  // Niet fataal: enkel voor het bolletje op de Vrienden-tab
  state.incomingRequests = requests.error ? 0 : (requests.count || 0);
  // Admin ziet alle kaarten ontgrendeld (enkel weergave; echte bezittingen blijven ongewijzigd)
  state.isAdmin = !admin.error && !!admin.data;
  // Bolletje Battle: uitdagingen aan jou + gevechten tegen vrienden waarin jij aan zet bent
  state.incomingBattles = battlesIn.error ? 0 : (battlesIn.data || []).filter(b =>
    b.status === 'pending' ? b.player_b === uid : !(b.moved || {})[b.player_a === uid ? 'A' : 'B']).length;
  // Welkomstpakket nog niet opgehaald? (bestaat de tabel niet, dan geen knop)
  state.welcomeAvailable = !welcome.error && !welcome.data;
  state.playDates = new Set(played.error ? [] : (played.data || []).map(r => r.round_date));
  state.cards = cards.data;
  state.owned = new Map();
  for (const row of mine.data) state.owned.set(row.card_id, (state.owned.get(row.card_id) || 0) + 1);
  state.name = prof.data?.display_name || state.session.user.email.split('@')[0];
  state.avatarUrl = prof.data?.avatar_url || null;
  state.friendCode = prof.data?.friend_code || '';
  state.wallet = wallet.data?.polycoins || 0;
}

// Telt per card_id hoeveel exemplaren een gebruiker bezit, op basis van ruwe user_cards-rijen
function countByCard(rows) {
  const m = new Map();
  for (const r of rows) m.set(r.card_id, (m.get(r.card_id) || 0) + 1);
  return m;
}

// Getoond wanneer iemand via de link in de reset-mail binnenkomt
function renderResetPassword() {
  app.innerHTML = authShell(`
    <span class="kicker">Student login</span>
    <h2>Nieuw wachtwoord</h2>
    <p class="hint">Kies een nieuw wachtwoord voor ${esc(state.session?.user?.email)}.</p>

      <label>Nieuw wachtwoord<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label>Herhaal wachtwoord<input name="password2" type="password" required minlength="6" autocomplete="new-password"></label>

      <p id="resetmsg" role="alert" class="msg"></p>
    </form>`);
  $('#resetform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $('#resetmsg');
    const btn = e.target.querySelector('button[type=submit]');
    if (f.get('password') !== f.get('password2')) {
      msg.className = 'msg err'; msg.textContent = 'De wachtwoorden komen niet overeen.'; return;
    }
    msg.className = 'msg'; msg.textContent = 'Opslaan…'; btn.disabled = true;
    try {
      const { error } = await sb.auth.updateUser({ password: f.get('password') });
      if (error) throw error;
      msg.className = 'msg ok'; msg.textContent = 'Wachtwoord gewijzigd! Je wordt doorgestuurd…';
      state.recovery = false;
      history.replaceState(null, '', location.pathname);
      setTimeout(route, 1000);
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = err.message; btn.disabled = false;
    }
  };
}

function renderCardBack() {
