<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060914">
<title>Rizz Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Graduate&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   RIZZ ACADEMY — "Friday Night Lights"
   Een college-stadion bij nacht: schijnwerpers, scorebord, holo-kaarten.
   ===================================================================== */
:root{
  --night:#060914; --night2:#0B1029; --navy:#141C40; --navy2:#1E2A5A;
  --crimson:#A8193A; --crimson2:#D12C4F; --maroon:#6E1028;
  --gold:#F7C548; --gold2:#FFE08A; --gold-deep:#C48A12;
  --cream:#FFF3D6; --turf:#1E8A45; --turf2:#2FB35E;
  --ink:#F3F1FF; --ink-soft:#B8BFE0; --muted:#7D86B0; --line:rgba(255,255,255,.1);
  --glass:rgba(14,20,50,.66); --glass2:rgba(22,30,72,.78);
  --panel:rgba(14,20,50,.66); --bg2:#10163A;
  --led:#FFB01F;
  /* Wordle */
  --green:#2FB35E; --green-soft:#6EE59A; --yellow:#F7C548; --yellow-soft:#FFE08A;
  --amber:var(--gold); --amber-soft:var(--gold2); --grey:#7D86B0;
  --cat:#3F8F6B;
  --r:22px; --r-sm:14px;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --varsity:'Graduate','Rockwell',Georgia,serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.2,1.5,.35,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{margin:0 0 10px;line-height:1;color:#fff}
h1{font:400 clamp(44px,7vw,84px)/.92 var(--varsity)}
h2{font:400 clamp(30px,3.4vw,42px)/.95 var(--display);letter-spacing:.04em}
h3{font:400 25px/1 var(--display);letter-spacing:.06em;color:var(--cream)}
h4{font:700 15px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
button,input,textarea,select{font:inherit}
a{color:var(--gold2)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--ink-soft);margin:0 0 16px;max-width:72ch}
.col{max-width:760px}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.loading{padding:80px 16px;text-align:center;color:var(--muted);font:400 26px var(--display);letter-spacing:.12em;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- Het stadion (vaste achtergrond) ---------- */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:radial-gradient(130% 75% at 50% -12%,#24307A 0%,#111845 34%,#080C22 62%,#05070F 100%)}
.stars{position:absolute;inset:0 0 45% 0;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 46% 22%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 78% 26%,#fff,transparent),radial-gradient(1px 1px at 88% 6%,#fff,transparent),
    radial-gradient(1px 1px at 6% 34%,#fff,transparent),radial-gradient(1.3px 1.3px at 36% 36%,#fff,transparent),
    radial-gradient(1px 1px at 56% 40%,#fff,transparent),radial-gradient(1px 1px at 95% 38%,#fff,transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.tower{position:absolute;top:5vh;width:min(150px,22vw);aspect-ratio:3/1.15;z-index:2}
@media (min-width:900px){.scene .tower{top:15vh}.scene .tower.l{left:calc(268px + 1vw)}.scene .tower.r{right:-2vw}}
.tower.l{left:4vw;transform:rotate(-8deg)} .tower.r{right:4vw;transform:rotate(8deg)}
.lamps{position:absolute;inset:0;border-radius:6px;background:#1A1F38;padding:5px;
  box-shadow:0 0 0 2px #2A3156,0 0 40px 10px rgba(255,236,180,.35),0 0 120px 40px rgba(255,220,150,.18);
  background-image:radial-gradient(circle,#FFFDF0 0 34%,#FFE9A8 46%,transparent 62%);background-size:20% 50%;background-origin:content-box}
.tower::after{content:"";position:absolute;left:46%;top:100%;width:8%;height:30vh;background:linear-gradient(#2A3156,transparent)}
.beam{position:absolute;left:50%;top:40%;width:64vh;height:150vh;margin-left:-32vh;transform-origin:50% 0;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0deg 168deg,rgba(255,240,200,.12) 172deg,rgba(255,250,230,.3) 180deg,rgba(255,240,200,.12) 188deg,transparent 192deg 360deg);
  animation:sweep 13s ease-in-out infinite alternate;will-change:transform}
.tower.l .beam.b1{--a:-24deg} .tower.l .beam.b2{--a:-16deg;animation-duration:17s;animation-delay:-6s}
.tower .beam.b2{display:none}
.tower.r .beam.b1{--a:24deg;animation-delay:-3s} .tower.r .beam.b2{--a:17deg;animation-duration:15s;animation-delay:-9s}
@keyframes sweep{from{transform:rotate(calc(var(--a) - 7deg))}to{transform:rotate(calc(var(--a) + 7deg))}}
#bgfx,.crowd{position:absolute;inset:0;width:100%;height:100%}
#bgfx{z-index:3}
.flashes{position:absolute;inset:0}
.cflash{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 16%,rgba(255,250,230,.55) 34%,transparent 70%);animation:cflash .38s ease-out forwards}
@keyframes cflash{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
.field{position:absolute;left:-40%;right:-40%;bottom:-8vh;height:60vh;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;
  background:
    radial-gradient(40% 70% at 50% 40%,rgba(255,250,220,.22),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 3px,transparent 3px 8.333%),
    repeating-linear-gradient(90deg,#1A7A3C 0 4.1666%,#1E8A45 4.1666% 8.333%);
  -webkit-mask-image:linear-gradient(to top,#000 30%,rgba(0,0,0,.7) 60%,transparent 92%);mask-image:linear-gradient(to top,#000 30%,rgba(0,0,0,.7) 60%,transparent 92%)}
.field::after{content:"RA";position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 22vh/1 var(--varsity);color:rgba(255,255,255,.14);letter-spacing:.04em}
.haze{position:absolute;inset:0;
  background:radial-gradient(70% 35% at 50% 62%,rgba(168,25,58,.22),transparent 70%),radial-gradient(50% 30% at 50% 0%,rgba(120,150,255,.12),transparent 70%),
    linear-gradient(to bottom,transparent 55%,rgba(5,7,15,.5))}
@media (max-width:899px){.tower{top:24vh;width:20vw;opacity:.85}.tower.l{left:-4vw}.tower.r{right:-4vw}.tower .beam.b2{display:none}.beam{animation:none;transform:rotate(var(--a))}.field{height:40vh}}

/* ---------- App-indeling: zijbalk + hoofdvlak (+ dock op gsm) ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px 18px;display:flex;flex-direction:column;gap:20px;z-index:30;
  background:linear-gradient(180deg,rgba(9,12,32,.97),rgba(9,12,32,.9));
  border-right:1px solid var(--line);box-shadow:20px 0 60px -30px rgba(0,0,0,.9)}
.logo{display:flex;align-items:center;gap:12px;padding:0 6px;color:#fff;text-decoration:none}
.logo-txt{display:grid;line-height:.95}
.logo-txt b{font:400 25px var(--varsity);letter-spacing:.01em;color:var(--cream);text-shadow:0 2px 0 var(--crimson)}
.logo-txt small{font:700 11px var(--cond);letter-spacing:.34em;color:var(--gold);margin-top:5px}
.crest{position:relative;width:46px;height:54px;flex-shrink:0;display:grid;place-items:center;padding-bottom:7px;
  font:400 17px var(--varsity);color:var(--cream);background:linear-gradient(160deg,#D12C4F,#7A0F27);
  clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);
  box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 5px #7A0F27,inset 0 0 0 6px rgba(255,243,214,.55)}
.crest::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(0)}100%{transform:translateX(200%)}}
.crest.big{width:64px;height:76px;font-size:24px;padding-bottom:10px}
.nav{display:grid;gap:3px;margin:0;padding:0}
.nav-btn{position:relative;display:flex;align-items:center;gap:13px;width:100%;padding:9px 12px;border:0;border-radius:14px;background:none;color:var(--ink-soft);
  font:400 22px/1 var(--display);letter-spacing:.07em;cursor:pointer;text-align:left;transition:color .15s,background .2s,transform .15s var(--ease-out)}
.nav-btn .ni{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.06);font-size:17px;flex-shrink:0;transition:background .2s,transform .2s var(--spring)}
.nav-btn:hover{color:#fff;transform:translateX(3px)}
.nav-btn:hover .ni{transform:rotate(-8deg) scale(1.08)}
.nav-btn[aria-current="page"]{color:#fff;background:linear-gradient(90deg,rgba(209,44,79,.55),rgba(209,44,79,.06));box-shadow:inset 3px 0 0 var(--gold)}
.nav-btn[aria-current="page"] .ni{background:linear-gradient(160deg,var(--gold2),var(--gold));box-shadow:0 0 18px rgba(247,197,72,.55)}
.nav-btn .tab-badge{margin-left:auto}
.side-foot{margin-top:auto;display:grid;gap:10px}
.me-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.me-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(247,197,72,.4)}
.me-name{display:grid;line-height:1.15;min-width:0}
.me-name b{font:700 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-name small{color:var(--muted);font:600 12.5px var(--cond);letter-spacing:.12em;text-transform:uppercase}
.avbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background-color:var(--navy2);background-size:cover;background-position:center;color:#fff;
  font:400 20px var(--display);display:grid;place-items:center;padding:0;flex-shrink:0;box-shadow:0 0 0 3px rgba(247,197,72,.15)}
.main{min-width:0;padding:20px clamp(16px,2.6vw,36px) 48px;position:relative;overflow-x:clip}
.mtop{display:none}
.dock{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:12px 14px 112px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .mtop .logo-txt b{font-size:19px}
  .mtop .logo-txt small{font-size:9.5px;letter-spacing:.26em}
  .mtop .crest{width:36px;height:42px;font-size:14px;padding-bottom:5px}
  .mtop .logo{padding:0;gap:9px}
  .mtop-right{display:flex;align-items:center;gap:8px}
  .dock{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:60;gap:2px;padding:6px;overflow-x:auto;scrollbar-width:none;
    border-radius:22px;background:rgba(8,11,30,.97);border:1px solid rgba(255,255,255,.12);
    box-shadow:0 18px 40px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
  .dock::-webkit-scrollbar{display:none}
  .dock .nav-btn{flex:1 0 60px;display:grid;justify-items:center;gap:3px;padding:6px 4px;font:700 10.5px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;border-radius:16px;transform:none}
  .dock .nav-btn .ni{width:32px;height:30px;font-size:17px;background:none}
  .dock .nav-btn[aria-current="page"]{background:linear-gradient(180deg,rgba(209,44,79,.7),rgba(209,44,79,.25));box-shadow:inset 0 2px 0 var(--gold)}
  .dock .nav-btn[aria-current="page"] .ni{background:none;box-shadow:none;transform:scale(1.15)}
  .dock .nav-btn .tab-badge{position:absolute;top:2px;right:6px;margin:0}
}
.tab-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF3B5C;color:#fff;font:700 12px/1 var(--body);box-shadow:0 0 12px rgba(255,59,92,.8);animation:badge-pop .6s var(--spring)}
@keyframes badge-pop{from{transform:scale(0)}}
.coinpill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,176,31,.45);color:var(--led);font:400 20px/1 var(--display);letter-spacing:.06em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink-soft);font:700 12.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.pill-turn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1300;border-color:transparent;box-shadow:0 0 16px rgba(247,197,72,.45)}

/* ---------- Scorebord bovenaan ---------- */
.scoreboard{display:flex;align-items:stretch;margin-bottom:24px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#0B0E20,#04050C);border:2px solid #2A2F4C;
  box-shadow:inset 0 0 0 4px #0E1226,inset 0 2px 0 6px rgba(255,255,255,.02),0 16px 40px -14px rgba(0,0,0,.9),0 0 0 1px rgba(247,197,72,.12)}
.sb-cell{position:relative;flex:0 0 auto;min-width:118px;padding:9px 18px 8px;display:grid;gap:3px;border-right:2px solid #161B34}
.sb-cell::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:3px;background:repeating-linear-gradient(90deg,#3A2A10 0 4px,transparent 4px 8px)}
.sb-label{font:700 10.5px var(--cond);letter-spacing:.28em;color:#8890BC;text-transform:uppercase;margin-top:4px}
.sb-val{font:400 34px/1 var(--display);letter-spacing:.08em;color:var(--led);
  text-shadow:0 0 6px rgba(255,176,31,.9),0 0 22px rgba(255,120,0,.45);
  -webkit-mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.55) 66%,transparent 70%);-webkit-mask-size:3px 3px;mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.55) 66%,transparent 70%);mask-size:3px 3px}
.sb-val.red{color:#FF4D6A;text-shadow:0 0 6px rgba(255,77,106,.9),0 0 22px rgba(255,40,80,.45)}
.sb-val.green{color:#5DFF9A;text-shadow:0 0 6px rgba(93,255,154,.9),0 0 22px rgba(40,255,120,.4)}
.sb-ticker{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;border-right:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.sb-ticker::before{display:none}
.ticker{display:inline-flex;gap:48px;white-space:nowrap;font:400 26px/1 var(--display);letter-spacing:.12em;color:var(--led);padding-left:20px;
  text-shadow:0 0 6px rgba(255,176,31,.85);animation:ticker 38s linear infinite;
  -webkit-mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.5) 66%,transparent 70%);-webkit-mask-size:3px 3px;mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.5) 66%,transparent 70%);mask-size:3px 3px}
@keyframes ticker{to{transform:translateX(-50%)}}
@media (max-width:899px){
  .scoreboard{margin-bottom:16px;border-radius:14px}
  .sb-cell{flex:1;min-width:0;padding:7px 10px 6px}
  .sb-val{font-size:26px}
  .sb-label{font-size:9px;letter-spacing:.18em}
  .sb-ticker{display:none}
}

#view{animation:view-in .5s var(--ease-out) both}
@keyframes view-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#view{animation:none}}

/* ---------- Paginatitels ---------- */
.page-head{margin-bottom:18px}
.ph-row{display:flex;align-items:flex-end;gap:14px}
.page-head h2{margin:0;font:400 clamp(42px,5.6vw,68px)/.86 var(--display);letter-spacing:.03em;
  background:linear-gradient(180deg,#FFFFFF 18%,#FFE9A8 58%,#F7C548 82%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 var(--crimson)) drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.kicker{display:block;font:700 12.5px var(--cond);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.kicker::before{content:"";display:inline-block;width:26px;height:3px;margin-right:10px;vertical-align:middle;background:linear-gradient(90deg,var(--crimson2),var(--gold))}
.info-btn{width:34px;height:34px;flex-shrink:0;margin-bottom:6px;border-radius:50%;border:2px solid rgba(247,197,72,.6);background:rgba(247,197,72,.1);color:var(--gold2);
  font:italic 800 16px/1 Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .25s var(--spring),background .2s}
.info-btn:hover{transform:scale(1.15) rotate(-10deg);background:rgba(247,197,72,.25)}

/* ---------- Knoppen en formulieren ---------- */
.btn{position:relative;overflow:hidden;width:100%;min-height:52px;padding:12px 24px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#FFE9A3,#F7C548 46%,#E3A51F);color:#2A1300;font:400 24px/1 var(--display);letter-spacing:.09em;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:0 6px 0 #9A6505,0 14px 28px -10px rgba(247,197,72,.65),inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .12s ease,box-shadow .12s ease,filter .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 62%);transform:translateX(-120%);transition:transform .6s ease}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px)}
.btn:hover:not(:disabled)::after{transform:translateX(120%)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #9A6505,0 4px 10px -4px rgba(247,197,72,.5),inset 0 1px 0 rgba(255,255,255,.75)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.4)}
.btn.small{width:auto;min-height:0;padding:10px 18px;font-size:19px;border-radius:12px;box-shadow:0 4px 0 #9A6505,0 10px 20px -10px rgba(247,197,72,.6),inset 0 1px 0 rgba(255,255,255,.75)}
.btn.small:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #9A6505}
.btn small{font:700 12px var(--cond);letter-spacing:.04em;opacity:.75;margin-left:4px}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(184,191,224,.4);cursor:pointer;padding:10px 6px;font:600 15px var(--body)}
.link:hover{color:var(--gold2);text-decoration-color:currentColor}
.link.danger{color:#FF7D93}
.form{display:grid;gap:16px;margin:22px 0 8px}
.form label{display:grid;gap:7px;font:700 13px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.form input,.form textarea,.tselect,.idea-set{border:1px solid rgba(255,255,255,.14);background:rgba(4,6,18,.55);color:var(--ink);border-radius:var(--r-sm);padding:14px;min-height:52px;
  font:500 16px/1.4 var(--body);letter-spacing:0;text-transform:none;resize:vertical;transition:border-color .2s,box-shadow .2s,background .2s}
.form input:focus,.form textarea:focus,.tselect:focus{outline:none;border-color:var(--gold);background:rgba(4,6,18,.75);box-shadow:0 0 0 4px rgba(247,197,72,.18),0 0 24px -6px rgba(247,197,72,.6)}
.tselect{width:100%;min-height:50px;padding:12px}
.tselect option{background:#10163A}
.msg{margin:0;min-height:1.5em;font:600 15px var(--body)}
.msg.err,.err{color:#FF7D93}
.msg.ok{color:var(--green-soft)}

/* Glazen panelen */
.stat-card,.friend-row,.trade-card,.battle-box,.idea,.shop-pack,.round-closed,.odds,.battle-result,.battle-log,.infobox,.accbox,.packbox,.update-bar,.glass{
  background:linear-gradient(180deg,rgba(26,34,82,.92),rgba(12,17,44,.92));border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 22px 44px -24px rgba(0,0,0,.9)}

/* ---------- Inlogscherm ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:clamp(20px,4vw,60px);max-width:1180px;margin:0 auto;padding:40px clamp(16px,4vw,48px)}
.auth-hero{position:relative;display:grid;gap:16px;justify-items:start}
.auth-hero .crest{width:72px;height:86px;font-size:27px;padding-bottom:12px}
.auth h1{color:var(--cream);margin:6px 0 0;
  text-shadow:0 1px 0 #E3A51F,0 2px 0 #E3A51F,0 3px 0 #C48A12,0 4px 0 #D12C4F,0 5px 0 #A8193A,0 6px 0 #A8193A,0 7px 0 #7A0F27,0 8px 0 #7A0F27,0 16px 30px rgba(0,0,0,.7)}
.auth h1 em{display:block;font:400 clamp(26px,3.4vw,40px)/1 var(--display);letter-spacing:.32em;color:var(--gold);font-style:normal;margin-top:14px;text-shadow:0 0 24px rgba(247,197,72,.45)}
.auth-tag{color:var(--ink-soft);font:500 18px/1.5 var(--body);max-width:44ch;margin:0}
.fan{position:relative;height:260px;width:min(420px,100%);margin-top:14px}
.fan .cw{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;transition:transform .5s var(--spring);animation:float 5s ease-in-out infinite}
.fan .cw:nth-child(1){transform:translateX(-120px) rotate(-16deg) translateY(26px);animation-delay:-1.5s}
.fan .cw:nth-child(2){z-index:2;animation-delay:-.4s}
.fan .cw:nth-child(3){transform:translateX(120px) rotate(16deg) translateY(26px);animation-delay:-2.7s}
.fan:hover .cw:nth-child(1){transform:translateX(-160px) rotate(-22deg) translateY(20px)}
.fan:hover .cw:nth-child(3){transform:translateX(160px) rotate(22deg) translateY(20px)}
@keyframes float{50%{translate:0 -12px}}
.auth-box{padding:30px clamp(20px,3vw,34px);border-radius:26px;position:relative;
  background:linear-gradient(180deg,rgba(26,34,82,.95),rgba(10,14,38,.96));border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 40px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(247,197,72,.1)}
.auth-box::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--crimson2),var(--gold),transparent)}
.auth-box h2{font-size:40px;margin-bottom:4px}
.auth-box .form{margin-top:18px}
.auth-links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
@media (max-width:899px){
  .auth{grid-template-columns:1fr;padding:22px 16px 40px;gap:8px}
  .auth-hero{justify-items:center;text-align:center}
  .auth-tag{font-size:16px}
  .fan{height:200px;width:100%}
  .fan .cw{width:118px;margin-left:-59px}
  .fan .cw:nth-child(1){transform:translateX(-86px) rotate(-14deg) translateY(20px)}
  .fan .cw:nth-child(3){transform:translateX(86px) rotate(14deg) translateY(20px)}
}

/* ---------- Welkomstbanner ---------- */
.welcome-banner{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding:18px 22px;border-radius:20px;overflow:hidden;
  background:linear-gradient(110deg,rgba(209,44,79,.55),rgba(26,34,82,.7) 55%,rgba(247,197,72,.25));border:1px solid rgba(247,197,72,.5);
  box-shadow:0 0 0 1px rgba(247,197,72,.2),0 20px 50px -20px rgba(209,44,79,.6)}
.welcome-banner::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);animation:shine 5s ease-in-out infinite}
.wb-icon{font-size:40px;line-height:1;animation:float 3s ease-in-out infinite}
.wb-text{flex:1;min-width:200px}
.wb-text strong{display:block;font:400 28px/1 var(--display);letter-spacing:.06em;color:#fff}
.welcome-banner .btn{width:auto;position:relative;z-index:1}

/* ---------- Today: Wordle in scorebord-kader + podium ---------- */
.today-grid{display:grid;gap:28px;align-items:start}
.today-grid .col{max-width:none}
@media (min-width:1100px){.today-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.board-frame{position:relative;max-width:560px;padding:26px 22px 20px;border-radius:28px;
  background:radial-gradient(120% 60% at 50% 0%,rgba(60,80,180,.35),transparent 60%),linear-gradient(180deg,#121A44,#080C24);
  border:3px solid #2C356C;box-shadow:inset 0 0 0 6px #0B1030,inset 0 0 40px rgba(0,0,0,.6),0 30px 60px -24px rgba(0,0,0,.95),0 0 60px -20px rgba(120,150,255,.35)}
.bulbs{position:absolute;inset:7px;border-radius:21px;pointer-events:none;
  --dim:radial-gradient(circle,#5E4A1C 0 2px,transparent 3px);
  --lit:radial-gradient(circle,#FFF6D0 0 2px,#FFC93D 3px,rgba(255,180,40,.35) 4.5px,transparent 6px);
  background:var(--dim) 6px 0/12px 12px repeat-x,var(--dim) 6px 100%/12px 12px repeat-x,var(--dim) 0 6px/12px 12px repeat-y,var(--dim) 100% 6px/12px 12px repeat-y}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;border-radius:inherit}
.bulbs::before{background:var(--lit) 6px 0/24px 12px repeat-x,var(--lit) 18px 100%/24px 12px repeat-x,var(--lit) 0 18px/12px 24px repeat-y,var(--lit) 100% 6px/12px 24px repeat-y;animation:chase .55s steps(1) infinite}
.bulbs::after{background:var(--lit) 18px 0/24px 12px repeat-x,var(--lit) 6px 100%/24px 12px repeat-x,var(--lit) 0 6px/12px 24px repeat-y,var(--lit) 100% 18px/12px 24px repeat-y;animation:chase .55s steps(1) infinite reverse}
@keyframes chase{50%{opacity:0}}
.bf-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 16px}
.bf-head .info-btn{margin:0;width:30px;height:30px;font-size:14px}
.bf-title{font:400 30px/1 var(--display);letter-spacing:.16em;color:#fff;text-shadow:0 0 18px rgba(120,150,255,.6)}
.bf-num{font:400 30px/1 var(--display);letter-spacing:.08em;color:var(--led);text-shadow:0 0 8px rgba(255,176,31,.9);padding:4px 10px;border-radius:8px;background:#05060F;border:1px solid #2A2F4C}
.round-tabs{display:flex;gap:8px;margin-bottom:14px;max-width:560px}
.round-tab{flex:1;display:grid;gap:1px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:8px 14px;color:var(--ink);background:rgba(255,255,255,.04);font:400 20px var(--display);letter-spacing:.06em;cursor:pointer}
.round-tab small{font:600 12.5px var(--body);color:var(--ink-soft);letter-spacing:0}
.round-tab.active{border-color:var(--gold);background:rgba(247,197,72,.12)}
.wboard{--rows:6;position:relative;display:grid;gap:7px;width:min(320px,100%,calc((100vh - 470px) * 5 / var(--rows)));min-width:210px;margin:0 auto 10px}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.wrow.shake{animation:shake .4s ease}
.wtile{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;user-select:none;color:#fff;font:400 clamp(26px,7vw,38px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:2px solid rgba(255,255,255,.1);box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.wtile.filled{border-color:#A9B3EA;background:rgba(120,140,255,.1);box-shadow:0 0 16px -4px rgba(140,160,255,.7);animation:tile-pop .14s ease}
.wtile.g{background:linear-gradient(180deg,#4BE07F,#1E8A45);border-color:#6EF29C;box-shadow:0 0 22px -4px rgba(47,179,94,.85),inset 0 2px 0 rgba(255,255,255,.35)}
.wtile.y{background:linear-gradient(180deg,#FFE08A,#E3A51F);border-color:#FFE9A8;color:#2A1300;box-shadow:0 0 22px -4px rgba(247,197,72,.85),inset 0 2px 0 rgba(255,255,255,.5)}
.wtile.x{background:#232A55;border-color:#2C3468;color:#8A93C4;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.wtile.flip{animation:wflip .55s ease-in-out both;animation-delay:calc(var(--i) * .22s)}
@keyframes wflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg) scale(.96)}100%{transform:rotateX(0)}}
@keyframes tile-pop{50%{transform:scale(1.12)}}
.wmsg{text-align:center;min-height:1.4em;margin:0 auto 10px;max-width:440px}
.wkeys{display:grid;gap:6px;width:min(520px,100%);margin:0 auto}
.wkrow{display:flex;gap:5px;justify-content:center}
.wkey{flex:1;max-width:46px;height:clamp(42px,6.4vh,54px);border:0;border-radius:9px;cursor:pointer;padding:0;touch-action:manipulation;
  background:linear-gradient(180deg,#3A4585,#262E62);color:#fff;font:400 21px/1 var(--display);letter-spacing:.04em;
  box-shadow:0 4px 0 #141A42,inset 0 1px 0 rgba(255,255,255,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.wkey:hover{filter:brightness(1.15)}
.wkey:active{transform:translateY(3px);box-shadow:0 1px 0 #141A42}
.wkey.wide{flex:1.6;max-width:72px;font-size:17px}
.wkey.g{background:linear-gradient(180deg,#4BE07F,#1E8A45);box-shadow:0 4px 0 #0E4D24}
.wkey.y{background:linear-gradient(180deg,#FFE08A,#E3A51F);color:#2A1300;box-shadow:0 4px 0 #8A5A06}
.wkey.x{background:#161B3C;color:#5D6696;box-shadow:0 4px 0 #0A0E26}
.whelp{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;margin-top:10px}
.whelp .link{font-size:14px;padding:4px 2px}
.whelp .link:disabled{opacity:.4;cursor:default}
.hint-chip{background:rgba(247,197,72,.15);border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:3px 10px;font:700 13px var(--body)}
.round-closed{text-align:center;padding:36px 10px;border-radius:var(--r)}
.big-lock{font-size:52px;line-height:1;margin-bottom:10px}
.countdown{font:400 46px var(--display);letter-spacing:.08em;color:var(--led);text-shadow:0 0 10px rgba(255,176,31,.8);margin:6px 0 0}

/* Podium met spotlight waarop het pakje/de kaart staat */
.stage{position:relative;display:grid;justify-items:center;gap:14px;min-height:420px;align-content:start;padding-top:8px;isolation:isolate}
.stage::before{content:"";position:absolute;left:50%;top:-40px;width:min(560px,120%);height:calc(100% + 40px);transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0deg 158deg,rgba(255,244,214,.13) 170deg 190deg,transparent 202deg 360deg);filter:blur(4px)}
.stage::after{content:"";position:absolute;left:50%;bottom:6px;width:min(380px,90%);height:46px;transform:translateX(-50%);z-index:-1;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,236,190,.4),rgba(247,197,72,.12) 60%,transparent);box-shadow:0 0 0 2px rgba(247,197,72,.08)}
.stage .cw{width:min(360px,86vw,calc((100vh - 240px) * .714))}
.stage-placeholder{display:grid;justify-items:center;gap:18px;padding:30px 20px 64px;text-align:center;color:var(--ink-soft)}
.stage-placeholder p{margin:0;font:400 24px var(--display);letter-spacing:.1em;color:var(--ink-soft)}
.ghost-pack{width:170px;aspect-ratio:5/7.4;border-radius:12px;display:grid;place-items:center;font:400 90px var(--varsity);color:rgba(255,255,255,.18);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px),linear-gradient(160deg,rgba(60,74,160,.45),rgba(20,26,70,.6));
  border:2px dashed rgba(255,255,255,.18);animation:float 4s ease-in-out infinite;box-shadow:0 30px 40px -20px rgba(0,0,0,.8)}
.result{margin:0;text-align:center;font:600 18px/1.4 var(--body);color:var(--ink);max-width:48ch;position:relative;z-index:3}
.odds{margin:4px 0 22px;border-radius:var(--r-sm);padding:14px 18px}
.odds-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
.odds-table th,.odds-table td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.odds-table th{color:var(--gold2);font:400 18px var(--display);letter-spacing:.08em}
.odds-table td{color:var(--ink-soft)}
.odds-table tr:last-child td{border-bottom:0;font-style:italic}
@media (max-width:899px){
  .stage:has(.stage-placeholder){display:none}
  .board-frame{padding:22px 12px 16px;border-radius:24px}
  .bf-title,.bf-num{font-size:24px}
  .wboard{width:min(300px,100%,calc((100vh - 440px) * 5 / var(--rows)))}
}

/* ---------- Pakje: spotlight, stralen, scheuren, flits ---------- */
.pack-stage{position:relative;display:grid;justify-items:center;gap:18px;width:100%;padding-top:110px}
.rays{position:absolute;left:50%;top:calc(110px + min(185px,45.9vw));width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.24) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 30%,transparent 62%);
  animation:spin 26s linear infinite;transition:transform .6s var(--ease-out),opacity .6s}
.rays.r-epic{background:repeating-conic-gradient(from 0deg,rgba(255,90,130,.3) 0deg 5deg,transparent 5deg 15deg)}
.rays.r-legendary{background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.45) 0deg 6deg,transparent 6deg 14deg)}
.rays.charge{animation-duration:3s;transform:scale(1.15)}
.rays.burst{transform:scale(1.9);opacity:0;transition:transform 1.1s var(--ease-out),opacity 1.4s ease}
@keyframes spin{to{rotate:360deg}}
.pack{position:relative;z-index:2;width:min(250px,62vw);aspect-ratio:5/7.4;background:none;border:0;padding:0;cursor:pointer;container-type:inline-size;
  animation:pack-idle 2.8s ease-in-out infinite;filter:drop-shadow(0 26px 30px rgba(0,0,0,.7))}
.pack-body{position:absolute;inset:8% 0 0 0;z-index:2;border-radius:4px 4px 10px 10px;overflow:hidden;display:grid;place-items:center;
  background:
    linear-gradient(115deg,transparent 28%,rgba(255,255,255,.5) 44%,rgba(255,255,255,.1) 52%,transparent 60%),
    repeating-linear-gradient(60deg,rgba(255,255,255,.06) 0 2px,transparent 2px 16px),
    radial-gradient(circle at 50% 42%,rgba(255,230,160,.55),transparent 45%),
    conic-gradient(from 200deg at 50% 42%,#A8193A,#F7C548,#141C40,#D12C4F,#FFE08A,#1E2A5A,#A8193A);
  background-size:280% 280%,auto,auto,auto;animation:foil 3.4s linear infinite;transition:transform .5s ease-in,opacity .5s ease-in}
.pack-body::before{content:"";position:absolute;inset:4%;border:1.2cqw solid rgba(255,243,214,.55);border-radius:3cqw;pointer-events:none}
.pack-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5.5%;background:repeating-linear-gradient(90deg,#FFE08A 0 4px,#A97B17 4px 8px)}
.pack-label{position:relative;display:grid;justify-items:center;gap:2cqw;text-align:center;color:var(--cream)}
.pack-crest{width:34cqw;height:40cqw;display:grid;place-items:center;padding-bottom:5cqw;font:400 13cqw/1 var(--varsity);color:var(--cream);
  background:linear-gradient(160deg,#D12C4F,#6E1028);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);
  box-shadow:inset 0 0 0 1.6cqw var(--gold),inset 0 0 0 2.6cqw #6E1028,inset 0 0 0 3.1cqw rgba(255,243,214,.6)}
.pack-logo{font:400 15cqw/.9 var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 1cqw 0 var(--crimson),0 0 6cqw rgba(0,0,0,.6)}
.pack-sub{font:700 5cqw/1 var(--cond);letter-spacing:.34em;color:var(--gold2)}
.pack-count{margin-top:1cqw;padding:1.4cqw 4cqw;border-radius:99px;background:rgba(0,0,0,.55);font:700 4.6cqw/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:#fff}
.pack-top{position:absolute;left:0;right:0;top:0;height:9%;z-index:3;border-radius:10px 10px 2px 2px;
  background:repeating-linear-gradient(90deg,#FFE08A 0 4px,#A97B17 4px 8px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transform-origin:10% 100%}
.pack-top::after{content:"";position:absolute;left:4%;right:4%;bottom:-3px;border-bottom:2px dashed rgba(255,255,255,.6)}
.pack-card{position:absolute;left:8%;right:8%;top:14%;z-index:1;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.stage .pack-card .cw,.stage .pack-slot .cw{width:100%}
.pack-hint{position:relative;z-index:2;margin:0;font:400 22px var(--display);letter-spacing:.14em;color:var(--gold2);text-shadow:0 0 14px rgba(247,197,72,.5);animation:blink 1.6s ease-in-out infinite}
.pack.charging{animation:pack-charge .9s ease-in both}
.pack.charging.r-epic{filter:drop-shadow(0 0 30px #FF4D79) drop-shadow(0 0 70px rgba(255,77,121,.6))}
.pack.charging.r-legendary{filter:drop-shadow(0 0 34px #FFD25A) drop-shadow(0 0 90px rgba(255,210,90,.75))}
.pack.charging.r-common,.pack.charging.r-cat{filter:drop-shadow(0 0 24px rgba(180,200,255,.7))}
.pack.torn .pack-top{animation:tear .6s ease-out forwards}
.pack.torn .pack-card{transform:translateY(-55%) rotate(-3deg)}
.pack.done .pack-body{transform:translateY(60%) rotate(6deg);opacity:0}
.pack.done .pack-card{transition:opacity .35s;opacity:0}
@keyframes pack-idle{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-10px)}}
@keyframes pack-charge{0%{transform:scale(1)}20%{transform:scale(1.04) rotate(-4deg)}40%{transform:scale(1.07) rotate(4deg)}60%{transform:scale(1.1) rotate(-5deg)}80%{transform:scale(1.13) rotate(5deg)}100%{transform:scale(1.16) rotate(0)}}
@keyframes foil{0%{background-position:0 0,0 0,0 0,0 0}100%{background-position:100% 100%,0 0,0 0,0 0}}
@keyframes tear{0%{transform:none}35%{transform:rotate(-5deg)}100%{transform:translate(70%,-220%) rotate(40deg);opacity:0}}
.pack-results{position:relative;z-index:2;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;perspective:1200px}
.pack-slot{position:relative;width:min(300px,78vw)}
.pack-results.multi .pack-slot{width:min(200px,28vw)}
.pack-slot .flipper{position:relative;z-index:1;transition:transform .24s ease-in}
.pack-slot .flipper.rise{animation:rise .7s var(--spring) both}
@keyframes rise{from{transform:translateY(60px) scale(.6);opacity:0}}
.pack-slot .flipper.turning{transform:rotateY(90deg) scale(.96)}
.pack-slot .flipper.turning-back{transition:transform .24s ease-out}
.glow{position:absolute;inset:-35%;pointer-events:none;border-radius:50%;filter:blur(34px);opacity:0;animation:glow-in .8s ease-out both}
@keyframes glow-in{from{opacity:0;transform:scale(.5)}to{opacity:.7;transform:scale(1)}}
.glow.common{background:radial-gradient(circle,#7F9BFF,transparent 70%)}
.glow.epic{background:radial-gradient(circle,#FF4D79,transparent 70%)}
.glow.legendary{background:radial-gradient(circle,#FFD25A,transparent 70%);animation:glow-in .8s ease-out both,glow-pulse 1.6s ease-in-out .8s infinite}
.glow.cat{background:radial-gradient(circle,#6FD0A4,transparent 70%)}
@keyframes glow-pulse{50%{opacity:.95;transform:scale(1.08)}}
.particles{position:absolute;inset:0;pointer-events:none;z-index:3}
.particle{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--pc,#fff);box-shadow:0 0 8px var(--pc,#fff);opacity:0;animation:spark-fly 1.2s ease-out forwards;animation-delay:var(--pd,0s)}
@keyframes spark-fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.2)}}
.confetti{display:none}
.shake{animation:shake .4s ease}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.cardflip{animation:card-flip .9s cubic-bezier(.2,1.35,.35,1) both}
@keyframes card-flip{0%{transform:perspective(900px) rotateY(180deg) scale(.35);opacity:0}60%{transform:perspective(900px) rotateY(-14deg) scale(1.07);opacity:1}100%{transform:none;opacity:1}}

/* Flits, stempel en schermschok */
.flash{position:fixed;inset:0;z-index:900;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff,rgba(255,236,180,.85) 40%,rgba(255,220,140,0) 75%);animation:flash .9s ease-out forwards}
.flash.epic{background:radial-gradient(circle at 50% 45%,#fff,rgba(255,120,160,.8) 40%,rgba(255,80,120,0) 75%)}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.stamp{position:fixed;left:50%;top:44%;z-index:950;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg);white-space:nowrap;text-align:center;
  font:400 clamp(64px,13vw,180px)/.85 var(--display);letter-spacing:.04em;color:#fff;
  -webkit-text-stroke:3px rgba(0,0,0,.35);text-shadow:0 6px 0 var(--crimson),0 12px 0 #5E0A20,0 20px 40px rgba(0,0,0,.6);
  animation:stamp 1.9s cubic-bezier(.2,1.3,.4,1) forwards}
.stamp small{display:block;font:700 clamp(14px,1.8vw,22px)/1 var(--cond);letter-spacing:.5em;-webkit-text-stroke:0;text-shadow:0 2px 8px rgba(0,0,0,.8);margin-top:10px;color:var(--gold2)}
.stamp.k-win{background:linear-gradient(180deg,#fff 30%,#FFE08A 60%,#F7C548);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 var(--crimson)) drop-shadow(0 16px 30px rgba(0,0,0,.7));text-shadow:none;-webkit-text-stroke:0}
.stamp.k-legendary{background:linear-gradient(180deg,#FFFBEA 20%,#FFE08A 50%,#E3A51F 80%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:0;
  filter:drop-shadow(0 6px 0 #8A5A06) drop-shadow(0 0 40px rgba(255,210,90,.9))}
.stamp.k-epic{color:#FF5A84;text-shadow:0 6px 0 #6E1028,0 0 40px rgba(255,77,121,.8)}
.stamp.k-lose,.stamp.k-cat{color:#C9D4FF;transform:translate(-50%,-50%) rotate(6deg);text-shadow:0 6px 0 #1E2A5A,0 16px 30px rgba(0,0,0,.7)}
@keyframes stamp{0%{opacity:0;scale:3.2}14%{opacity:1;scale:.92}22%{scale:1.04}30%{scale:1}78%{opacity:1;scale:1.02}100%{opacity:0;scale:1.1}}
.quake{animation:quake .5s ease}
@keyframes quake{10%,90%{translate:-2px 1px}20%,80%{translate:4px -2px}30%,50%,70%{translate:-8px 3px}40%,60%{translate:8px -3px}}

/* ---------- Kaarten: sportkaart met metalen frame, holo-folie en 3D-tilt ---------- */
.cw{container-type:inline-size;width:100%;position:relative}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:30%;--glare:0;position:relative;aspect-ratio:5/7;border-radius:5cqw;padding:2.6cqw;overflow:hidden;isolation:isolate;
  background:var(--frame);color:#fff;
  transition:transform .5s var(--ease-out),box-shadow .3s;
  box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.25),inset 0 -1cqw 2cqw rgba(0,0,0,.35),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75)}
.card.tilting{transition:transform .08s linear,box-shadow .3s}
.card.tilting{--glare:1;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry))}
.win{position:relative;width:100%;height:100%;border-radius:3cqw;overflow:hidden;background:var(--art);box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.4)}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:repeating-linear-gradient(135deg,transparent 0 9cqw,rgba(255,255,255,.035) 9cqw 11cqw),var(--art)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.jnum{position:absolute;right:-6cqw;top:6cqw;font:400 82cqw/.8 var(--display);color:transparent;-webkit-text-stroke:.6cqw rgba(255,255,255,.1);pointer-events:none}
.ptile{position:relative;display:grid;place-items:center;transform:rotate(-7deg) translateY(-8cqw);
  font:400 54cqw/1 var(--varsity);color:var(--cream);-webkit-text-stroke:1.3cqw var(--accent);paint-order:stroke fill;
  text-shadow:0 .8cqw 0 rgba(0,0,0,.25),0 1.6cqw 0 rgba(0,0,0,.25),0 3cqw 4cqw rgba(0,0,0,.45)}
.ptile.cat{font-size:36cqw;-webkit-text-stroke:0;transform:rotate(-6deg) translateY(-8cqw)}
.cbadge{position:absolute;top:3.4cqw;left:3.4cqw;z-index:2;width:10.5cqw;height:10.5cqw;border-radius:50%;display:grid;place-items:center;
  font:400 3.6cqw/1 var(--varsity);color:var(--cream);background:var(--plate);box-shadow:inset 0 0 0 .6cqw var(--accent),0 .6cqw 1.6cqw rgba(0,0,0,.5)}
.hp{position:absolute;top:3.4cqw;right:3.4cqw;z-index:2;padding:1cqw 2.4cqw .6cqw;border-radius:2.2cqw;background:rgba(4,6,18,.72);border:.5cqw solid var(--accent);
  font:400 6.4cqw/1 var(--display);letter-spacing:.06em;color:#fff;white-space:nowrap}
.plate{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12cqw 4.6cqw 4cqw;display:grid;gap:1.2cqw;
  background:linear-gradient(0deg,rgba(4,6,18,.96) 0%,rgba(4,6,18,.86) 52%,rgba(4,6,18,0) 100%)}
.tagline{justify-self:start;padding:.8cqw 3cqw .6cqw 2.2cqw;background:var(--accent);color:#090C1E;font:800 3.8cqw/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.cname{font:400 10.4cqw/.92 var(--display);letter-spacing:.03em;color:#fff;text-transform:uppercase;text-shadow:0 .6cqw 0 rgba(0,0,0,.5);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cname.xl{font-size:9cqw} .cname.xxl{font-size:7.8cqw}
.cstats{display:flex;gap:2.4cqw;align-items:center;border-top:.4cqw solid rgba(255,255,255,.14);padding-top:1.6cqw;margin-top:.4cqw}
.cstat{display:flex;align-items:baseline;gap:1cqw;font:400 6.6cqw/1 var(--display);letter-spacing:.04em;color:#fff}
.cstat i{font:800 3.2cqw/1 var(--cond);font-style:normal;letter-spacing:.14em;color:var(--accent)}
.flavor{display:none;font:italic 500 4.2cqw/1.25 var(--body);color:rgba(255,255,255,.78)}
.special{font:700 4.4cqw/1.2 var(--body);color:var(--accent)}
.special small{display:none;font-weight:500;color:rgba(255,255,255,.8)}
@container (min-width:300px){
  .flavor{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .special small{display:block;margin-top:.8cqw;font-size:3.9cqw;line-height:1.25}
}
/* Glans die de muis volgt + folie per zeldzaamheid */
.card::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;opacity:var(--glare);transition:opacity .3s;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.32),rgba(255,255,255,.07) 30%,transparent 55%)}
.card::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;opacity:0}
.r-common{--rc:#3A4A8C;--accent:#8FA8FF;--plate:#24306E;
  --frame:linear-gradient(145deg,#5A6CB8,#202B66 35%,#3A4A8C 55%,#141B45 80%,#4A5CA8);
  --art:radial-gradient(120% 90% at 50% 28%,#34459A,#121A45 62%,#080C24)}
.r-epic{--rc:#A8193A;--accent:#FF7A9A;--plate:#A8193A;
  --frame:linear-gradient(145deg,#FF7A9A,#B3203F 30%,#5E0A20 55%,#D12C4F 78%,#7A0F27);
  --art:radial-gradient(120% 90% at 50% 28%,#D12C4F,#5E0A20 60%,#26040D)}
.r-epic::before{opacity:.16;
  background:linear-gradient(125deg,#ff3e7f 0%,#ffd23e 14%,#3effa5 28%,#3ec5ff 42%,#b43eff 56%,#ff3e7f 70%,#ffd23e 84%,#3effa5 100%);background-size:300% 300%;
  background-position:var(--mx) var(--my)}
.r-epic.tilting::before{opacity:.28}
.r-legendary{--rc:#C48A12;--accent:#FFE08A;--plate:#9A6505;
  --frame:linear-gradient(145deg,#FFF6CF,#F7C548 22%,#A9700A 45%,#FFE08A 66%,#C48A12 85%,#FFF1B8);
  --art:radial-gradient(120% 90% at 50% 28%,#FFD970,#B87C0A 52%,#4A2C02)}
.r-legendary{box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.5),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75),0 0 6cqw -1cqw rgba(255,210,90,.65)}
.r-legendary::before{opacity:.4;
  background:
    radial-gradient(circle,rgba(255,255,255,.95) 0 .35cqw,transparent .6cqw) 0 0/7cqw 7cqw,
    radial-gradient(circle,rgba(255,255,255,.7) 0 .25cqw,transparent .5cqw) 3.5cqw 3.5cqw/9cqw 9cqw,
    linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 35%,rgba(255,213,120,.4) 45%,transparent 58%,rgba(255,255,255,.35) 74%,transparent 90%) var(--mx) var(--my)/260% 260%}
.r-legendary.tilting::before{opacity:.6}
.r-cat{--rc:#2E5E48;--accent:#BFF2DA;--plate:#24493A;
  --frame:linear-gradient(145deg,#7FC9A6,#2E5E48 35%,#173328 60%,#4C8B6E);
  --art:radial-gradient(120% 90% at 50% 28%,#3F7560,#16291F 70%)}
.r-cat .art{background:radial-gradient(circle at 20% 70%,rgba(255,255,255,.07),transparent 25%),radial-gradient(circle at 75% 30%,rgba(255,255,255,.06),transparent 30%),var(--art)}
.card.locked{filter:saturate(.25) brightness(.7)}
.card.locked .art{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 3cqw,transparent 3cqw 6cqw),#0A0E26}
.q{font:400 46cqw/1 var(--display);color:rgba(255,255,255,.16);transform:translateY(-8cqw)}
.dupe{position:absolute;right:-6px;top:-8px;z-index:6;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1300;font:400 17px/1 var(--display);letter-spacing:.06em;box-shadow:0 4px 12px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.card{transform:none !important}}

/* Achterkant van de kaart */
.cardback{position:relative;aspect-ratio:5/7;border-radius:5cqw;padding:2.6cqw;overflow:hidden;
  background:linear-gradient(145deg,#FFF6CF,#F7C548 22%,#A9700A 45%,#FFE08A 66%,#C48A12 85%,#FFF1B8);
  box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.4),0 2cqw 5cqw -1.5cqw rgba(0,0,0,.75)}
.cb-in{position:relative;height:100%;border-radius:3cqw;overflow:hidden;display:grid;place-items:center;align-content:center;gap:3cqw;text-align:center;
  background:
    repeating-linear-gradient(45deg,rgba(247,197,72,.13) 0 .5cqw,transparent .5cqw 7cqw),
    repeating-linear-gradient(-45deg,rgba(247,197,72,.13) 0 .5cqw,transparent .5cqw 7cqw),
    radial-gradient(circle at 50% 42%,#2B3A8A,#111845 55%,#060914)}
.cb-in::before{content:"";position:absolute;inset:3cqw;border:.6cqw solid rgba(247,197,72,.55);border-radius:2cqw;pointer-events:none;
  box-shadow:inset 0 0 0 1.4cqw rgba(6,9,20,.0),inset 0 0 0 1.9cqw rgba(247,197,72,.25)}
.cb-in::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);animation:shine 4.5s ease-in-out infinite}
.book .cb-in::after,.grid .cb-in::after{display:none}
.cb-crest{width:40cqw;height:47cqw;display:grid;place-items:center;padding-bottom:7cqw;font:400 16cqw/1 var(--varsity);color:var(--cream);
  background:linear-gradient(160deg,#D12C4F,#6E1028);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);
  box-shadow:inset 0 0 0 2cqw var(--gold),inset 0 0 0 3.2cqw #6E1028,inset 0 0 0 3.8cqw rgba(255,243,214,.6);filter:drop-shadow(0 2cqw 3cqw rgba(0,0,0,.5))}
.cb-name{font:400 11cqw/1 var(--display);letter-spacing:.1em;color:#fff;text-shadow:0 .8cqw 0 var(--crimson)}
.cb-est{font:700 3.8cqw/1 var(--cond);letter-spacing:.42em;color:var(--gold2)}

/* ---------- Kaart groot bekijken ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;overflow:visible;color:var(--ink)}
dialog::backdrop{background:radial-gradient(circle at 50% 40%,rgba(20,28,70,.86),rgba(3,4,10,.95))}
@keyframes zoom-in{from{opacity:0;transform:scale(.86) translateY(20px)}to{opacity:1;transform:none}}
.zoombox{width:min(430px,88vw,calc((92vh - 80px) * .714));display:grid;gap:12px;justify-items:center;animation:zoom-in .3s var(--spring) both}
.zoom-card{width:100%;background:none;border:0;padding:0;cursor:pointer;display:block;text-align:left;color:inherit;font:inherit;touch-action:none}
.zoom-inner{transition:transform .2s ease-in}
.zoom-card.turning .zoom-inner{transform:rotateY(90deg) scale(.96)}
.zoom-card.turning-back .zoom-inner{transition:transform .2s ease-out}
.zoomhint{color:var(--ink-soft);font:700 12.5px var(--cond);letter-spacing:.2em;text-transform:uppercase;margin:0;text-align:center}
.zoombox .link{color:#fff}
@media (prefers-reduced-motion:reduce){.zoom-inner,.zoom-card.turning-back .zoom-inner{transition:none}}

/* ---------- Pop-ups ---------- */
.infobox,.accbox,.packbox{position:relative;border-radius:24px;animation:zoom-in .3s var(--spring) both;color:var(--ink)}
.infobox::before,.accbox::before,.packbox::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--crimson2),var(--gold),transparent)}
.infobox{width:min(540px,92vw);max-height:88vh;overflow-y:auto;padding:26px}
.infobox h2{font-size:38px;color:var(--gold2)}
.infobox p,.infobox li{color:var(--ink-soft)}
.infobox ul{padding-left:20px;margin:8px 0 12px}
.infobox .link{padding-left:0}
.accbox{width:min(440px,92vw);max-height:92vh;overflow-y:auto;padding:28px;display:grid;gap:6px}
.accbox h2{margin-bottom:4px}
.packbox{width:min(780px,94vw);max-height:92vh;overflow-y:auto;padding:26px;display:grid;gap:10px;justify-items:center;text-align:center;overflow-x:hidden}
.packbox .stage{margin-top:4px;min-height:0}
.packbox .stage::before,.packbox .stage::after{display:none}
.photorow{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.photopreview{width:68px;height:68px;border-radius:50%;background-color:var(--navy2);background-size:cover;background-position:center;border:3px solid var(--gold);color:#fff;display:grid;place-items:center;font:400 28px var(--display);flex-shrink:0}
.accbox .rowbtns{display:flex;gap:12px;margin-top:6px;align-items:center}
.accbox .rowbtns .btn{width:auto;flex:1}
.acc-switch{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;display:grid;gap:8px}
.acc-switch h4{margin:0}
.acc-switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acc-switch-row small{color:var(--muted)}
.acc-switch .link{justify-self:start;padding-left:0}
.update-bar{position:fixed;left:0;right:0;margin:0 auto;bottom:22px;z-index:1000;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 24px);padding:12px 18px;border-radius:18px;border-color:rgba(247,197,72,.5);font-weight:600;animation:zoom-in .3s var(--spring) both}
.update-bar .btn{width:auto}
@media (max-width:899px){.update-bar{bottom:96px}}

/* ---------- Yearbook: leren jaarboek ---------- */
.book{position:relative;padding:18px;border-radius:26px;perspective:2200px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.06),transparent 40%),
    repeating-radial-gradient(circle at 70% 60%,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),
    linear-gradient(160deg,#8E1530,#55091C 60%,#3A0613);
  box-shadow:inset 0 0 0 2px #E3A51F,inset 0 0 0 7px #55091C,inset 0 0 0 8px rgba(247,197,72,.6),0 40px 80px -30px rgba(0,0,0,.95)}
.spread{position:relative;display:grid;grid-template-columns:300px 1fr;min-height:640px;border-radius:14px;overflow:hidden;color:#141C40;
  background:linear-gradient(90deg,#F4EAD2,#FFF8E8 12%,#FFF8E8 88%,#F1E5CA);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.spread::before{content:"";position:absolute;left:300px;top:0;bottom:0;width:36px;margin-left:-18px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 45%,rgba(0,0,0,.28) 50%,rgba(0,0,0,.12) 55%,transparent)}
.index-page{padding:28px 18px 22px 22px;overflow-y:auto;max-height:860px;
  background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(20,28,64,.06) 31px 32px)}
.index-title{display:flex;align-items:center;gap:10px;margin:0 0 2px;font:400 40px/1 var(--display);letter-spacing:.04em;color:var(--crimson)}
.index-page .info-btn{width:28px;height:28px;margin:0;font-size:13px;color:#9A6505;border-color:#C48A12;background:rgba(247,197,72,.15)}
.index-page .sub{display:block;font:700 12px var(--cond);letter-spacing:.28em;text-transform:uppercase;color:#7A6A4E;margin:0 0 18px}
.index-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.index-list button{width:100%;display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
  padding:8px 10px;border:0;border-radius:12px;background:none;color:#141C40;cursor:pointer;font:700 15.5px var(--body);transition:background .15s,transform .15s var(--ease-out)}
.index-list button:hover{background:rgba(20,28,64,.06);transform:translateX(3px)}
.ix-av{grid-row:1/3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--varsity);color:var(--cream);
  background:linear-gradient(160deg,#3A4A8C,#141C40);box-shadow:inset 0 0 0 2px var(--gold)}
.ix-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.index-list .frac{font:400 17px var(--display);letter-spacing:.06em;color:#7A6A4E;font-variant-numeric:tabular-nums}
.ix-bar{grid-column:2/4;height:4px;border-radius:4px;background:rgba(20,28,64,.1);overflow:hidden;margin-top:4px}
.ix-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson2),var(--gold));border-radius:4px}
.index-list button[aria-current="true"]{background:linear-gradient(90deg,#141C40,#24306E);color:#fff;box-shadow:0 8px 20px -10px rgba(20,28,64,.8)}
.index-list button[aria-current="true"] .frac{color:var(--gold2)}
.index-list button[aria-current="true"] .ix-bar{background:rgba(255,255,255,.15)}
.index-list .index-dupes{border-top:1px dashed rgba(20,28,64,.2);margin-top:6px;padding-top:6px}
.ix-av.det{background:linear-gradient(160deg,#4C8B6E,#173328)}
.ix-av.dup{background:linear-gradient(160deg,var(--gold),#9A6505);color:#2A1300}
.page-body{position:relative;padding:28px 30px 22px;display:flex;flex-direction:column;transform-origin:left center}
.pname{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px;font:400 clamp(44px,5vw,64px)/.9 var(--display);letter-spacing:.03em;color:#141C40}
.pname .ribbon{font:700 12px/1 var(--cond);letter-spacing:.3em;text-transform:uppercase;color:#fff;background:var(--crimson);padding:6px 12px 5px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.pcount{color:#5A5170;font:600 15px var(--body);margin:0 0 6px}
.pbar{height:8px;border-radius:8px;background:rgba(20,28,64,.1);overflow:hidden;margin:4px 0 22px;max-width:420px}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--crimson2),var(--gold));box-shadow:0 0 12px rgba(247,197,72,.7)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;flex:1;align-content:start;max-width:760px}
.slot{display:block;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
button.slot{cursor:pointer;transition:transform .25s var(--ease-out)}
button.slot:hover{transform:translateY(-6px)}
.pageturn{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px dashed rgba(20,28,64,.2)}
.pageturn button{background:#141C40;color:#fff;border:0;border-radius:12px;padding:10px 18px;font:400 19px var(--display);letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #070A1C;transition:transform .1s}
.pageturn button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #070A1C}
.pageturn button:disabled{opacity:.25;cursor:default}
.pageturn .pnum{font:400 20px var(--display);letter-spacing:.1em;color:#7A6A4E}
.page-body.turning{animation:pageturn .6s var(--ease-out)}
.page-body.turning::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 40%);animation:pageshade .6s ease-out forwards}
@keyframes pageturn{0%{opacity:.2;transform:rotateY(-70deg)}100%{opacity:1;transform:none}}
@keyframes pageshade{to{opacity:0}}
@media (max-width:899px){
  .book{padding:8px;border-radius:20px}
  .spread{grid-template-columns:minmax(0,1fr);min-height:0}
  .index-page{min-width:0}
  .spread::before{display:none}
  .index-page{max-height:none;padding:14px 12px 10px;border-bottom:1px dashed rgba(20,28,64,.2);overflow:visible}
  .index-title{font-size:32px}
  .index-page .sub{margin-bottom:10px}
  .index-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .index-list li{flex:0 0 auto;scroll-snap-align:start}
  .index-list .index-dupes{border:0;margin:0;padding:0}
  .index-list button{grid-template-columns:28px auto auto;padding:6px 10px;background:rgba(20,28,64,.05);font-size:14px}
  .ix-av{width:28px;height:28px;font-size:14px}
  .ix-bar{display:none}
  .page-body{padding:18px 12px 14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}

/* ---------- Statistieken ---------- */
.two-col,.three-col,.stats-wrap{display:grid;gap:24px 36px;align-items:start}
@media (min-width:1000px){
  .two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .three-col{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  #view .stats-wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
.bars-title{margin-top:6px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat-card{position:relative;border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  background:linear-gradient(180deg,#0B0E20,#04050C);border:2px solid #23284A;box-shadow:inset 0 0 0 3px #0E1226,0 20px 40px -20px rgba(0,0,0,.9)}
.stat-num{font:400 52px/1 var(--display);letter-spacing:.06em;color:var(--led);text-shadow:0 0 8px rgba(255,176,31,.9),0 0 26px rgba(255,120,0,.4);
  -webkit-mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.5) 66%,transparent 70%);-webkit-mask-size:3px 3px;mask-image:radial-gradient(circle,#000 58%,rgba(0,0,0,.5) 66%,transparent 70%);mask-size:3px 3px}
.stat-label{font:700 12px var(--cond);letter-spacing:.22em;text-transform:uppercase;color:#8890BC}
.bars{display:grid;gap:10px;margin-top:14px;max-width:600px}
.bar-row{display:grid;grid-template-columns:100px 1fr 34px;align-items:center;gap:12px}
.bar-label{font:400 18px var(--display);letter-spacing:.08em;color:var(--ink-soft)}
.bar-track{height:26px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 10%),repeating-linear-gradient(90deg,#15602F 0 5%,#197036 5% 10%)}
.bar-fill{position:relative;height:100%;min-width:4px;background:linear-gradient(90deg,var(--crimson),var(--crimson2) 60%,var(--gold));transition:width .8s var(--ease-out);box-shadow:0 0 16px rgba(247,197,72,.5)}
.bar-fill::after{content:"🏈";position:absolute;right:-2px;top:50%;transform:translate(50%,-50%);font-size:14px}
.bar-val{font:400 22px var(--display);text-align:right;color:var(--led)}

/* ---------- Vrienden ---------- */
.mycode{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:16px;row-gap:2px;align-items:center;max-width:440px;padding:18px 20px 16px;border-radius:20px;overflow:hidden;
  background:linear-gradient(120deg,#D12C4F,#7A0F27 45%,#141C40);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 50px -24px rgba(209,44,79,.7)}
.mycode::before{content:"STUDENT ID";grid-column:1/3;font:700 11px var(--cond);letter-spacing:.4em;color:var(--gold2);margin-bottom:8px}
.mycode::after{content:"";position:absolute;right:18px;top:16px;width:90px;height:34px;opacity:.55;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 9px,#fff 9px 12px,transparent 12px 14px)}
.mycode-label{grid-row:2/4;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;text-align:center;font:700 10px/1.1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);border:2px solid var(--gold)}
.mycode-value{font:400 40px/1 var(--display);letter-spacing:.18em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.mycode .link{justify-self:start;padding:2px 0;color:var(--gold2)}
.friend-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;max-width:520px}
.friend-row{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 14px;transition:transform .2s var(--ease-out),border-color .2s}
.friend-row:hover{transform:translateX(4px);border-color:rgba(247,197,72,.35)}
.friend-av{width:40px;height:40px;border-radius:50%;background-color:var(--navy2);background-size:cover;background-position:center;display:grid;place-items:center;font:400 20px var(--display);color:#fff;flex-shrink:0;box-shadow:0 0 0 2px var(--gold)}
.friend-name{flex:1;font-weight:700}
.friend-open{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.friend-open:hover .friend-name{color:var(--gold2)}
.friend-more{color:var(--muted);font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase}
.accbox.statbox{width:min(640px,94vw);max-height:90vh;overflow-y:auto}
.statbox-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.statbox-head h2{margin:0}
.statbox-head .friend-av{width:52px;height:52px;font-size:26px}
.statbox .stat-cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.statbox .stat-num{font-size:40px}

/* ---------- Traden ---------- */
.trade-builder{display:grid;gap:24px;margin-top:16px}
@media (min-width:700px){.trade-builder{grid-template-columns:1fr 1fr}}
.trade-builder h4{margin:0 0 12px}
.dup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.dup-owned{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:8px;margin-left:auto}
.step-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:400 20px/1 var(--display);cursor:pointer}
.step-btn:hover{border-color:var(--gold);color:var(--gold2)}
.step-val{min-width:20px;text-align:center;font:400 22px var(--display);color:var(--led)}
.trade-chip{display:inline-block;padding:5px 12px;border-radius:999px;font:700 13px var(--cond);letter-spacing:.06em;color:#fff;background:var(--rc,var(--grey));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.trade-chip.r-legendary{color:#2A1300;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.trade-list{display:grid;gap:16px;margin-top:14px}
.trade-card{border-radius:20px;padding:18px 20px;display:grid;gap:8px}
.trade-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trade-side-label{font:700 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);min-width:86px}
.trade-arrow{text-align:center;color:var(--gold2);font:400 20px var(--display);letter-spacing:.1em;margin:2px 0}
.trade-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.tmsg:empty{display:none}
.soon{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- Battle: grasmat, VS en spelknoppen ---------- */
.battle-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.battle-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.battle-top .page-head{margin-bottom:8px}
.diff-btn small,#challengeBattle small{font-weight:700;opacity:.8;margin-left:4px}
.battle-pick{display:flex;gap:16px;overflow-x:auto;padding:18px 8px 16px 14px;margin-top:6px;scroll-snap-type:x proximity}
.battle-pick .pick{flex:0 0 136px;scroll-snap-align:start}
@media (max-width:560px){.battle-pick .pick{flex-basis:120px}}
.pick{position:relative;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .25s var(--spring),opacity .2s,filter .2s;opacity:.7;filter:saturate(.7)}
.pick:hover{transform:translateY(-6px);opacity:1;filter:none}
.pick.selected{opacity:1;filter:none;transform:translateY(-10px)}
.pick.selected .card{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(247,197,72,.7)}
.pick-num{position:absolute;top:36%;left:-10px;z-index:7;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1300;font:400 22px var(--display);box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 0 3px #0B1029}
.battle-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.battle-or{color:var(--ink-soft);font:700 12px var(--cond);letter-spacing:.2em;text-transform:uppercase}
.battle-box{border-radius:20px;padding:12px 20px;max-width:680px;margin-bottom:6px}
.battle-box.highlight{border-color:var(--gold);box-shadow:0 0 0 1px rgba(247,197,72,.3),0 0 40px -10px rgba(247,197,72,.5)}
.battle-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);max-width:680px}
.battle-row-text{flex:1;min-width:160px}
.result-tag{font:400 15px var(--display);letter-spacing:.1em;padding:4px 10px;border-radius:8px}
.result-tag.won{background:linear-gradient(180deg,#4BE07F,#1E8A45);color:#04140A}
.result-tag.lost{background:#3A1020;color:#FF9DB0}
.leaderboard{border-collapse:separate;border-spacing:0 6px;margin-top:4px;min-width:min(420px,100%);font-size:15px}
.leaderboard th{text-align:left;padding:4px 14px;font:700 11px var(--cond);letter-spacing:.24em;text-transform:uppercase;color:#8890BC}
.leaderboard td{padding:10px 14px;background:rgba(16,22,56,.7);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.leaderboard td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;font:400 22px var(--display);color:var(--led)}
.leaderboard td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.leaderboard tr.me td{background:linear-gradient(90deg,rgba(209,44,79,.45),rgba(16,22,56,.7));font-weight:700;color:#fff}
.bt-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.bt-head h2{margin:0}
.bt-head .link{padding-left:0}
.bt-head .forfeit{margin-left:auto}
.bt-layout{display:grid;gap:18px;align-items:start}
@media (min-width:1100px){.bt-layout{grid-template-columns:auto minmax(0,1fr)}.bt-layout .battle-log{max-height:480px}.bt-layout .battle-result{margin-top:0}}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;width:min(640px,100%);margin-top:6px;padding:20px 18px;border-radius:26px;
  background:
    linear-gradient(180deg,rgba(6,9,20,.55),rgba(6,9,20,.15) 40%,rgba(6,9,20,.6)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 12.5%),
    repeating-linear-gradient(90deg,#16692F 0 6.25%,#1B7A3A 6.25% 12.5%);
  border:2px solid rgba(255,255,255,.14);box-shadow:inset 0 0 60px rgba(0,0,0,.6),0 30px 60px -24px rgba(0,0,0,.9)}
.bt-arena{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.bt-side{min-width:0}
.bt-name{font:400 22px var(--display);letter-spacing:.1em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.fighter{display:grid;gap:8px;justify-items:center}
.fighter-card{position:relative;width:100%;max-width:min(230px,calc((100vh - 330px) * .714))}
.bt-side .fighter-card{max-width:min(200px,calc((100vh - 480px) * .714))}
.fighter.hit .fighter-card{animation:shake .4s ease}
.fighter.ko .fighter-card .card{filter:grayscale(1) brightness(.5);transition:filter .3s}
.hpbar{width:100%;max-width:260px;height:14px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2)}
.hpfill{height:100%;background:linear-gradient(180deg,#6EF29C,#1E8A45);box-shadow:0 0 12px rgba(47,179,94,.8);transition:width .4s ease,background .4s}
.hpfill.mid{background:linear-gradient(180deg,#FFE08A,#E3A51F);box-shadow:0 0 12px rgba(247,197,72,.8)}
.hpfill.low{background:linear-gradient(180deg,#FF8FA3,#D12C4F);box-shadow:0 0 12px rgba(255,77,106,.8)}
.hptext{font:400 18px var(--display);letter-spacing:.08em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.energy{display:flex;gap:2px}
.energy .pip{font-size:15px;filter:grayscale(1);opacity:.3}
.energy .pip.on{filter:drop-shadow(0 0 6px #FFD25A);opacity:1}
.bench{display:grid;gap:5px;width:100%;max-width:220px}
.bench-card{display:flex;justify-content:space-between;gap:8px;min-width:0;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(6,9,20,.75);color:var(--ink);font:600 13px var(--body);text-align:left}
.bench-card span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-card .bench-hp{color:var(--green-soft);white-space:nowrap}
.bench-card.out{opacity:.4}
.bench-card.out .bench-hp{color:#FF7D93}
.bench-card:disabled{cursor:default}
.bt-side.choosing .bench-card:not(:disabled){cursor:pointer;border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(247,197,72,.25)}}
.vs{align-self:center;font:400 54px/1 var(--display);letter-spacing:.04em;background:linear-gradient(180deg,#fff,var(--gold2) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 var(--crimson)) drop-shadow(0 0 20px rgba(247,197,72,.6));animation:vs-pulse 2s ease-in-out infinite}
@keyframes vs-pulse{50%{transform:scale(1.1) rotate(-4deg)}}
@media (max-width:560px){.arena{gap:8px;padding:14px 10px}.vs{font-size:30px}.bt-head h2{font-size:28px}}
.bt-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:stretch;width:min(640px,100%)}
.move-btn{display:grid;justify-items:center;align-content:center;gap:2px;min-width:100px;flex:1;padding:9px 8px;border:0;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,#FFE9A3,#F7C548 50%,#E3A51F);color:#2A1300;font:400 19px var(--display);letter-spacing:.06em;
  box-shadow:0 5px 0 #9A6505,inset 0 1px 0 rgba(255,255,255,.7);transition:transform .1s ease,box-shadow .1s ease,filter .2s}
.move-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
.move-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #9A6505}
.move-btn:disabled{opacity:.35;cursor:not-allowed}
.move-btn .move-icon{font-size:22px;line-height:1}
.move-btn small{font:700 11.5px var(--cond);letter-spacing:.04em;opacity:.8}
.move-btn[data-move="power"]{background:linear-gradient(180deg,#FF8FA3,#D12C4F 55%,#A8193A);color:#fff;box-shadow:0 5px 0 #5E0A20,inset 0 1px 0 rgba(255,255,255,.5)}
.move-btn[data-move="special"]{background:linear-gradient(135deg,#FFF6CF,#F7C548 40%,#C48A12);box-shadow:0 5px 0 #8A5A06,0 0 24px rgba(247,197,72,.6)}
.move-btn[data-move="guard"]{background:linear-gradient(180deg,#9FB4FF,#4A5CA8);color:#fff;box-shadow:0 5px 0 #24306E,inset 0 1px 0 rgba(255,255,255,.5)}
.move-btn[data-move="switch"]{background:linear-gradient(180deg,#B9F5D6,#3F8F6B);color:#04140A;box-shadow:0 5px 0 #1E4A36,inset 0 1px 0 rgba(255,255,255,.5)}
@media (max-width:560px){.move-btn{min-width:calc(50% - 5px)}}
.dmg-pop{position:absolute;top:30%;left:50%;z-index:8;pointer-events:none;font:400 46px var(--display);color:#FF4D6A;text-shadow:0 3px 0 #5E0A20,0 0 20px rgba(255,77,106,.8);animation:dmgpop .85s ease-out forwards}
.dmg-pop.big{color:var(--gold2);font-size:62px;text-shadow:0 3px 0 #8A5A06,0 0 24px rgba(247,197,72,.9)}
@keyframes dmgpop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.battle-log{list-style:none;margin:16px 0 0;padding:14px 18px;max-width:680px;max-height:260px;overflow-y:auto;border-radius:18px;font-size:14.5px;display:grid;gap:4px}
.battle-log li{color:var(--ink-soft)}
.battle-log .who{display:inline-block;min-width:74px;font-weight:700}
.battle-log .round-block{list-style:none;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.battle-log .round-block:last-child{border-bottom:0}
.battle-log .round-title{font:400 16px var(--display);letter-spacing:.14em;color:var(--gold2);margin-bottom:2px}
.battle-log .round-lines{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.battle-log li.mine{color:var(--green-soft)}
.battle-log li.theirs{color:#FF9DB0}
.battle-log li.ko-line{color:#fff}
.battle-result{max-width:680px;margin-top:18px;padding:20px 22px;border-radius:20px}
.battle-result h3{font-size:44px;margin-bottom:6px}
.battle-result.won{border-color:rgba(110,242,156,.5);box-shadow:0 0 50px -12px rgba(47,179,94,.7)}
.battle-result.won h3{color:var(--green-soft)}
.battle-result.lost h3{color:#FF7D93}
.battle-result p{color:var(--ink-soft);margin:0 0 12px}

/* ---------- Shop ---------- */
.shop-balance{font-size:24px;padding:9px 18px}
.shop-packs{display:grid;gap:14px}
.shop-pack{display:flex;gap:18px;align-items:center;border-radius:20px;padding:14px 18px;transition:transform .25s var(--ease-out),border-color .2s}
.shop-pack:hover{transform:translateY(-3px);border-color:rgba(247,197,72,.4)}
.pack.mini .pack-body{animation:none}
.pack.mini{width:86px;flex-shrink:0;animation:none;cursor:default;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));transition:transform .4s var(--spring)}
.shop-pack:hover .pack.mini{transform:rotate(-6deg) scale(1.06)}
.shop-pack-info{display:grid;gap:6px;justify-items:start}
.shop-pack-info strong{font:400 28px/1 var(--display);letter-spacing:.06em}
.shop-pack-info small{color:var(--ink-soft)}
.shop-list{max-height:calc(100vh - 280px);overflow-y:auto;padding-right:6px}
.shop-list .battle-row{padding:6px 0}

/* ---------- Ideeënbus ---------- */
.ideas-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
@media (max-width:999px){.ideas-grid{grid-template-columns:1fr}}
.seg{display:flex;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink-soft);font:700 12.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1300}
.idea-list{display:grid;gap:10px;max-height:calc(100vh - 260px);overflow-y:auto;padding-right:6px}
@media (max-width:999px){.idea-list{max-height:none}}
.idea{display:flex;gap:14px;align-items:flex-start;border-radius:18px;padding:12px 16px}
.idea.status-done,.idea.status-rejected{opacity:.6}
.vote{display:grid;justify-items:center;min-width:50px;padding:6px 4px;border:2px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(0,0,0,.35);color:var(--ink-soft);cursor:pointer;font:400 22px/1 var(--display);transition:transform .2s var(--spring),border-color .2s}
.vote:active{transform:scale(.9)}
.vote .vote-arrow{font-size:12px;line-height:1.2}
.vote.on{border-color:var(--gold);background:rgba(247,197,72,.15);color:var(--gold2);box-shadow:0 0 18px -4px rgba(247,197,72,.7)}
.idea-main{flex:1;min-width:0}
.idea-body{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.idea-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;color:var(--muted);font-size:13px}
.idea-status{font-weight:700;color:var(--ink-soft)}
.idea-set{min-height:0;padding:3px 8px;font-size:12.5px;border-radius:8px}
.idea-meta .link{font-size:13px;padding:0}

/* Zuinige stand voor trage toestellen (wordt automatisch aangezet, zie autoLite) */
.lite .beam{animation:none;transform:rotate(var(--a))}
.lite .flashes,.lite .stars{display:none}
.lite .bulbs::before,.lite .bulbs::after,.lite .crest::after,.lite .welcome-banner::after,.lite .cb-in::after{animation:none}
@media (prefers-reduced-motion:reduce){
  .beam,.stars,.lamps,.crest::after,.bulbs::before,.bulbs::after,.ticker,.pack,.pack-top,.glow,.page-body.turning,.shake,.particle,.rays,.fan .cw,.ghost-pack,.vs,.welcome-banner::after,.cb-in::after,.wb-icon,.pack-hint,.stamp,.flash,.quake{animation:none !important}
}
</style>

<script>

// Werkt alle plekken bij die het saldo, de collectie en de streak tonen (scorebord, shop)
function syncCoinUI() {
  document.querySelectorAll('[data-coin]').forEach(el => { el.textContent = state.wallet; });
  document.querySelectorAll('[data-coll]').forEach(el => { el.textContent = collectionText(); });
  document.querySelectorAll('[data-streak]').forEach(el => { el.textContent = computeStreak(state.playDates); });
