// Toont een envelop met waszegel. Na een tik breekt het zegel, gaat de klep open, schuift de kaart
// eruit (met een flits bij epic/legendary) en draaien de kaarten om. Voor de dagelijkse trekking en het welkomstpakket.
async function openPack(stage, cards) {
  const reduce = prefersReduced();
  await loadPhotos(cards.map(c => c.id));
  const best = cards.map(c => c.rarity).sort((x, y) => RARITY_ORDER[x] - RARITY_ORDER[y])[0];
  const results = backs => `<div class="pack-results${cards.length > 1 ? ' multi' : ''}">${cards.map((c, i) =>
    `<div class="pack-slot" data-slot="${i}"><div class="flipper${backs ? ' rise' : ''}" style="animation-delay:${i * .12}s">${backs ? renderCardBack(c) : renderCard(c)}</div></div>`).join('')}</div>`;
  if (reduce) { stage.innerHTML = results(false); return; }

  stage.innerHTML = `<div class="pack-stage">
    <div class="rays r-${best}" aria-hidden="true"></div>
    <button class="pack r-${best}" type="button" id="packBtn" aria-label="Pakje openen">
      <div class="pack-card">${renderCardBack(cards[0])}</div>
      <div class="pack-body"><div class="pack-label" aria-hidden="true">${packLabel(cards.length)}</div></div>
      <div class="pack-top"></div>
      <span class="seal" aria-hidden="true">RIZZ</span>
    </button>
    <p class="pack-hint">Tik om het zegel te breken</p>
  </div>`;
  const pack = $('#packBtn', stage), rays = stage.querySelector('.rays');
  pack.focus({ preventScroll: true });
  await new Promise(resolve => { pack.onclick = resolve; });
  pack.onclick = null;
  stage.querySelector('.pack-hint').style.visibility = 'hidden';
  rays.classList.add('charge');
  pack.classList.add('charging'); await sleep(900);
  pack.classList.add('torn'); await sleep(950);
  if (best === 'legendary' || best === 'epic') flashScreen(best);
  if (best === 'legendary') quake();
  rays.classList.add('burst');
  pack.classList.add('done'); await sleep(430);

  stage.innerHTML = results(true);
  await sleep(700 + cards.length * 120);
  stage.querySelectorAll('.flipper.rise').forEach(f => f.classList.remove('rise'));
  for (const [i, c] of cards.entries()) {
    const slot = stage.querySelector(`[data-slot="${i}"]`), flip = slot.querySelector('.flipper');
    await sleep(i ? 380 : 120);
    flip.classList.add('turning'); await sleep(240);
    flip.innerHTML = renderCard(c);
    slot.insertAdjacentHTML('afterbegin', `<div class="glow ${c.rarity}"></div>${particlesHtml(c.rarity)}`);
    flip.classList.add('turning-back'); flip.classList.remove('turning'); await sleep(240);
    flip.classList.remove('turning-back');
    if (c.rarity === 'epic' || c.rarity === 'legendary') {
      slot.classList.add('shake'); setTimeout(() => slot.classList.remove('shake'), 420);
    }
  }
  const [txt, cls, sub] = PULL_STAMP[best] || PULL_STAMP.common;
  if (best === 'legendary' || best === 'epic') window.celebrate?.(best);
  showStamp(txt, cls, sub);
}

async function revealCard(res) {
  const stage = $('#stage');
  await openPack(stage, [res.card]);
  const text = res.solved
    ? (res.isDuplicate
        ? (res.cardAdded
            ? `Opgelost in ${res.attempts} ${plural(res.attempts)}. Je had "${esc(res.card.name)}" al — nu heb je een dubbel om te ruilen, plus ${res.coinsEarned} credits.`
            : `Opgelost in ${res.attempts} ${plural(res.attempts)}. Je had "${esc(res.card.name)}" al — omgezet in ${res.coinsEarned} credits.`)
        : `Opgelost in ${res.attempts} ${plural(res.attempts)}: cijfer ${res.grade}. Je trok een ${RARITY_LABEL[res.rarity]}-kaart!`)
    : '';
  stage.insertAdjacentHTML('beforeend', `<p class="result">${text}</p>`);
}

// Alle gespeelde Wordles: de oude dagtrekkingen (daily_plays) + de nieuwe rondes (wordle_games)
async function loadPlays(userId, isFriend = false) {
  const [old, games] = await Promise.all([
    sb.from('daily_plays').select('play_date, solved, attempts').eq('user_id', userId),
    isFriend
      ? sb.rpc('friend_wordle_stats', { p_friend: userId })
      : sb.from('wordle_games').select('round_date, status, attempts').eq('user_id', userId).neq('status', 'playing'),
  ]);
  if (old.error) throw old.error;
  const rows = [...(old.data || [])];
  if (!games.error) for (const g of games.data || []) {
    rows.push(isFriend ? g : { play_date: g.round_date, solved: g.status === 'won', attempts: g.attempts });
  }
  return rows.sort((a, b) => (a.play_date < b.play_date ? -1 : a.play_date > b.play_date ? 1 : 0));
}

// Statistiek-tegels + verdeling van pogingen; gebruikt voor jezelf en voor vrienden

  const total = plays.length;
  const streak = computeStreak(new Set(plays.map(p => p.play_date)));
  const dist = { A: 0, B: 0, C: 0, D: 0, F: 0 };
  for (const p of plays) if (dist[p.grade] !== undefined) dist[p.grade]++;
  const maxDist = Math.max(1, ...Object.values(dist));
  return `<div class="stats-wrap"><div>
    <div class="stat-cards">
      <div class="stat-card"><span class="stat-num">${total}</span><span class="stat-label">Examens</span></div>
      <div class="stat-card"><span class="stat-num">${streak}</span><span class="stat-label">Huidige streak (dagen)</span></div>
      <div class="stat-card"><span class="stat-num">${dist.A}</span><span class="stat-label">A's</span></div>
      <div class="stat-card"><span class="stat-num">${dist.F}</span><span class="stat-label">F's</span></div>
      ${extraCards}
    </div></div><div>
    <h3 class="bars-title">Je cijfers</h3>
    <div class="bars">
      ${['A', 'B', 'C', 'D', 'F'].map(g => `
        <div class="bar-row">
          <span class="bar-label">${g} <small>${GRADE_TEXT[g]}</small></span>
          <div class="bar-track"><div class="bar-fill${g === 'F' ? ' f' : ''}" style="width:${(dist[g] / maxDist) * 100}%"></div></div>

  };
  if (state.tradeWith && friends.some(f => f.id === state.tradeWith)) {
    $('#tradeFriend').value = state.tradeWith;
    drawTradeBuilder(state.tradeWith, friends.find(f => f.id === state.tradeWith).display_name);
  }
  state.tradeWith = null;

  view.querySelectorAll('[data-accept]').forEach(btn => btn.onclick = () => respondTrade(btn.dataset.accept, 'accept'));
  view.querySelectorAll('[data-cancel]').forEach(btn => btn.onclick = () => respondTrade(btn.dataset.cancel, 'cancel'));
  view.querySelectorAll('[data-counter]').forEach(btn => btn.onclick = () => {
    const t = trades.find(x => x.id === Number(btn.dataset.counter));
    openCounterBuilder(t, others);
  });
}

async function respondTrade(tradeId, action, extra = {}) {
  const msg = $(`#tmsg-${tradeId}`);
  if (msg) { msg.className = 'msg'; msg.textContent = 'Bezig…'; }
  try {
    const { error } = await sb.rpc('respond_trade', { p_trade_id: Number(tradeId), p_action: action, ...extra });
    if (error) throw error;
    await loadData();
    syncCoinUI();
    renderTrade($('#view'));
  } catch (err) {
    if (msg) { msg.className = 'msg err'; msg.textContent = err.message; }
    else alert(err.message);
  }
}

async function drawTradeBuilder(friendId, friendName, prefill = null) {
  const host = $('#tradeBuilder');
  host.innerHTML = '<p class="hint">Dubbels laden…</p>';
  const uid = state.session.user.id;
  const [mineRes, theirsRes] = await Promise.all([
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('user_cards').select('card_id').eq('user_id', friendId),
  ]);
  if (mineRes.error || theirsRes.error) { host.innerHTML = `<p class="msg err">${esc((mineRes.error || theirsRes.error).message)}</p>`; return; }
  const mine = countByCard(mineRes.data || []);
  const theirs = countByCard(theirsRes.data || []);
  const myDupes = [...mine.entries()].filter(([, n]) => n > 1);
  const theirDupes = [...theirs.entries()].filter(([, n]) => n > 1);

  const pick = { mine: new Map(), theirs: new Map() }; // card_id -> aantal geselecteerd
  if (prefill) {
    for (const id of prefill.mine) pick.mine.set(id, (pick.mine.get(id) || 0) + 1);
    for (const id of prefill.theirs) pick.theirs.set(id, (pick.theirs.get(id) || 0) + 1);
  }

  const rowHtml = (side, cardId, max, selected) => {
    const c = state.cards.find(x => x.id === cardId);
    if (!c) return '';
    return `<div class="dup-row">
      <span class="trade-chip r-${c.rarity}">${esc(c.name)}</span>
      <span class="dup-owned">(${max + 1}× in bezit)</span>
      <div class="stepper">
        <button type="button" class="step-btn" data-side="${side}" data-card="${cardId}" data-d="-1">−</button>
        <span class="step-val" data-val="${side}-${cardId}">${selected}</span>
        <button type="button" class="step-btn" data-side="${side}" data-card="${cardId}" data-d="1">+</button>
      </div>
    </div>`;
  };

  const draw = () => {
    host.innerHTML = `<div class="trade-builder">
      <div>
        <h4>Jouw dubbels</h4>
        ${myDupes.length ? myDupes.map(([id, n]) => rowHtml('mine', id, n - 1, pick.mine.get(id) || 0)).join('') : '<p class="hint">Je hebt geen dubbels.</p>'}
      </div>
      <div>
        <h4>Dubbels van ${esc(friendName)}</h4>
        ${theirDupes.length ? theirDupes.map(([id, n]) => rowHtml('theirs', id, n - 1, pick.theirs.get(id) || 0)).join('') : '<p class="hint">Geen dubbels bekend.</p>'}
      </div>
    </div>
    <p id="builderMsg" class="msg" role="alert"></p>
    <button class="btn" id="sendTrade" type="button" style="max-width:280px">${prefill ? 'Tegenbod versturen' : 'Ruilvoorstel versturen'}</button>`;

    host.querySelectorAll('.step-btn').forEach(btn => {
      btn.onclick = () => {
        const side = btn.dataset.side, cardId = Number(btn.dataset.card), d = Number(btn.dataset.d);
        const map = pick[side];
        const max = side === 'mine' ? mine.get(cardId) - 1 : theirs.get(cardId) - 1;
        const cur = map.get(cardId) || 0;
        const next = Math.max(0, Math.min(max, cur + d));
        map.set(cardId, next);
        host.querySelector(`[data-val="${side}-${cardId}"]`).textContent = next;
      };
    });

    $('#sendTrade').onclick = async () => {
      const bMsg = $('#builderMsg');
      const myCards = [...pick.mine.entries()].flatMap(([id, n]) => Array(n).fill(id));
      const theirCards = [...pick.theirs.entries()].flatMap(([id, n]) => Array(n).fill(id));
      if (!myCards.length && !theirCards.length) { bMsg.className = 'msg err'; bMsg.textContent = 'Selecteer minstens één kaart.'; return; }
      bMsg.className = 'msg'; bMsg.textContent = 'Versturen…';
      try {
        if (prefill) {
          await respondTrade(prefill.tradeId, 'counter', { p_proposer_cards: prefill.proposerIsMe ? myCards : theirCards, p_recipient_cards: prefill.proposerIsMe ? theirCards : myCards });
        } else {
          const { error } = await sb.rpc('create_trade', { p_friend_id: friendId, p_my_cards: myCards, p_their_cards: theirCards });
          if (error) throw error;
          bMsg.className = 'msg ok'; bMsg.textContent = 'Voorstel verstuurd!';
          setTimeout(() => renderTrade($('#view')), 600);
        }
      } catch (err) {
        bMsg.className = 'msg err'; bMsg.textContent = err.message;
      }
    };
  };
  draw();
}

function openCounterBuilder(t, others) {
  const uid = state.session.user.id;
  const proposerIsMe = t.proposer_id === uid;
  const otherId = proposerIsMe ? t.recipient_id : t.proposer_id;
  const otherName = others[otherId] || '…';
  $('#tradeFriend').value = '';
  drawTradeBuilder(otherId, otherName, {
    tradeId: t.id,
    proposerIsMe,
    mine: proposerIsMe ? t.proposer_cards : t.recipient_cards,
    theirs: proposerIsMe ? t.recipient_cards : t.proposer_cards,
  });
  $('#tradeBuilder').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------- Tab: Shop — alles wordt server-side afgerekend (supabase/setup.sql) ----------
const SHOP = {
  packs: {
    basic: { name: 'Basic Pack', price: 60, count: 1, desc: '1 kaart · 75% common, 22% epic, 3% legendary' },
    epic: { name: 'Epic Pack', price: 200, count: 3, desc: '3 kaarten · de 3e is gegarandeerd epic of legendary' },
  },
  buy: { common: 150, epic: 400, legendary: 1000 },
  sell: { common: 15, epic: 40, legendary: 100, cat: 5 },
  hint: 40, extra: 60,
};
const shopState = { person: '' };
const setWallet = w => { if (typeof w === 'number') { state.wallet = w; syncCoinUI(); } };

function renderShop(view) {
  const dupes = state.cards
    .filter(c => (state.owned.get(c.id) || 0) > 1)
    .sort((a, b) => (RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]) || a.id - b.id);
  const dupeTotal = dupes.reduce((n, c) => n + (state.owned.get(c.id) - 1) * SHOP.sell[c.rarity], 0);

  view.innerHTML = `<section class="col" style="max-width:none">
    <div class="battle-top">
      ${pageHead('The Vault', 'shop')}
      <span class="coinpill shop-balance">🪙 <span data-coin>${state.wallet}</span> credits</span>
    </div>
    <p class="msg tmsg" id="shopMsg" role="alert"></p>
    <div class="two-col shop-grid">
      <div>
        <h3>Pakjes</h3>
        <div class="shop-packs">${Object.entries(SHOP.packs).map(([k, p]) => `
          <div class="shop-pack">
            <div class="pack mini" aria-hidden="true"><div class="pack-body"><div class="pack-label">${packLabel(p.count)}</div></div><div class="pack-top"></div><span class="seal">RIZZ</span></div>
            <div class="shop-pack-info"><strong>${p.name}</strong><small>${p.desc}</small>
              <button class="btn small" data-buy-pack="${k}" type="button" ${state.wallet < p.price ? 'disabled' : ''}>Kopen · ${p.price} 🪙</button></div>
          </div>`).join('')}</div>

      </div>
      <div>
        <h3>Dubbels verkopen</h3>
        ${dupes.length ? `<p class="hint" style="margin-bottom:6px">Je houdt altijd 1 exemplaar. Alles verkopen levert ${dupeTotal} 🪙 op.</p>
          <div class="shop-list">${dupes.map(c => {
            const extra = state.owned.get(c.id) - 1, price = SHOP.sell[c.rarity];
            return `<div class="battle-row">
              <span class="trade-chip r-${c.rarity}">${esc(c.name)}</span>
              <span class="battle-row-text"><small>${extra} extra · ${price} 🪙 per stuk</small></span>
              <button class="link" data-sell="${c.id}" data-count="1" type="button">Verkoop 1</button>
              ${extra > 1 ? `<button class="link" data-sell="${c.id}" data-count="${extra}" type="button">Alle ${extra} (+${extra * price})</button>` : ''}
            </div>`;
          }).join('')}</div>`
          : '<p class="hint">Je hebt geen dubbels om te verkopen.</p>'}

        <h3 style="margin-top:20px">Wordle-hulp</h3>
        <p class="hint">Op maandag tijdens de Wordle in de <strong>Exam Hall</strong>: 💡 een letter onthullen voor ${SHOP.hint} 🪙 (max 2 per ronde) of ➕ een 7e poging voor ${SHOP.extra} 🪙 (koop die vóór je 6e gok).</p>

    </div>
  </section>`;

  const msg = (text, ok) => { const m = $('#shopMsg'); m.className = 'msg tmsg ' + (ok ? 'ok' : 'err'); m.textContent = text; };

  view.querySelectorAll('[data-buy-pack]').forEach(b => b.onclick = async () => {
    const p = SHOP.packs[b.dataset.buyPack];
    if (!confirm(`${p.name} kopen voor ${p.price} credits?`)) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('shop_buy_pack', { p_kind: b.dataset.buyPack });
    if (error) { msg(error.message); b.disabled = false; return; }
    setWallet(data.wallet);
    for (const c of data.cards) state.owned.set(c.id, (state.owned.get(c.id) || 0) + 1);
    const dlg = $('#packModal');
    dlg.innerHTML = `<div class="packbox"><h2>${p.name}</h2><div class="stage" id="packStage"></div><div id="packDone"></div></div>`;
    dlg.showModal();
    await openPack($('#packStage'), data.cards);
    const dup = data.cards.filter(c => c.is_duplicate).length;
    $('#packDone').innerHTML = `<p class="result">${dup ? `${dup === data.cards.length ? 'Allemaal dubbels' : `${dup} dubbel${dup > 1 ? 's' : ''}`} — die kan je verkopen of ruilen.` : 'Allemaal nieuwe kaarten voor je boek!'}</p>
      <button class="btn small" id="packClose" type="button">Verder</button>`;
    $('#packClose').onclick = () => { dlg.close(); renderShop(view); };
  });

  view.querySelectorAll('[data-sell]').forEach(b => b.onclick = async () => {
    const c = cardById(b.dataset.sell), n = Number(b.dataset.count);
    if (n > 1 && !confirm(`${n} exemplaren van "${c.name}" verkopen voor ${n * SHOP.sell[c.rarity]} credits?`)) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('shop_sell_duplicates', { p_card_id: c.id, p_count: n });
    if (error) { msg(error.message); b.disabled = false; return; }
    setWallet(data.wallet);
    state.owned.set(c.id, state.owned.get(c.id) - data.sold);
    renderShop(view);
    msg(`Verkocht: ${data.sold}× "${c.name}" voor ${data.earned} credits.`, true);
  });
}

// ---------- Tab: Ideas — ideeënbus met upvotes (supabase/setup.sql) ----------
const IDEA_STATUS = {
  open: { icon: '💭', label: 'Open' },
  planned: { icon: '📅', label: 'Gepland' },
  done: { icon: '✅', label: 'Klaar' },
  rejected: { icon: '❌', label: 'Niet gepland' },
};
const ideaState = { sort: 'votes' };

async function renderIdeas(view) {
  view.innerHTML = `<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>`;
  const uid = state.session.user.id;
  const [sug, votes] = await Promise.all([
    sb.from('suggestions').select('id, user_id, body, status, created_at').order('created_at', { ascending: false }),
    sb.from('suggestion_votes').select('suggestion_id, user_id'),
  ]);
  if (state.tab !== 'ideas') return;
  if (sug.error) {
    view.innerHTML = `<section class="col">${pageHead('Town Hall', 'ideas')}<p class="msg err">De ideeënbus kon niet geladen worden: ${esc(sug.error.message)}</p></section>`;
    return;
  }
  const count = {}, mine = new Set();
  for (const v of votes.data || []) {
    count[v.suggestion_id] = (count[v.suggestion_id] || 0) + 1;
    if (v.user_id === uid) mine.add(v.suggestion_id);
  }
  const ids = [...new Set(sug.data.map(s => s.user_id))];
  const names = {};
  if (ids.length) {
    const { data: profs } = await sb.from('profiles').select('id, display_name').in('id', ids);
    for (const p of profs || []) names[p.id] = p.display_name;
  }
  const rank = { open: 0, planned: 1, done: 2, rejected: 3 };
  const list = [...sug.data].sort((a, b) => ideaState.sort === 'new'
    ? b.created_at.localeCompare(a.created_at)
    : (rank[a.status] > 1) - (rank[b.status] > 1) || (count[b.id] || 0) - (count[a.id] || 0) || b.created_at.localeCompare(a.created_at));
  const when = d => new Date(d).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' });

  view.innerHTML = `<section class="col" style="max-width:none">
    ${pageHead('Town Hall', 'ideas')}
    <div class="two-col ideas-grid">
      <div>
        <form id="ideaForm" class="form" style="margin-top:0">
          <label>Jouw idee<textarea id="ideaBody" rows="4" maxlength="500" placeholder="Wat zou de site nog leuker maken?"></textarea></label>
          <div class="battle-bar"><button class="btn small" type="submit">Idee indienen</button><small class="hint" id="ideaLen" style="margin:0">0/500</small></div>
          <p class="msg tmsg" id="ideaMsg" role="alert"></p>
        </form>
      </div>
      <div>
        <div class="battle-bar" style="margin-bottom:8px">
          <h3 style="margin:0">Ideeën (${list.length})</h3>
          <div class="seg">
            <button type="button" data-sort="votes" class="${ideaState.sort === 'votes' ? 'on' : ''}">Populair</button>
            <button type="button" data-sort="new" class="${ideaState.sort === 'new' ? 'on' : ''}">Nieuwste</button>
          </div>
        </div>
        <div class="idea-list">${list.length ? list.map(s => {
          const st = IDEA_STATUS[s.status] || IDEA_STATUS.open;
          return `<div class="idea status-${s.status}">
            <button type="button" class="vote${mine.has(s.id) ? ' on' : ''}" data-vote="${s.id}" aria-pressed="${mine.has(s.id)}" aria-label="Upvote">
              <span class="vote-arrow">▲</span><span class="vote-n">${count[s.id] || 0}</span></button>
            <div class="idea-main">
              <p class="idea-body">${esc(s.body)}</p>
              <div class="idea-meta">
                ${state.isAdmin ? '' : `<span class="idea-status">${st.icon} ${st.label}</span>`}
                <span>${esc(names[s.user_id] || '…')} · ${when(s.created_at)}</span>
                ${state.isAdmin ? `<select class="idea-set" data-status="${s.id}" aria-label="Status">
                    ${Object.entries(IDEA_STATUS).map(([k, v]) => `<option value="${k}"${k === s.status ? ' selected' : ''}>${v.icon} ${v.label}</option>`).join('')}
                  </select>` : ''}
                ${s.user_id === uid || state.isAdmin ? `<button type="button" class="link danger" data-del-idea="${s.id}">Verwijderen</button>` : ''}
              </div>
            </div>
          </div>`;
        }).join('') : '<p class="hint">Nog geen ideeën. Wees de eerste!</p>'}</div>
      </div>
    </div>
  </section>`;

  const body = $('#ideaBody'), msg = $('#ideaMsg');
  body.oninput = () => { $('#ideaLen').textContent = `${body.value.length}/500`; };
  $('#ideaForm').onsubmit = async e => {
    e.preventDefault();
    const text = body.value.trim();
    if (text.length < 3) { msg.className = 'msg tmsg err'; msg.textContent = 'Schrijf minstens een paar woorden.'; return; }
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.from('suggestions').insert({ body: text }).select('id').single();
    if (error) { msg.className = 'msg tmsg err'; msg.textContent = error.message; btn.disabled = false; return; }
    await sb.from('suggestion_votes').insert({ suggestion_id: data.id }); // je stemt meteen op je eigen idee
    ideaState.sort = 'new';
    renderIdeas(view);
  };
  view.querySelectorAll('[data-sort]').forEach(b => { b.onclick = () => { ideaState.sort = b.dataset.sort; renderIdeas(view); }; });
  view.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.vote), on = b.classList.contains('on');
    b.disabled = true;
    // Meteen tonen, daarna opslaan
    const n = b.querySelector('.vote-n');
    b.classList.toggle('on', !on); n.textContent = Number(n.textContent) + (on ? -1 : 1);
    const { error } = on
      ? await sb.from('suggestion_votes').delete().eq('suggestion_id', id).eq('user_id', uid)
      : await sb.from('suggestion_votes').insert({ suggestion_id: id });
    b.disabled = false;
    if (error) { alert(error.message); renderIdeas(view); }
  });
  view.querySelectorAll('[data-status]').forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from('suggestions').update({ status: sel.value }).eq('id', Number(sel.dataset.status));
    if (error) alert(error.message);
    renderIdeas(view);
  });
  view.querySelectorAll('[data-del-idea]').forEach(b => b.onclick = async () => {
    if (!confirm('Dit idee verwijderen?')) return;
    const { error } = await sb.from('suggestions').delete().eq('id', Number(b.dataset.delIdea));
    if (error) alert(error.message);
    renderIdeas(view);
  });
}

// ---------- Frat House: een kamer per persoon van de kaarten ----------
// Elke kamer toont de 9 kaarten van die persoon, uit JOUW collectie (zoals vroeger een
// pagina in het yearbook).
// Ramen van de gevel (img/frathouse-*.webp, 1376×768): x, y, breedte, hoogte in pixels.
const FACADE_W = 1376, FACADE_H = 768;
const FACADE_WINDOWS = [
  ...[390, 514, 664, 813, 937].map(x => [x, 228, 50, 68]),
  ...[390, 514, 813, 937].map(x => [x, 341, 50, 79]),
  ...[390, 514, 813, 937].map(x => [x, 476, 50, 82]),
];
const DETENTION = 'Detention';
const ownedCount = id => state.owned.get(id) || (state.isAdmin ? 1 : 0);
// Alle kamers: de personen alfabetisch
const houseRooms = () => housePersons();
const roomCards = p => state.cards.filter(c => (p === DETENTION ? c.rarity === 'cat' : c.person === p && c.rarity !== 'cat')).sort((a, b) => a.slot - b.slot);

async function renderHouse(view) {
  view.innerHTML = `<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>`;
  const uid = state.session.user.id;
  const { data, error } = await sb.rpc('house_members');
  if (state.tab !== 'house') return;
  if (error) { view.innerHTML = `<section class="col"><p class="msg err">${esc(error.message)}</p></section>`; return; }
  const persons = housePersons();
  const owners = roomOwners(data || [], persons);
  state.houseOwners = owners;
  if (state.room) return renderRoom(view, state.room);
  const rooms = houseRooms();
  const myRoom = persons.find(p => owners[p]?.user_id === uid);
  const phase = dayPhase();
  const pct = (v, total) => `${(v / total * 100).toFixed(2)}%`;
  const have = p => roomCards(p).filter(c => ownedCount(c.id)).length;

  const windowHtml = (p, i) => {
    const w = FACADE_WINDOWS[i];
    if (!w) return '';
    const o = owners[p], mine = o?.user_id === uid, det = p === DETENTION;
    return `<button type="button" class="fwin${o?.played ? ' lit' : ''}${mine ? ' me' : ''}${det ? ' det' : ''}" data-room="${esc(p)}" data-win="${i}"
        aria-label="Kamer van ${esc(p)}: ${have(p)}/${roomCards(p).length} verzameld" style="left:${pct(w[0], FACADE_W)};top:${pct(w[1], FACADE_H)};width:${pct(w[2], FACADE_W)};height:${pct(w[3], FACADE_H)}"></button>
      <span class="fplate${mine ? ' me' : ''}${det ? ' det' : ''}${o?.played ? ' lit' : ''}" data-plate="${i}"
        style="left:${pct(w[0] + w[2] / 2, FACADE_W)};top:${pct(det ? w[1] - 22 : w[1] + w[3] - 3, FACADE_H)}"><b>${esc(det ? 'Detention' : plateName(p))}</b></span>`;
  };

  view.innerHTML = `<section class="col" style="max-width:none">
    ${pageHead('Frat House', 'house')}
    <div class="facade-wrap ${phase}">
      <div class="campus-scroll" id="houseScroll">
        <div class="facade">
          <img class="campus-img" src="img/frathouse-${phase === 'night' ? 'night' : 'day'}.webp" alt="Het Frat House" width="1376" height="768" decoding="async">
          ${rooms.map(windowHtml).join('')}
        </div>
      </div>
      <div class="campus-hint">${collectionText()} collected · ${persons.filter(p => owners[p]?.played).length} lights on today <span>Tik op een raam.</span></div>
    </div>
    <div class="res-list">${rooms.map(p => {
      const o = owners[p], mine = o?.user_id === uid, n = roomCards(p).length;
      return `<button type="button" class="res${mine ? ' me' : ''}" data-room="${esc(p)}">
        <span class="res-prog" style="--p:${have(p) / Math.max(1, n) * 100}%"><b>${have(p)}</b></span>
        <span class="res-txt"><b>${esc(p)}${mine ? ' <em>you</em>' : ''}</b><small>${have(p)}/${n} in je collectie${o ? (o.fs ? ` · ${o.fs}× F` : '') : ' · nog niet ingetrokken'}</small></span>
        <span class="res-dot${o?.played ? ' on' : ''}" title="${o?.played ? 'Vandaag gespeeld' : ''}"></span></button>`;
    }).join('')}</div>
  </section>`;

  const fac = view.querySelector('.facade');
  view.querySelectorAll('.fwin').forEach(el => {
    const on = () => { fac.dataset.hover = el.dataset.win; };
    const off = () => { if (fac.dataset.hover === el.dataset.win) delete fac.dataset.hover; };
    el.addEventListener('mouseenter', on); el.addEventListener('mouseleave', off);
    el.addEventListener('focus', on); el.addEventListener('blur', off);
  });
  const sc = $('#houseScroll');
  sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2;
  view.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { state.room = b.dataset.room; renderRoom(view, state.room); scrollTo({ top: 0 }); });

}

// Kort naambordje: voornaam, of voornaam + initiaal als twee mensen dezelfde voornaam hebben
function plateName(p) {
  const [first, ...rest] = p.split(' ');
  return housePersons().filter(q => q.split(' ')[0] === first).length > 1 && rest.length ? `${first} ${rest[0][0]}.` : first;
}
// De 13 personen van de kaarten
const housePersons = () => [...new Set(state.cards.filter(c => c.rarity !== 'cat').map(c => c.person))].sort((a, b) => a.localeCompare(b));

// Welk account woont in welke kamer: eerst de zelf gekozen kamer, anders op basis van de naam
function roomOwners(members, persons) {
  const owner = {};
  const taken = new Set();
  for (const m of members) if (m.room && persons.includes(m.room)) { owner[m.room] = m; taken.add(m.user_id); }
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  const free = members.filter(m => !m.room);
  for (const p of persons) {
    if (owner[p]) continue;
    const full = norm(p), [first, ...rest] = full.split(' '), last = rest.join(' ');
    const firstUnique = persons.filter(q => norm(q).split(' ')[0] === first).length === 1;
    const cands = free.filter(m => {
      if (taken.has(m.user_id)) return false;
      const d = norm(m.display_name), t = d.split(' ');
      if (d === full || d.replace(/ /g, '') === full.replace(/ /g, '')) return true;
      if (firstUnique) return t[0] === first || (t[0].length >= 4 && t[0].slice(0, 4) === first.slice(0, 4));
      return t[0] === first && !!t[1] && !!last && last.startsWith(t[1]);
    });
    if (cands.length === 1) { owner[p] = cands[0]; taken.add(cands[0].user_id); }
  }
  return owner;
}

// Langste reeks opeenvolgende speeldagen
function bestStreak(plays) {
  const days = [...new Set(plays.map(p => p.play_date))].sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days) {
    cur = prev && (Date.parse(d) - Date.parse(prev)) === 864e5 ? cur + 1 : 1;
    best = Math.max(best, cur); prev = d;
  }
  return best;
}

const TROPHY_ICON = {
  cup: '<path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 21h8M9 17h6"/>',
  flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-5 0-8z"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  star: '<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/>',
  stack: '<rect x="6" y="3" width="12" height="15" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>',
  swords: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4"/>',

  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
};
function trophiesFor(plays, ownedSet, bs) {
  const people = state.cards.filter(c => c.rarity !== 'cat');
  const persons = [...new Set(people.map(c => c.person))];
  const fullSet = persons.some(p => people.filter(c => c.person === p).every(c => ownedSet.has(c.id)));
  const unique = people.filter(c => ownedSet.has(c.id)).length;
  const legend = people.some(c => c.rarity === 'legendary' && ownedSet.has(c.id));
  const best = bestStreak(plays);
  const sharp = plays.some(p => p.grade === 'A');
  const flunk = plays.some(p => p.grade === 'F');
  return [
    { icon: 'clock', name: 'Freshman', how: 'Eerste examen afgelegd', ok: plays.length > 0 },
    { icon: 'flame', name: 'On Fire', how: '3 dagen op rij een examen', ok: best >= 3 },
    { icon: 'flame', name: 'Iron Streak', how: '7 dagen op rij een examen', ok: best >= 7 },
    { icon: 'target', name: 'Straight A', how: 'Een A gehaald op een examen', ok: sharp },
    { icon: 'star', name: 'Legend Hunter', how: 'Een legendary verzameld', ok: legend },
    { icon: 'stack', name: 'Collector', how: '50 verschillende kaarten', ok: unique >= 50 },
    { icon: 'crown', name: 'Full Set', how: 'Alle 9 kaarten van één persoon', ok: fullSet },
    { icon: 'swords', name: 'Rookie', how: 'Eerste battle gewonnen', ok: (bs?.wins || 0) >= 1 },
    { icon: 'swords', name: 'Gladiator', how: '10 battles gewonnen', ok: (bs?.wins || 0) >= 10 },
    { icon: 'cup', name: 'Champion', how: 'Gewonnen op Championship', ok: (bs?.hard_wins || 0) >= 1 },
    { icon: 'cup', name: 'Rival', how: 'Een vriend verslagen', ok: (bs?.pvp_wins || 0) >= 1 },
    { icon: 'clock', name: 'Flunked', how: 'Een F gehaald', ok: flunk },
  ];
}

    pop.hidden = false; openI = i;
  });
  scene.addEventListener('click', () => { pop.hidden = true; openI = null; });
}

              <div class="opp-btn friend${friendIds.length ? '' : ' off'}">
                <b>Rivalry</b>
                ${friendIds.length ? `<select id="battleFriend" class="tselect">
                    <option value="">Kies een huisgenoot…</option>
                    ${friendIds.map(id => `<option value="${id}"${id === preFriend ? ' selected' : ''}>${esc(nameOf(id))}</option>`).join('')}
                  </select>
                  <button class="btn small" id="challengeBattle" type="button">Uitdagen</button>`
                  : '<small>Er woont nog niemand anders in het huis.</small>'}
                <span class="opp-reward">+25 credits</span>
              </div>
            </div>
            <p class="msg tmsg" id="battleMsg" role="alert"></p>
          </div>
        </div>
        <div class="roster-box">
          <h3>Je kaarten <small>${owned.length}</small></h3>
          <div class="battle-pick">${owned.map(c => `
            <button class="pick" type="button" data-pick="${c.id}" aria-pressed="false">
              <span class="pick-num" hidden></span>${renderCard(c)}
            </button>`).join('')}</div>
        </div>`}

    <div class="arena-lists">
      <div class="al-box"><h3>Wedstrijden</h3>
        ${waiting.length || sent.length || done.length ? [...waiting.map(b => `<div class="battle-row">
            <span class="result-tag wait">Bezig</span><span class="battle-row-text">${esc(opponentOf(b))} · ronde ${b.round + 1}</span>
            <button class="link" data-open-battle="${b.id}" type="button">Bekijk</button></div>`),
          ...sent.map(b => `<div class="battle-row">
            <span class="result-tag wait">Verstuurd</span><span class="battle-row-text">${esc(nameOf(b.player_b))}</span>
            <button class="link danger" data-cancel-battle="${b.id}" type="button">Annuleren</button></div>`),
          ...done.slice(0, 6).map(b => {
            const won = b.winner === mySide(b);
            const coins = mySide(b) === 'A' ? b.coins_a : b.coins_b;
            return `<div class="battle-row">
              <span class="result-tag ${won ? 'won' : 'lost'}">${won ? 'Winst' : 'Verlies'}</span>
              <span class="battle-row-text">${esc(opponentOf(b))}${coins ? ` · +${coins}` : ''}</span>
              <button class="link" data-open-battle="${b.id}" type="button">Bekijk</button></div>`;
          })].join('') : '<p class="hint">Nog geen wedstrijden gespeeld.</p>'}
      </div>
      <div class="al-box"><h3>Ranglijst</h3>
        ${board.error ? `<p class="msg err">${esc(board.error.message)}</p>` : `<table class="leaderboard">
          <thead><tr><th>#</th><th>Naam</th><th>W</th><th>V</th></tr></thead>
          <tbody>${(board.data || []).map((r, i) => `<tr${r.user_id === uid ? ' class="me"' : ''}>
            <td>${i + 1}</td><td>${esc(r.display_name)}</td><td>${r.wins}</td><td>${r.losses}</td></tr>`).join('')}</tbody>
        </table>`}
      </div>
    </div>
  </section>`;

  const teamReady = () => battleState.team.length === TEAM_SIZE;
  const sync = () => {
    view.querySelectorAll('[data-pick]').forEach(b => {
      const idx = battleState.team.indexOf(Number(b.dataset.pick));
      b.classList.toggle('selected', idx >= 0);
      b.setAttribute('aria-pressed', idx >= 0);
      const num = b.querySelector('.pick-num');
      num.hidden = idx < 0; num.textContent = idx + 1;
    });
    const lu = $('#lineup');
    if (lu) lu.innerHTML = [0, 1, 2].map(i => {
      const c = cardById(battleState.team[i]);
      return `<div class="lu-slot${c ? ' filled' : ''}"><span class="lu-num">${i + 1}</span>${c ? renderCard(c) : '<span class="lu-empty">Kies kaart</span>'}</div>`;
    }).join('');
    view.querySelectorAll('[data-pve], #challengeBattle, [data-accept-battle]').forEach(b => { b.disabled = !teamReady(); });
    view.querySelector('.lobby')?.classList.toggle('ready', teamReady());
  };
  view.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      const id = Number(b.dataset.pick);
      const idx = battleState.team.indexOf(id);
      if (idx >= 0) battleState.team.splice(idx, 1);
      else if (battleState.team.length < TEAM_SIZE) battleState.team.push(id);
      sync();
    };
  });
  if ($('#clearTeam')) $('#clearTeam').onclick = () => { battleState.team = []; sync(); };

  const msg = (sel, text, ok) => { const m = $(sel); if (m) { m.className = 'msg tmsg ' + (ok ? 'ok' : 'err'); m.textContent = text; } };
  view.querySelectorAll('[data-pve]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data, error } = await sb.rpc('tb_start_pve', { p_cards: battleState.team, p_difficulty: b.dataset.pve });
    if (error) { msg('#battleMsg', error.message); b.disabled = false; return; }
    openBattle(view, data);
  });
  if ($('#challengeBattle')) $('#challengeBattle').onclick = async () => {
    const fid = $('#battleFriend').value;
    if (!fid) return msg('#battleMsg', 'Kies eerst een vriend.');
    const { error } = await sb.rpc('tb_challenge', { p_friend: fid, p_cards: battleState.team });
    if (error) return msg('#battleMsg', error.message);
    msg('#battleMsg', `Uitdaging verstuurd naar ${nameOf(fid)}!`, true);
    setTimeout(() => { if ($('#battleMsg')) renderBattle(view); }, 1200);
  };
  view.querySelectorAll('[data-open-battle]').forEach(b => { b.onclick = () => openBattle(view, Number(b.dataset.openBattle)); });
  view.querySelectorAll('[data-cancel-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('tb_respond', { p_id: Number(b.dataset.cancelBattle), p_action: 'cancel' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-decline-battle]').forEach(b => b.onclick = async () => {
    if (!confirm('Deze uitdaging weigeren?')) return;
    b.disabled = true;
    const { error } = await sb.rpc('tb_respond', { p_id: Number(b.dataset.declineBattle), p_action: 'decline' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-accept-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const id = Number(b.dataset.acceptBattle);
    const { error } = await sb.rpc('tb_respond', { p_id: id, p_action: 'accept', p_cards: battleState.team });
    if (error) { msg('#incomingMsg', error.message); b.disabled = false; return; }
    openBattle(view, id);
  });
  sync();
}

// ---------- Speelscherm ----------
function eventText(e, b, names) {
  const me = mySide(b);
  const who = s => `<span class="who">${esc(s === me ? 'Jij' : names.opp)}</span>`;
  const st = b.state;
  const card = (s, i) => cardById(st[s].cards[i]);
  if (e.t === 'clash') {
    const mine = me === 'A' ? e.a : e.b, theirs = me === 'A' ? e.b : e.a;
    const res = e.w === me ? '<b class="w">gewonnen</b>' : e.w ? '<b class="l">verloren</b>' : 'gelijk';
    return `${moveName(mine)} vs ${moveName(theirs)}: clash ${res}`;
  }
  if (e.t === 'hit') {
    const c = card(e.s, st[e.s].active);
    return `${who(e.s)} ${e.k === 'signature' ? `★ <strong>${esc(c?.special_name || 'Signature')}</strong>` : moveName(e.k)}: ${e.d} schade${e.crit ? ' (voltreffer!)' : ''}`;
  }
  if (e.t === 'heal') return `${who(e.s)} ${esc(card(e.s, e.i)?.name || '?')} herstelt ${e.v} HP`;
  if (e.t === 'atk') return `${who(e.s)} valt aan: ${e.d} schade`; // gevechten met de oude regels
  if (e.t === 'guard') return `${who(e.s)} verdedigt`;
  if (e.t === 'switch') return `${who(e.s)} wisselt naar ${esc(card(e.s, e.i)?.name || '?')}`;
  if (e.t === 'ko') return `${who(e.s)} <strong>${esc(card(e.s, e.i)?.name || '?')}</strong> is knock-out!`;
  if (e.t === 'enter') return `${who(e.s)} ${esc(card(e.s, e.i)?.name || '?')} komt de arena in`;
  if (e.t === 'forfeit') return `${who(e.s)} geeft op`;
  if (e.t === 'end') return `<strong>${e.w === me ? 'Jij wint!' : `${esc(names.opp)} wint.`}</strong>`;
  return '';
}

// Scorebord bovenaan: per team de naam, welke kaarten nog staan, de hype en de ronde
function jumboHtml(b, disp, me, op, round) {
  const team = (s, mine) => {
    const d = disp[s], side = b.state[s], hype = d.hype || 0;
    return `<div class="jb-side ${mine ? 'me' : 'op'}">
      <span class="jb-name">${mine ? 'Jij' : esc(d.name)}</span>
      <span class="jb-team">${side.cards.map((id, i) => `<i class="${d.hp[i] <= 0 ? 'ko' : i === d.active ? 'act' : ''}" title="${esc(cardById(id)?.name || '')}"></i>`).join('')}</span>
      <span class="hype${hype >= 3 ? ' full' : ''}" title="Hype ${hype}/3">${[0, 1, 2].map(i => `<i class="${i < hype ? 'on' : ''}"></i>`).join('')}<b>Hype</b></span>
    </div>`;
  };
  return `${team(me, true)}<div class="jb-mid"><small>Round</small><b>${round}</b></div>${team(op, false)}`;
}

// Eén kant van het speelveld op basis van een weergave-toestand {active, hp[], hype}
function sideHtml(b, s, disp, mine) {
  const side = b.state[s];
  const c = cardById(side.cards[disp.active]);
  const hp = disp.hp[disp.active], max = side.max[disp.active];
  const pct = Math.max(0, hp / max * 100);
  const hype = disp.hype || 0;
  return `<div class="fighter-card" data-active="${disp.active}">${c ? renderCard(c) : ''}</div>
    <div class="hpbar"><div class="hpfill${pct <= 25 ? ' low' : pct <= 50 ? ' mid' : ''}" style="width:${pct}%"></div></div>
    <div class="hptext"><b>${hp}</b> / ${max} HP</div>
    <div class="bench">${side.cards.map((id, i) => {
      if (i === disp.active) return '';
      const bc = cardById(id), bh = disp.hp[i], bp = Math.max(0, bh / side.max[i] * 100);
      return `<button type="button" class="bench-card${bh <= 0 ? ' out' : ''}" data-bench="${i}" ${mine && bh > 0 ? '' : 'disabled'} title="${mine && bh > 0 ? 'Wissel naar deze kaart' : ''}">
        <span class="bc-name">${esc(bc?.name || '?')}</span><span class="bc-hp"><i style="width:${bp}%"></i></span><span class="bc-val">${bh > 0 ? `${bh} HP` : 'KO'}</span></button>`;
    }).join('')}</div>`;
}

async function openBattle(view, id, prev = null) {
  stopBattlePoll();
  const { data: b, error } = await sb.from('tbattles').select('*').eq('id', id).single();
  if (error) { alert(error.message); return renderBattle(view); }
  if (b.status === 'pending') { alert('Deze uitdaging is nog niet geaccepteerd.'); return renderBattle(view); }
  const me = mySide(b), op = otherSide(me);
  let oppName = 'Computer';
  if (b.mode === 'pvp') {
    const { data: p } = await sb.from('profiles').select('display_name').eq('id', me === 'A' ? b.player_b : b.player_a).maybeSingle();
    oppName = p?.display_name || 'Tegenstander';
  }
  if (state.tab !== 'battle') return;
  const names = { opp: oppName };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let send = null; // wordt ingevuld zodra je een zet mag kiezen

  // Weergave-toestand: bij een nieuwe ronde starten we van de vorige en spelen we de gebeurtenissen af
  const replay = prev && prev.round < b.round;
  const fromState = replay ? prev.state : b.state;
  const mk = (s) => ({ active: fromState[s].active, hp: [...fromState[s].hp], hype: fromState[s].hype || 0, name: s === me ? 'Jij' : oppName });
  const disp = { A: mk('A'), B: mk('B') };
  const events = b.state.events || [];
  const newEvents = replay ? events.filter(e => e.r > prev.round) : [];

  view.innerHTML = `<section class="duel-page">
    <div class="duel-head">
      <button class="link" id="btBack" type="button">← Arena</button>
      <div class="dh-title"><span class="kicker">${b.mode === 'pve' ? `${DIFFS[b.difficulty]?.label || ''} · +${DIFFS[b.difficulty]?.coins || 0} credits` : 'Rivalry · +25 credits'}</span>
        <h2>Jij <span>vs</span> ${esc(oppName)}</h2></div>
      <div class="dh-right"><span class="pill" id="btRound">Ronde ${b.round + (b.status === 'active' ? 1 : 0)}</span>
      ${b.status === 'active' ? '<button class="link danger forfeit" id="btForfeit" type="button">Opgeven</button>' : ''}</div>
    </div>
    <div class="jumbo" id="jumbo"></div>
    <div class="duel">
      <div class="duel-side me" id="side-me"></div>
      <div class="clash" id="clash" aria-live="polite"></div>
      <div class="duel-side op" id="side-op"></div>
    </div>
    <div class="duel-controls">
      <p class="msg" id="btMsg" role="status"></p>
      <div class="moves" id="btActions"></div>
    </div>
    <div id="battleResult"></div>
    <div class="duel-log"><h3>Verslag</h3><ol class="battle-log" id="battleLog"></ol></div>
  </section>`;
  $('#btBack').onclick = () => { stopBattlePoll(); renderBattle(view); };
  const sideEl = s => $(s === me ? '#side-me' : '#side-op');
  let shownRound = b.round + (replay || b.status !== 'active' ? 0 : 1);
  const drawJumbo = () => { const j = $('#jumbo'); if (j) j.innerHTML = jumboHtml(b, disp, me, op, Math.max(1, shownRound)); };
  const drawSide = s => { sideEl(s).innerHTML = sideHtml(b, s, disp[s], s === me); bindBench(); drawJumbo(); };
  const drawSides = () => { drawSide(me); drawSide(op); };
  const updateHp = s => {
    const el = sideEl(s), d = disp[s], side = b.state[s];
    const hp = d.hp[d.active], max = side.max[d.active], pct = Math.max(0, hp / max * 100);
    const fill = el.querySelector('.hpfill');
    if (fill) { fill.style.width = pct + '%'; fill.className = 'hpfill' + (pct <= 25 ? ' low' : pct <= 50 ? ' mid' : ''); }
    const t = el.querySelector('.hptext b'); if (t) t.textContent = hp;
    drawJumbo();
  };
  const pop = (s, text, cls) => {
    if (reduce) return;
    const p = document.createElement('span');
    p.className = 'dmg-pop ' + cls; p.textContent = text;
    sideEl(s).querySelector('.fighter-card')?.appendChild(p);
  };
  const anim = (s, cls) => { const el = sideEl(s); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const clash = $('#clash');
  const idleClash = text => { clash.className = 'clash'; clash.innerHTML = `<div class="clash-idle"><span class="ci-round">Ronde ${b.round + 1}</span><span>${text}</span></div>`; };

  const log = $('#battleLog');
  const addLog = e => {
    const t = eventText(e, b, names);
    if (!t) return;
    let block = log.querySelector(`[data-round="${e.r}"]`);
    if (!block) {
      block = document.createElement('li');
      block.className = 'round-block'; block.dataset.round = e.r;
      block.innerHTML = `<div class="round-title">Ronde ${e.r}</div><ol class="round-lines"></ol>`;
      log.prepend(block);
    }
    const li = document.createElement('li');
    li.innerHTML = t; li.className = e.t === 'ko' || e.t === 'end' ? 'ko-line' : e.s === me ? 'mine' : e.s ? 'theirs' : 'neutral';
    block.querySelector('.round-lines').appendChild(li);
  };

  // De clash tonen: beide zetten tegelijk onthuld
  const showClash = async e => {
    const mine = me === 'A' ? e.a : e.b, theirs = me === 'A' ? e.b : e.a;
    const res = e.w === me ? 'win' : e.w ? 'lose' : 'tie';
    const text = mine === 'signature' && theirs !== 'signature' ? 'Signature move!'
      : theirs === 'signature' && mine !== 'signature' ? `${esc(oppName)}: signature move!`
      : mine === 'switch' && theirs === 'switch' ? 'Beide wisselen'
      : mine === 'switch' ? 'Jij wisselt: vrije slag voor de ander'
      : theirs === 'switch' ? 'Ze wisselen: vrije slag voor jou'
      : res === 'tie' ? 'Stand-off'
      : res === 'win' ? `${moveName(mine)} beats ${moveName(theirs)}` : `${moveName(theirs)} beats ${moveName(mine)}`;
    clash.className = `clash show r-${res}`;
    clash.innerHTML = `<div class="tok mine m-${mine}">${MV_ICON[mine] || ''}<span>${moveName(mine)}</span></div>
      <div class="clash-vs">VS</div>
      <div class="tok theirs m-${theirs}">${MV_ICON[theirs] || ''}<span>${moveName(theirs)}</span></div>
      <div class="clash-res">${text}</div>`;
    if (reduce) return;
    await sleep(600);
    clash.classList.add('resolved');
    await sleep(650);
  };

  const cutoff = replay ? prev.round : Infinity;
  for (const e of events) if (e.r <= cutoff) addLog(e);
  drawSides();
  if (!replay) idleClash(b.status === 'active' ? 'Kies je zet' : 'Einde');

  // Nieuwe ronde afspelen
  for (const e of newEvents) {
    if (e.t === 'clash') { shownRound = e.r; drawJumbo(); await showClash(e); }
    else if (e.t === 'switch' || e.t === 'enter') {
      disp[e.s].active = e.i; drawSide(e.s); anim(e.s, 'enter');
      if (!reduce) await sleep(450);
    } else if (e.t === 'heal') {
      disp[e.s].hp[e.i] = e.hp; updateHp(e.s); pop(e.s, `+${e.v}`, 'heal');
      if (!reduce) await sleep(500);
    } else if (e.t === 'hit') {
      const d = otherSide(e.s);
      anim(e.s, 'lunge');
      if (!reduce) await sleep(180);
      disp[d].hp[e.di] = e.hp; updateHp(d); anim(d, 'hit');
      pop(d, `-${e.d}${e.crit ? '!' : ''}`, e.crit || e.k === 'signature' ? 'big' : '');
      if (!reduce) await sleep(620);
    } else if (e.t === 'ko') {
      anim(e.s, 'ko');
      if (!reduce) await sleep(700);
    }
    addLog(e);
    if (!$('#battleLog')) return; // intussen weggeklikt
  }
  // Eindtoestand (hype e.d.) tonen
  for (const s of ['A', 'B']) Object.assign(disp[s], { active: b.state[s].active, hp: [...b.state[s].hp], hype: b.state[s].hype || 0 });
  drawSides();

  const actions = $('#btActions'), msg = $('#btMsg');
  if (b.status === 'done') {
    const won = b.winner === me;
    const coins = me === 'A' ? b.coins_a : b.coins_b;
    if (coins) {
      const { data: w } = await sb.from('user_wallet').select('polycoins').eq('user_id', state.session.user.id).maybeSingle();
      if (w) { state.wallet = w.polycoins; syncCoinUI(); }
    }
    idleClash(won ? 'Victory' : 'Defeat');
    clash.classList.add(won ? 'r-win' : 'r-lose', 'final');
    if (replay) showStamp(won ? 'Victory' : 'Defeat', won ? 'legendary' : 'fail', coins ? `+${coins} credits` : '', 900);
    $('#battleResult').innerHTML = `<div class="battle-result ${won ? 'won' : 'lost'}">
      <h3>${won ? 'Victory.' : 'Defeat.'}</h3>
      <p>${b.forfeit ? (won ? `${esc(oppName)} gaf op.` : 'Je gaf op.') : won ? `Je team heeft ${esc(oppName)} verslagen.` : `${esc(oppName)} was deze keer sterker.`}
        ${coins ? `<strong>+${coins} credits</strong>` : won ? '(Je daglimiet voor beloningen is bereikt.)' : ''}</p>
      <div class="battle-bar">
        ${b.mode === 'pve' ? `<button class="btn small" id="btAgain" type="button">Rematch (${DIFFS[b.difficulty].label})</button>` : ''}
        <button class="link" id="btBack2" type="button">Terug naar de Arena</button>
      </div></div>`;
    $('#btBack2').onclick = () => renderBattle(view);
    if ($('#btAgain')) $('#btAgain').onclick = async () => {
      const { data, error: e2 } = await sb.rpc('tb_start_pve', { p_cards: b.state[me].cards, p_difficulty: b.difficulty });
      if (e2) { alert(e2.message); return; }
      openBattle(view, data);
    };
    return;
  }
  $('#btRound').textContent = `Ronde ${b.round + 1}`;
  shownRound = b.round + 1; drawJumbo();

  const forfeit = async () => {
    if (!confirm('Wil je echt opgeven?')) return;
    const { error: ef } = await sb.rpc('tb_act', { p_id: b.id, p_action: 'forfeit' });
    if (ef) { msg.className = 'msg err'; msg.textContent = ef.message; return; }
    openBattle(view, b.id, b);
  };
  if ($('#btForfeit')) $('#btForfeit').onclick = forfeit;

  if ((b.state.moved || {})[me]) {
    actions.innerHTML = '';
    idleClash(`Wachten op ${esc(oppName)}…`);
    msg.className = 'msg'; msg.textContent = `Je zet ligt vast. ${oppName} moet nog kiezen.`;
    battleState.poll = setInterval(async () => {
      if (!$('#btActions')) return stopBattlePoll();
      const { data: n } = await sb.from('tbattles').select('round, status').eq('id', b.id).single();
      if (n && (n.round !== b.round || n.status !== b.status)) { stopBattlePoll(); openBattle(view, b.id, b); }
    }, 4000);
    return;
  }

  const side = b.state[me];
  const hype = side.hype || 0;
  const active = cardById(side.cards[side.active]);
  idleClash('Kies je zet');
  actions.innerHTML = ['flex', 'roast', 'charm'].map((k, i) => `<button type="button" class="mv m-${k}" data-move="${k}">
      <span class="mv-key">${i + 1}</span><span class="mv-ico">${MV_ICON[k]}</span><b>${MOVES[k].label}</b><small>${MOVES[k].info}</small></button>`).join('')
    + `<button type="button" class="mv m-signature${hype >= 3 ? ' ready' : ''}" data-move="signature" ${hype >= 3 ? '' : 'disabled'}>
      <span class="mv-key">4</span><span class="mv-ico">${MV_ICON.signature}</span><b>${esc(active?.special_name || 'Signature')}</b>
      <small>${hype >= 3 ? 'Klaar. Wint van alles.' : `Hype ${hype}/3`}</small></button>`;
  msg.className = 'msg'; msg.textContent = side.hp.some((h, i) => i !== side.active && h > 0) ? 'Of tik op een kaart op je bank om te wisselen.' : '';

  let busy = false;
  send = async (move, target = null) => {
    if (busy) return;
    busy = true;
    actions.querySelectorAll('button').forEach(x => { x.disabled = true; x.classList.toggle('chosen', x.dataset.move === move); });
    actions.classList.add('locked');
    msg.textContent = move === 'switch' ? 'Wissel ingediend…' : `${moveName(move)} gekozen…`;
    const { error: e3 } = await sb.rpc('tb_act', { p_id: b.id, p_action: move, p_target: target });
    document.removeEventListener('keydown', onKey);
    if (e3) { msg.className = 'msg err'; msg.textContent = e3.message; openBattle(view, b.id); return; }
    openBattle(view, b.id, b);
  };
  actions.querySelectorAll('[data-move]').forEach(btn => { btn.onclick = () => send(btn.dataset.move); });
  // Wisselen: tik op een kaart op je bank
  function bindBench() {
    $('#side-me')?.querySelectorAll('[data-bench]:not([disabled])').forEach(bc => {
      bc.onclick = () => { if (send) send('switch', Number(bc.dataset.bench)); };
    });
  }
  bindBench();
  // Toetsen 1-4 op de computer
  const onKey = e => {
    if (!$('#btActions')) { document.removeEventListener('keydown', onKey); return; }
    if (e.target.closest('input, textarea, select')) return;
    const k = ['flex', 'roast', 'charm', 'signature'][Number(e.key) - 1];
    const btn = k && actions.querySelector(`[data-move="${k}"]:not([disabled])`);
    if (btn) { e.preventDefault(); send(k); }
  };
  document.addEventListener('keydown', onKey);
}

// ---------- Melding bij een nieuwe versie van de site ----------
// Vergelijkt de CSS + code van deze pagina met de versie op de server. Geen versienummer nodig:
// elke wijziging aan index.html wordt vanzelf opgemerkt.
function siteFingerprint(doc) {
  const style = doc.querySelector('style')?.textContent || '';
  const scripts = [...doc.querySelectorAll('script:not([src])')];
  const code = scripts.length ? scripts[scripts.length - 1].textContent : '';
  let h = 5381;
  const txt = style + '\u0000' + code;
  for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
  return h;
}
const CURRENT_FINGERPRINT = siteFingerprint(document);
let updateShown = false, lastUpdateCheck = 0;

async function checkForUpdate() {
  if (updateShown || Date.now() - lastUpdateCheck < 60000) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    if (siteFingerprint(doc) !== CURRENT_FINGERPRINT) showUpdateBanner();
  } catch (_) { /* offline of geblokkeerd: later opnieuw proberen */ }
}

function showUpdateBanner() {
  updateShown = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = `<span>✨ Er is een nieuwe versie van de site.</span>
    <button class="btn small" type="button" id="updateNow">Vernieuwen</button>
    <button class="link" type="button" id="updateLater" aria-label="Later">Later</button>`;
  document.body.appendChild(bar);
  $('#updateNow').onclick = async () => {
    $('#updateNow').disabled = true;
    // Eerst de browsercache bijwerken, zodat het herladen zeker de nieuwe versie toont
    try { await fetch(location.pathname, { cache: 'reload' }); } catch (_) {}
    location.reload();
  };
  $('#updateLater').onclick = () => { bar.remove(); setTimeout(() => { updateShown = false; }, 15 * 60000); };
}

setInterval(checkForUpdate, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
addEventListener('focus', checkForUpdate);

initBackground();
initTilt();
autoLite();
init();
</script>
