.rm-pennant{width:74px;height:120px;display:grid;place-items:start center;padding-top:12px;background:#C8102E;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);box-shadow:inset 0 6px 0 #F4EBDD}
.rm-pennant span{writing-mode:vertical-rl;transform:rotate(180deg);font:400 14px var(--varsity);letter-spacing:.12em;color:#F4EBDD;max-height:82px;overflow:hidden;text-transform:uppercase}
.rm-title .kicker{color:var(--gold)}
.rm-title h2{margin:2px 0 4px;color:var(--wallink)}
.rm-motto{margin:0;font:italic 500 16px/1.35 var(--display);opacity:.9}
.rm-motto.muted{opacity:.5;font-size:14px}
.rm-window{position:relative;width:110px;height:90px;border:6px solid #F2E8D5;border-radius:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#F2E8D5;box-shadow:0 10px 20px -10px rgba(0,0,0,.7)}
.rm-window span{background:linear-gradient(180deg,#6FA6D6,#CFE3EE)}
.rm-window.dusk span{background:linear-gradient(180deg,#2D2F62,#E8875F)}
.rm-window.night span{background:radial-gradient(circle at 30% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 2px),linear-gradient(180deg,#070C1E,#1B2754)}
.rm-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.rm-framebox{display:grid;justify-items:center;gap:10px}
.rm-slot{position:relative;transform:rotate(var(--r,0deg))}
.rm-slot.frame{width:230px;padding:14px;background:linear-gradient(135deg,#F1D58C,#B8862F 40%,#F6DE9C 60%,#9A7420);border-radius:6px;transform:none;
  box-shadow:0 20px 34px -14px rgba(0,0,0,.85),inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 8px rgba(0,0,0,.18)}
.rm-slot.frame::before{content:"";position:absolute;left:50%;top:-30px;width:90%;height:60px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 100%,rgba(255,240,200,.35),transparent);pointer-events:none}
.rm-plaque{padding:4px 12px;border-radius:4px;background:linear-gradient(180deg,#E8C979,#B8933F);color:#3A2A10;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 14px;align-content:start}
.rm-board .rm-slot{filter:drop-shadow(0 10px 10px rgba(0,0,0,.45));cursor:pointer;transition:transform .2s}
.rm-board .rm-slot:hover{transform:rotate(0deg) translateY(-4px) scale(1.04);z-index:2}
.rm-pin{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF7A8C,#C8102E 60%,#7A0614);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:3}
.rm-card{position:relative;cursor:pointer}
.rm-card .card{cursor:pointer}
.rm-lock{position:absolute;left:6%;right:6%;top:40%;padding:4px 6px;border-radius:6px;background:rgba(10,16,36,.82);color:var(--gold2);font:600 9px/1.2 var(--body);letter-spacing:.06em;text-align:center;text-transform:uppercase;z-index:5}
.rm-slot.empty{aspect-ratio:5/7;display:grid;place-items:center;border-radius:8px;border:2px dashed rgba(244,235,221,.22);background:rgba(0,0,0,.1)}
.rm-slot.frame.empty{aspect-ratio:auto;height:300px;border:0}
.rm-empty{font:400 22px var(--varsity);color:rgba(244,235,221,.35)}
.rm-slot.frame .rm-empty{font-size:13px;color:#5A4520;letter-spacing:.1em;text-transform:uppercase}
.room.t-cream .rm-slot.empty{border-color:rgba(28,37,64,.25)}.room.t-cream .rm-empty{color:rgba(28,37,64,.35)}
.room:not(.editing) .rm-board .rm-slot.empty{cursor:default}
.room.editing .rm-slot{cursor:pointer;outline:2px dashed var(--gold);outline-offset:4px}
.room.editing .rm-slot:hover{outline-style:solid}
.rm-shelf{padding:18px 20px 10px;background:linear-gradient(180deg,#5A3E2B,#4A3222);box-shadow:inset 0 6px 0 #6F4E37,inset 0 -6px 0 #3A2618}
.rm-trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.trophy{display:grid;justify-items:center;gap:3px;padding:8px 4px;text-align:center;color:#8A7766;opacity:.55}
.trophy.got{color:#F6DE9C;opacity:1}
.tr-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.25)}
.trophy.got .tr-ico{background:radial-gradient(circle at 40% 35%,#6E5520,#3A2A10);box-shadow:0 0 0 2px #D4A84B,0 0 18px rgba(246,222,156,.35)}
.trophy b{font:400 12px var(--varsity);letter-spacing:.04em;color:inherit}
.trophy small{font:500 10px/1.25 var(--body);color:#C9B79F}
.trophy:not(.got) small{color:#8A7766}
.rm-floor{height:26px;background:repeating-linear-gradient(90deg,#6B4A33 0 90px,#5E4029 90px 180px)}
.rm-desk{margin-top:22px}
.pickbox{width:min(900px,94vw)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-height:60vh;overflow:auto;padding:4px;margin:12px 0}
.pick-opt{border:0;padding:0;background:none;cursor:pointer;border-radius:10px;transition:transform .15s}
.pick-opt:hover{transform:translateY(-3px)}
.pick-clear{min-height:120px;border:2px dashed var(--line2);border-radius:10px;background:none;color:var(--ink-soft);font:600 13px var(--body);cursor:pointer}
@media (max-width:1099px){.rm-board{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:899px){
  .rm-wall{padding:16px 14px 20px}
  .rm-head{grid-template-columns:auto minmax(0,1fr);gap:14px}
  .rm-window{display:none}
  .rm-pennant{width:52px;height:90px}
  .rm-pennant span{font-size:11px;max-height:60px}
  .rm-main{grid-template-columns:minmax(0,1fr);gap:22px}
  .rm-slot.frame{width:min(230px,70vw)}
  .rm-board{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
  .rm-trophies{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* =====================================================================
   THE ARENA: lobby en speelscherm
   ===================================================================== */
.m-flex{--mc:#E0284A;--mc2:#8C0B21}
.m-roast{--mc:#F08A24;--mc2:#9A4A0A}
.m-charm{--mc:#D45FB0;--mc2:#7A2466}
.m-signature{--mc:#EBCB7E;--mc2:#9A7420}
.m-switch,.m-forfeit{--mc:#8790A8;--mc2:#3A4466}
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:6px}
@media (max-width:1099px){.lobby{grid-template-columns:minmax(0,1fr)}}
.lineup-box,.opp-box{padding:16px 18px;border-radius:16px;background:linear-gradient(180deg,#1A2340,#141B31);border:1px solid var(--line)}
.lineup-box h3,.opp-box h3{margin:0 0 12px}
.lb-head{display:flex;justify-content:space-between;align-items:baseline}
.lb-head h3{margin:0}
.lineup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
.lu-slot{position:relative;min-height:140px;display:grid;place-items:center;border-radius:12px;border:2px dashed var(--line2);background:rgba(0,0,0,.18)}
.lu-slot.filled{border:0;background:none;animation:lu-in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes lu-in{from{transform:translateY(10px) scale(.94);opacity:0}}
.lu-slot .cw{width:100%}
.lu-num{position:absolute;top:-10px;left:-8px;z-index:6;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--red);color:#fff;font:400 15px var(--varsity);box-shadow:0 0 0 3px var(--bg)}
.lu-empty{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lb-hint{margin:12px 0 0}
.opp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opp-btn{position:relative;display:grid;align-content:start;gap:4px;padding:14px 14px 34px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);text-align:left;cursor:pointer;font:inherit;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.opp-btn b{font:400 18px var(--varsity);letter-spacing:.03em}
.opp-btn small{font:500 12.5px/1.35 var(--body);color:var(--ink-soft)}
.opp-reward{position:absolute;left:14px;bottom:11px;font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
button.opp-btn:not(:disabled):hover{transform:translateY(-3px);border-color:var(--red2);box-shadow:0 14px 24px -14px rgba(224,40,74,.6)}
button.opp-btn:disabled{opacity:.45;cursor:not-allowed}
.opp-btn.d-easy{box-shadow:inset 4px 0 0 #3E8A5C}.opp-btn.d-normal{box-shadow:inset 4px 0 0 var(--gold)}.opp-btn.d-hard{box-shadow:inset 4px 0 0 var(--red2)}
.opp-btn.friend{cursor:default;box-shadow:inset 4px 0 0 #D45FB0}
.opp-btn.friend .tselect{margin:4px 0 6px;width:100%}
.opp-btn.friend .btn{justify-self:start}
.opp-btn.off{opacity:.6}
.lobby.ready .opp-btn:not(:disabled):not(.friend){animation:opp-pulse 2.4s ease-in-out infinite}
@keyframes opp-pulse{50%{border-color:rgba(224,40,74,.6)}}
.rules-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(200,16,46,.07)}
.rules-strip p{margin:0;flex:1;min-width:240px;font:500 13.5px/1.45 var(--body);color:var(--ink-soft)}
.rules-strip b{color:var(--gold2)}
.rs-tri{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rs-mv{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:999px;background:color-mix(in srgb,var(--mc) 18%,transparent);color:var(--mc);font:400 13px var(--varsity)}
.rs-mv svg{width:18px;height:18px}
.rs-arrow{font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Speelscherm */
.duel-page{display:grid;gap:14px}
.duel-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.duel-head .link{padding-left:0}
.dh-title{flex:1;min-width:200px}
.dh-title h2{margin:2px 0 0}
.dh-title h2 span{font-size:.6em;color:var(--red2);margin:0 4px}
.dh-right{display:flex;align-items:center;gap:12px}
.duel{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,240px) minmax(0,1fr);gap:16px;align-items:center;padding:22px 18px;border-radius:20px;overflow:hidden;
  background:
    radial-gradient(40% 60% at 15% 0%,rgba(255,240,200,.14),transparent 70%),
    radial-gradient(40% 60% at 85% 0%,rgba(255,240,200,.14),transparent 70%),
    linear-gradient(180deg,#1A2546 0%,#14203C 55%,#1F5C38 55.2%,#17462B 100%);
  border:1px solid var(--line2);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.duel::before{content:"";position:absolute;left:50%;top:55%;width:2px;height:45%;background:rgba(255,255,255,.25)}
.duel::after{content:"";position:absolute;left:50%;top:78%;width:120px;height:44px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.22);border-radius:50%}
.duel-side{position:relative;z-index:1;display:grid;gap:8px;justify-items:center;min-width:0}
.ds-top{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:230px}
.ds-name{font:400 17px var(--varsity);letter-spacing:.04em;color:var(--ink)}
.duel-side.op .ds-name{color:var(--err)}
.hype{display:inline-flex;align-items:center;gap:3px}
.hype i{width:16px;height:7px;border-radius:2px;background:rgba(255,255,255,.14);transform:skewX(-18deg)}
.hype i.on{background:linear-gradient(90deg,#EBCB7E,#D4A84B);box-shadow:0 0 8px rgba(235,203,126,.7)}
.hype b{margin-left:5px;font:700 9.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hype.full b{color:var(--gold2);animation:hype-pulse 1s ease-in-out infinite}
@keyframes hype-pulse{50%{opacity:.5}}
.duel .fighter-card{width:100%;max-width:min(220px,calc((100vh - 470px) * .714));min-width:150px;transition:transform .2s}
.duel .hpbar{max-width:230px;height:9px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.duel .hpfill{transition:width .5s cubic-bezier(.2,.8,.2,1),background .4s}
.hptext{font:600 12px var(--body);color:var(--ink-soft)}
.hptext b{font:400 16px var(--varsity);color:var(--ink)}
.duel .bench{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:230px}
.duel .bench-card{display:grid;gap:3px;justify-content:stretch;padding:6px 8px;text-align:left;background:rgba(10,16,36,.6);border:1px solid var(--line2)}
.duel .bench-card:not(:disabled){cursor:pointer}
.duel .bench-card:not(:disabled):hover{border-color:var(--gold)}
.bc-name{font:600 11px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-hp{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bc-hp i{display:block;height:100%;background:var(--green-soft)}
.bc-val{font:600 10px var(--body);color:var(--muted)}
.duel-side.lunge .fighter-card{animation:lunge-r .38s ease}
.duel-side.op.lunge .fighter-card{animation:lunge-l .38s ease}
@keyframes lunge-r{40%{transform:translateX(26px) rotate(3deg) scale(1.04)}}
@keyframes lunge-l{40%{transform:translateX(-26px) rotate(-3deg) scale(1.04)}}
.duel-side.hit .fighter-card{animation:shake .4s ease}
.duel-side.hit .fighter-card .card{animation:hitflash .4s ease}
@keyframes hitflash{30%{filter:brightness(1.8) saturate(.4)}}
.duel-side.ko .fighter-card{animation:ko-fall .6s ease forwards}
@keyframes ko-fall{to{transform:translateY(16px) rotate(-6deg);filter:grayscale(1) brightness(.45)}}
.duel-side.enter .fighter-card{animation:enter-in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter-in{from{transform:translateY(-24px) scale(.9);opacity:0}}
.duel .dmg-pop{top:35%;font:400 44px var(--varsity);color:#FF5A72;-webkit-text-stroke:2px #3A0610}
.duel .dmg-pop.big{font-size:58px;color:var(--gold2);-webkit-text-stroke:2px #3A2A10}
.duel .dmg-pop.heal{color:#7FD3A0;-webkit-text-stroke:2px #0F3A22}

/* De clash in het midden */
.clash{position:relative;z-index:2;min-height:220px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center}
.clash-idle{display:grid;gap:6px;justify-items:center;font:500 13px var(--body);color:var(--ink-soft)}
.ci-round{font:400 26px var(--varsity);color:var(--ink);letter-spacing:.06em}
.clash.final .ci-round{display:none}
.clash.final .clash-idle span:last-child{font:400 34px var(--varsity);letter-spacing:.08em}
.clash.final.r-win .clash-idle span:last-child{color:var(--gold2);text-shadow:0 0 24px rgba(235,203,126,.6)}
.clash.final.r-lose .clash-idle span:last-child{color:var(--err)}
.tok{display:grid;justify-items:center;gap:4px;width:96px;padding:12px 8px 10px;border-radius:14px;color:#fff;font:400 14px var(--varsity);letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(160deg,var(--mc),var(--mc2));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--mc) 70%,transparent),inset 0 0 0 2px rgba(255,255,255,.25)}
.tok svg{width:30px;height:30px}
.clash.show{grid-template-columns:auto auto auto;grid-template-rows:auto auto;column-gap:10px}
.clash.show .tok.mine{animation:tok-l .45s cubic-bezier(.2,.9,.2,1.2) both}
.clash.show .tok.theirs{animation:tok-r .45s cubic-bezier(.2,.9,.2,1.2) both}
@keyframes tok-l{from{transform:translateX(-120px) rotate(-20deg);opacity:0}}
@keyframes tok-r{from{transform:translateX(120px) rotate(20deg);opacity:0}}
.clash-vs{font:400 18px var(--varsity);color:var(--muted)}
.clash-res{grid-column:1/-1;font:400 17px var(--varsity);letter-spacing:.05em;color:var(--ink);opacity:0;transition:opacity .2s}
.clash.resolved .clash-res{opacity:1}
.clash.resolved.r-win .tok.mine,.clash.resolved.r-lose .tok.theirs{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 0 30px color-mix(in srgb,var(--mc) 80%,transparent);transition:transform .25s,box-shadow .25s}
.clash.resolved.r-win .tok.theirs,.clash.resolved.r-lose .tok.mine{transform:scale(.82);filter:grayscale(.8) brightness(.6);transition:transform .25s,filter .25s}
.clash.resolved.r-win .clash-res{color:var(--green-soft)}
.clash.resolved.r-lose .clash-res{color:var(--err)}
.clash.resolved.r-tie .tok{animation:tie-bump .35s ease}
@keyframes tie-bump{50%{transform:translateY(-6px)}}

/* Zetknoppen */
.duel-controls{display:grid;gap:8px;position:sticky;bottom:12px;z-index:20;padding:10px;border-radius:16px;background:rgba(12,17,32,.94);border:1px solid var(--line2);box-shadow:0 -10px 30px -10px rgba(0,0,0,.7)}
.duel-controls:has(.moves:empty){position:static;padding:0;background:none;border:0;box-shadow:none}
@media (max-width:899px){.duel-controls{bottom:calc(72px + env(safe-area-inset-bottom));padding:8px}}
.duel-controls .msg{margin:0;min-height:1.2em}
.moves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mv{position:relative;display:grid;justify-items:start;gap:3px;padding:14px 14px 13px;border-radius:14px;border:0;cursor:pointer;color:#fff;text-align:left;font:inherit;
  background:linear-gradient(160deg,var(--mc),var(--mc2));box-shadow:0 12px 22px -14px color-mix(in srgb,var(--mc) 80%,transparent),inset 0 0 0 1px rgba(255,255,255,.2);
  transition:transform .15s,box-shadow .15s,opacity .2s,filter .2s}
.mv:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 18px 28px -14px color-mix(in srgb,var(--mc) 90%,transparent),inset 0 0 0 2px rgba(255,255,255,.4)}
.mv:not(:disabled):active{transform:translateY(0) scale(.97)}
.mv b{font:400 19px var(--varsity);letter-spacing:.05em;text-transform:uppercase}
.mv small{font:500 12px/1.3 var(--body);opacity:.85}
.mv-ico svg{width:28px;height:28px}
.mv-key{position:absolute;top:10px;right:12px;font:700 11px var(--body);opacity:.55}
.mv.m-signature{color:#2A1E08}
.mv.m-signature:disabled{background:linear-gradient(160deg,#2C3554,#1E2742);color:var(--muted);box-shadow:none;cursor:not-allowed}
.mv.m-signature.ready{animation:sig-ready 1.3s ease-in-out infinite}
@keyframes sig-ready{50%{box-shadow:0 0 0 3px #fff,0 0 34px rgba(235,203,126,.9)}}
.moves.locked .mv:not(.chosen){opacity:.3;filter:grayscale(.6)}
.moves.locked .mv.chosen{opacity:1;transform:scale(1.03);box-shadow:0 0 0 3px #fff}

}

@media (max-width:899px){.arena-lists{grid-template-columns:minmax(0,1fr)}.ah-stats{width:100%}.ah-stats div{flex:1;min-width:0}.arena-hero{min-height:170px;padding:16px}}

/* Speelscherm: echt stadion */
.duel{background:linear-gradient(180deg,rgba(6,10,22,.25),rgba(6,10,22,.5)),url(img/arena.webp) center 55%/cover,
  radial-gradient(40% 60% at 15% 0%,rgba(255,240,200,.14),transparent 70%),radial-gradient(40% 60% at 85% 0%,rgba(255,240,200,.14),transparent 70%),
  linear-gradient(180deg,#1A2546 0%,#14203C 55%,#1F5C38 55.2%,#17462B 100%);min-height:420px}

.jumbo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:10px 16px;border-radius:14px;
  background:linear-gradient(180deg,#0B0F1C,#05070E);border:2px solid #2A3350;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 14px 30px -16px rgba(0,0,0,.9)}
.jb-side{display:flex;align-items:center;gap:12px;min-width:0}
.jb-side.op{flex-direction:row-reverse}
.jb-name{font:400 18px var(--varsity);letter-spacing:.06em;color:#FFE9A8;text-shadow:0 0 10px rgba(255,200,90,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb-side.op .jb-name{color:#FF8C9E;text-shadow:0 0 10px rgba(255,60,90,.45)}

.jb-team i{width:12px;height:12px;border-radius:50%;background:#7FD3A0;box-shadow:0 0 8px rgba(127,211,160,.6)}
.jb-team i.act{background:#FFE9A8;box-shadow:0 0 10px rgba(255,233,168,.9)}
.jb-team i.ko{background:transparent;box-shadow:inset 0 0 0 2px #4A3040}
.jb-mid{display:grid;justify-items:center;padding:4px 16px;border-radius:10px;background:#140A0E;border:1px solid #3A1A22}
.jb-mid small{font:700 9px var(--body);letter-spacing:.2em;text-transform:uppercase;color:#FF8C9E}
.dh-right #btRound{display:none}
.jb-mid b{font:400 28px/1 var(--varsity);color:#FF5A72;text-shadow:0 0 12px rgba(255,60,90,.6)}
.duel .hpbar{height:11px}
.duel .bench-card{background:rgba(6,10,22,.78);backdrop-filter:none}
@media (max-width:899px){

  .jb-side.op{flex-direction:row;justify-content:flex-end}

  .jb-side .hype b{display:none}

  .duel-side{grid-template-areas:"card hp" "card txt" "card bench"}
}

/* =====================================================================
   LESSENROOSTER EN MINIGAMES
   ===================================================================== */
.timetable{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:4px 0 18px}
.tt-day{position:relative;display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#1A2340,#141B31);text-align:center;opacity:.6}
.tt-day.party{background:linear-gradient(180deg,#2A1530,#1A0F22)}
.tt-day.today{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 24px -14px rgba(212,168,75,.6)}
.tt-d{font:700 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tt-day.today .tt-d{color:var(--gold)}
.tt-i{font-size:20px}
.tt-day b{font:400 12.5px var(--varsity);letter-spacing:.03em}
.tt-day small{font:500 10.5px/1.2 var(--body);color:var(--ink-soft)}
.tt-ok{position:absolute;top:6px;right:8px;color:var(--green-soft);font-weight:700}
@media (max-width:899px){.timetable{gap:4px}.tt-day{padding:7px 2px}.tt-day small{display:none}.tt-day b{font-size:10px}.tt-i{font-size:16px}}
.exam-intro,.exam-done,.exam-play{max-width:640px;padding:22px 24px;border-radius:18px;background:linear-gradient(180deg,#1A2340,#141B31);border:1px solid var(--line2);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.exam-intro .kicker{color:var(--gold)}
.exam-intro h3{margin:4px 0 10px;font:400 30px var(--varsity);letter-spacing:.03em;text-transform:none;color:var(--ink)}
.exam-intro ul{margin:0 0 14px;padding-left:18px;color:var(--ink);font:500 15px/1.5 var(--body)}
.grade-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.grade-row span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05);font:500 12.5px var(--body);color:var(--ink-soft)}
.grade-row b{font:400 18px var(--varsity);color:var(--gold2)}
.grade-row .f b{color:var(--err)}
.exam-done{display:grid;grid-template-columns:auto minmax(0,1fr) 180px;gap:22px;align-items:center;max-width:820px}
.exam-grade{display:grid;justify-items:center;gap:4px;width:120px;padding:14px 8px;border-radius:14px;background:#F4EBDD;color:#8C0B21;box-shadow:inset 0 0 0 3px #C8102E,0 14px 30px -14px rgba(0,0,0,.8);transform:rotate(-4deg)}
.exam-grade span{font:400 64px/1 var(--varsity)}
.exam-grade small{font:italic 600 11px var(--display);text-align:center}
.exam-grade.g-F{color:#5A0E1A;background:#E9D3D3}
.exam-done-txt h3{margin:0 0 6px}
.exam-done-txt p{margin:0 0 6px;color:var(--ink)}
.exam-card .cw{width:100%}
@media (max-width:899px){.exam-done{grid-template-columns:auto minmax(0,1fr)}.exam-card{grid-column:1/-1;width:min(220px,70%);justify-self:center}}
.exam-play{max-width:520px;margin:0 auto}
.exam-play-head{margin-bottom:10px}
.exam-play-head .kicker{color:var(--gold)}
.exam-play-head h3{margin:2px 0 0;font:400 24px var(--varsity);text-transform:none;letter-spacing:.03em;color:var(--ink)}
.game-box{position:relative}
.game-canvas{display:block;width:100%;aspect-ratio:4/5;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.game-hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none;font:600 13px var(--body);color:var(--ink)}
.game-hud span{padding:5px 10px;border-radius:999px;background:rgba(8,12,26,.75)}
.game-hud b{font:400 15px var(--varsity);color:var(--gold2);margin-left:4px}
/* Speed Math en History */
.mg-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font:600 14px var(--body)}
.mg-top span:first-child{font:400 18px var(--varsity);color:var(--gold2)}
.mg-time{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
.mg-time i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .1s linear}
.mg-q{padding:26px 10px;border-radius:14px;background:#F4EBDD;color:#1C2540;text-align:center;font:400 46px var(--varsity);margin-bottom:14px}
.mg-q.ok{animation:mg-ok .3s ease}.mg-q.bad{animation:shake .35s ease}
@keyframes mg-ok{50%{background:#C9F0D6}}
.mg-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg-opts button{padding:18px 8px;border-radius:12px;border:0;background:linear-gradient(160deg,#243052,#1A2340);color:var(--ink);font:400 26px var(--varsity);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line2);touch-action:manipulation}
.mg-opts button:active{transform:scale(.97);background:#2C3A60}
.hg-ask{margin:0 0 12px;font:400 20px var(--varsity);text-align:center}
.hg-opts{display:grid;gap:10px}
.hg-opts button{display:grid;gap:4px;padding:18px 14px;border-radius:14px;border:0;background:#F4EBDD;color:#1C2540;cursor:pointer;text-align:center;font:inherit;touch-action:manipulation;transition:background .2s,transform .1s}
.hg-opts button b{font:700 18px/1.25 var(--display)}
.hg-year{font:400 16px var(--varsity);color:#8C0B21;visibility:hidden}
.hg-opts.reveal .hg-year{visibility:visible}
.hg-opts button.ok{background:#C9F0D6}.hg-opts button.bad{background:#F3C4CC}.hg-opts button.other{opacity:.7}
.hg-or{text-align:center;font:italic 600 13px var(--display);color:var(--muted)}
.bar-fill.f{background:linear-gradient(90deg,#8C0B21,#E0284A)}
.bar-label small{color:var(--muted);font-size:10.5px;margin-left:4px}
.fcount{color:var(--err)}

/* Exam Hall: foto van de examenzaal als banner */
.exam-hero{position:relative;padding:22px 22px 16px;margin-bottom:18px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 30px 60px -30px rgba(0,0,0,.9);
  background:linear-gradient(180deg,rgba(8,12,26,.25),rgba(8,12,26,.55) 45%,rgba(8,12,26,.92)),url(img/examhall-day.webp) center 38%/cover,#1A1410}
.exam-hero.night{background:linear-gradient(180deg,rgba(8,12,26,.15),rgba(8,12,26,.5) 45%,rgba(8,12,26,.92)),url(img/examhall-night.webp) center 38%/cover,#0E0B08}
.exam-hero .page-head{min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:12px}
.exam-hero .kicker{color:var(--gold2)}
.exam-hero h2{text-shadow:0 2px 14px rgba(0,0,0,.8)}
.exam-hero .joke{color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.9)}
.exam-hero .timetable{margin:0}
.exam-hero .tt-day{background:rgba(10,14,28,.78);opacity:.8}
.exam-hero .tt-day.party{background:rgba(30,12,36,.78)}
.exam-hero .tt-day.today{opacity:1;background:rgba(20,16,10,.85)}
@media (max-width:899px){.exam-hero{padding:16px 10px 10px}.exam-hero .page-head{min-height:90px;padding:0 6px}}

/* Foto-banners: de volledige foto in beeld, tekst onderaan erover (gsm: eronder) */
.photo-hero{position:relative;display:block;min-height:0;padding:0;margin-bottom:18px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9);background:#0A0D18}

.photo-hero .hero-over{position:absolute;left:0;right:0;bottom:0;padding:90px 22px 18px;background:linear-gradient(180deg,transparent,rgba(8,12,26,.72) 38%,rgba(8,12,26,.94))}
.arena-hero .hero-over{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.exam-hero .page-head{min-height:0;margin-bottom:12px}
@media (max-width:899px){
  .photo-hero .hero-over{position:relative;margin-top:-56px;padding:40px 12px 12px;background:linear-gradient(180deg,transparent,rgba(8,12,26,.9) 40px,#0E1426 70px)}
  .exam-hero .page-head{padding:0 4px}
}

   PLEKKEN MET FOTO: de foto is de achtergrond van de hele pagina,
   alles zweeft erover

.shell[data-place="today"][data-phase="night"] .place-bg{background-image:linear-gradient(180deg,rgba(8,12,26,.25),rgba(8,12,26,.58) 40%,rgba(8,12,26,.8)),url(img/examhall-night.webp)}
.shell[data-place="battle"] .place-bg{background-image:linear-gradient(180deg,rgba(6,10,22,.2),rgba(6,10,22,.55) 45%,rgba(6,10,22,.8)),url(img/arena.webp)}
.shell[data-place="trade"] .place-bg{background-image:linear-gradient(180deg,rgba(10,8,12,.35),rgba(10,8,12,.62) 40%,rgba(10,8,12,.82)),url(img/blackmarket.webp)}
.shell[data-place="shop"] .place-bg{background-image:linear-gradient(180deg,rgba(8,12,26,.35),rgba(8,12,26,.62) 40%,rgba(8,12,26,.84)),url(img/vault.webp)}
.shell[data-place="ideas"] .place-bg{background-image:linear-gradient(180deg,rgba(8,12,26,.4),rgba(8,12,26,.65) 40%,rgba(8,12,26,.85)),url(img/townhall.webp)}
@media (min-width:900px){.place-bg{left:232px}}

.photo-hero{background:none;border:0;box-shadow:none;border-radius:0;overflow:visible}

.shell[data-place="trade"] .page-head,.shell[data-place="shop"] .page-head,.shell[data-place="ideas"] .page-head{min-height:22vh;display:flex;flex-direction:column;justify-content:flex-end}

.shell[data-place] .board-frame,.shell[data-place] .lineup-box,.shell[data-place] .opp-box,.shell[data-place] .roster-box,.shell[data-place] .al-box,

.shell[data-place="stats"] .stat-card,.shell[data-place="stats"] .tg,.shell[data-place="stats"] .house-table{background:rgba(14,19,38,.84)}

/* =====================================================================
   COMPUTER: alles in één scherm, zonder scrollen waar het niet nodig is
   ===================================================================== */

  .exam-hero .page-head,.arena-hero .ah-txt,.shell[data-place="trade"] .page-head,.shell[data-place="shop"] .page-head,.shell[data-place="ideas"] .page-head{min-height:0}
  .photo-hero{margin-bottom:10px}

  .board-frame{padding:14px 16px 12px}
  .bf-head{margin-bottom:10px}

  .wmsg{margin-bottom:6px}

  .ah-stats div{padding:6px 10px}

// Werkt alle plekken bij die het saldo, de collectie en de streak tonen (scorebord, shop)

function collectionText() {

// Aantal opeenvolgende dagen (tot en met vandaag of gisteren) dat er gespeeld is
function computeStreak(playedDates) {
  let streak = 0;
  const cursor = new Date(todayBrussels() + 'T00:00:00');
  if (!playedDates.has(todayBrussels())) cursor.setDate(cursor.getDate() - 1);
  while (playedDates.has(cursor.toLocaleDateString('sv-SE'))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

const todayBrussels = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' });
const LAUNCH_DATE = '2026-10-04';
const wordleNumber = (d = todayBrussels()) => Math.max(1, Math.round((Date.parse(d) - Date.parse(LAUNCH_DATE)) / 864e5) + 1);
const dateLabel = () => new Date().toLocaleDateString('nl-BE', { timeZone: 'Europe/Brussels', weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
const plural = n => n === 1 ? 'poging' : 'pogingen';

// ---------- Opstart en routing ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'PASSWORD_RECOVERY') {
      state.session = s; state.recovery = true;
      renderResetPassword();
      return;
    }
    const changed = s?.user?.id !== state.session?.user?.id;
    state.session = s;
    if (changed) route();
  });
  route();
}

// ---------- Snel wisselen tussen accounts op dit toestel ----------
// Sessies van eerder gebruikte accounts worden lokaal bewaard, zodat je zonder
// opnieuw in te loggen kan wisselen (bv. tussen admin en een gewoon testaccount).
const SAVED_KEY = 'rizz-saved-accounts';
function savedAccounts() {
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || {}; } catch (_) { return {}; }
}
function writeSavedAccounts(list) {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch (_) {}
}
async function saveCurrentAccount() {
  const { data: { session } } = await sb.auth.getSession(); // altijd de meest recente tokens
  if (!session) return;
  const list = savedAccounts();
  list[session.user.id] = {
    email: session.user.email, name: state.name || session.user.email,
    access_token: session.access_token, refresh_token: session.refresh_token
  };
  writeSavedAccounts(list);
}
function forgetAccount(userId) {
  const list = savedAccounts();
  delete list[userId];
  writeSavedAccounts(list);
}
async function switchAccount(userId) {
  await saveCurrentAccount();
  const target = savedAccounts()[userId];
  const { error } = await sb.auth.setSession({ access_token: target.access_token, refresh_token: target.refresh_token });
  if (error) {
    forgetAccount(userId);
    throw new Error(`Sessie van ${target.email} is verlopen. Log opnieuw in met dat account.`);
  }
}
async function addAnotherAccount() {
  await saveCurrentAccount();
  // Enkel de lokale sessie wissen (geen signOut), zodat de bewaarde sessie geldig blijft
  try { localStorage.removeItem(sb.auth.storageKey); } catch (_) {}
  location.reload();
}

async function route() {
  if (!state.session) {
    if (state.recovery && !authLinkError) authLinkError = 'De resetlink is ongeldig of verlopen.';
    state.recovery = false;
    renderAuth('login');
    return;
  }
  if (state.recovery) { renderResetPassword(); return; }
  app.innerHTML = '<p class="loading">Laden…</p>';
  try {
    await loadData();
    saveCurrentAccount();
    renderMain();
  } catch (e) {
    app.innerHTML = `<main class="wrap"><p role="alert" class="err">${esc(e.message)}</p><button class="btn" id="out">Uitloggen</button></main>`;
    $('#out').onclick = () => sb.auth.signOut();
  }
}

async function loadData() {
  const uid = state.session.user.id;
  const [cards, mine, prof, wallet, requests, admin, battlesIn, welcome, played, tradesIn] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('profiles').select('display_name, avatar_url, friend_code').eq('id', uid).maybeSingle(),
    sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle(),
    sb.from('friend_requests').select('id', { count: 'exact', head: true }).eq('recipient_id', uid),
    sb.from('admins').select('user_id').eq('user_id', uid).maybeSingle(),
    sb.from('tbattles').select('player_a, player_b, status, moved:state->moved').eq('mode', 'pvp').in('status', ['pending', 'active']).or(`player_a.eq.${uid},player_b.eq.${uid}`),
    sb.from('welcome_packs').select('user_id').eq('user_id', uid).maybeSingle(),
    sb.from('exam_results').select('exam_date').eq('user_id', uid).eq('status', 'done'),
    sb.from('trade_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending').eq('turn', uid)
  ]);
  for (const r of [cards, mine, prof, wallet]) if (r.error) throw new Error(r.error.message);
  // Niet fataal: enkel voor het bolletje op de Vrienden-tab
  state.incomingRequests = requests.error ? 0 : (requests.count || 0);
  state.incomingTrades = tradesIn.error ? 0 : (tradesIn.count || 0);
  // Admin ziet alle kaarten ontgrendeld (enkel weergave; echte bezittingen blijven ongewijzigd)
  state.isAdmin = !admin.error && !!admin.data;
  // Bolletje Battle: uitdagingen aan jou + gevechten tegen vrienden waarin jij aan zet bent
  state.incomingBattles = battlesIn.error ? 0 : (battlesIn.data || []).filter(b =>
    b.status === 'pending' ? b.player_b === uid : !(b.moved || {})[b.player_a === uid ? 'A' : 'B']).length;
  // Welkomstpakket nog niet opgehaald? (bestaat de tabel niet, dan geen knop)
  state.welcomeAvailable = !welcome.error && !welcome.data;
  state.playDates = new Set(played.error ? [] : (played.data || []).map(r => r.exam_date));
  state.cards = cards.data;
  state.owned = new Map();
  for (const row of mine.data) state.owned.set(row.card_id, (state.owned.get(row.card_id) || 0) + 1);
  state.name = prof.data?.display_name || state.session.user.email.split('@')[0];
  state.avatarUrl = prof.data?.avatar_url || null;
  state.friendCode = prof.data?.friend_code || '';
  state.wallet = wallet.data?.polycoins || 0;
  // Tijdelijke links naar de afgeschermde foto's van je eigen kaarten (admin: alle kaarten)
  await loadPhotos(state.isAdmin ? state.cards.map(c => c.id) : [...state.owned.keys()]);
}

// ---------- Kaartfoto's ----------
// De foto's staan in een privé opslagmap in Supabase (supabase/update-02-fotos.sql), niet op GitHub.
// Supabase geeft enkel een tijdelijke link voor kaarten die je bezit (of als admin). Zonder link
// (map nog leeg, of kaart niet in je bezit) toont de kaart de varsity-letter.
const PHOTO_BUCKET = 'card-photos';
async function loadPhotos(ids) {
  const want = [...new Set(ids)].map(id => state.cards.find(c => c.id === id))
    .filter(c => c && c.image_url && !state.photos.has(c.id));
  if (!want.length) return;
  try {
    const paths = want.map(c => c.image_url.replace(/^cards\//, ''));
    const { data, error } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths, 24 * 3600);
    if (error || !data) return;
    data.forEach((r, i) => { if (r.signedUrl && !r.error) state.photos.set(want[i].id, r.signedUrl); });
  } catch (_) { /* opslag niet bereikbaar: dan gewoon zonder foto's */ }
}

// Telt per card_id hoeveel exemplaren een gebruiker bezit, op basis van ruwe user_cards-rijen
function countByCard(rows) {
  const m = new Map();
  for (const r of rows) m.set(r.card_id, (m.get(r.card_id) || 0) + 1);
  return m;
}

// ---------- Wachtwoord vergeten ----------
function renderForgot(email = '') {
  app.innerHTML = authShell(`
    <span class="kicker">Student login</span>

    const msg = $('#forgotmsg');

    msg.className = 'msg'; msg.textContent = 'Versturen…'; btn.disabled = true;
    try {
      const { error } = await sb.auth.resetPasswordForEmail(e.target.email.value.trim(), {
        redirectTo: location.origin + location.pathname
      });
      if (error) throw error;
      msg.className = 'msg ok';
      msg.textContent = 'Als er een account bestaat met dit e-mailadres, kreeg je zonet een mail met een resetlink. Kijk ook even in je spamfolder.';

// Getoond wanneer iemand via de link in de reset-mail binnenkomt
function renderResetPassword() {
  app.innerHTML = authShell(`
    <span class="kicker">Student login</span>
    <h2>Nieuw wachtwoord</h2>
    <p class="hint">Kies een nieuw wachtwoord voor ${esc(state.session?.user?.email)}.</p>
    <form id="resetform" class="form">
      <label>Nieuw wachtwoord<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <label>Herhaal wachtwoord<input name="password2" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn" type="submit">Wachtwoord opslaan</button>
      <p id="resetmsg" role="alert" class="msg"></p>
    </form>`);
  $('#resetform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = $('#resetmsg');
    const btn = e.target.querySelector('button[type=submit]');
    if (f.get('password') !== f.get('password2')) {
      msg.className = 'msg err'; msg.textContent = 'De wachtwoorden komen niet overeen.'; return;
    }
    msg.className = 'msg'; msg.textContent = 'Opslaan…'; btn.disabled = true;
    try {
      const { error } = await sb.auth.updateUser({ password: f.get('password') });
      if (error) throw error;
      msg.className = 'msg ok'; msg.textContent = 'Wachtwoord gewijzigd! Je wordt doorgestuurd…';

}

function renderCardBack() {

function openZoom(card) {
  const dlg = $('#zoom');
  let showingBack = false, busy = false;
  dlg.innerHTML = `<div class="zoombox">
    <button type="button" class="zoom-card" id="zoomCard" aria-label="Kaart omdraaien">
      <div class="zoom-inner" id="zoomInner">${renderCard(card)}</div>
    </button>
    <p class="zoomhint">Tik op de kaart om ze om te draaien</p>
    <button type="button" class="link" id="zoomClose">Sluiten</button>
  </div>`;
  const btn = $('#zoomCard'), inner = $('#zoomInner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.onclick = async () => {
    if (busy) return;
    busy = true;
    if (!reduce) { btn.classList.add('turning'); await sleep(200); }
    showingBack = !showingBack;
    inner.innerHTML = showingBack ? renderCardBack(card) : renderCard(card);
    btn.classList.add('turning-back');
    btn.classList.remove('turning');
    if (!reduce) await sleep(200);
    btn.classList.remove('turning-back');
    busy = false;
  };
  $('#zoomClose').onclick = () => dlg.close();
  dlg.showModal();
}

function renderCard(c, { locked = false, count = 1 } = {}) {
  const label = RARITY_LABEL[c.rarity];
  const no = `<span class="no">RA'26 · ${String(c.slot).padStart(2, '0')}/09</span>`;
  if (locked) {
    return `<div class="cw"><div class="card r-${c.rarity} locked" aria-label="Nog niet verzameld">
      <div class="photo"><div class="art"><span class="q">?</span></div></div>
      <span class="cbadge" aria-hidden="true">RIZZ</span><span class="rtag">${label}</span>
      <div class="cband"><span class="cname">Nog niet verzameld</span></div>
      <div class="cinfo"><div class="cstats">${no}</div></div>
    </div></div>`;
  }
  const initial = esc((c.person || '?').trim().charAt(0).toUpperCase());
  // Letter als tijdelijke illustratie; de foto (als die er is) ligt erbovenop
  const placeholder = c.rarity === 'cat' ? '<span class="ptile cat">📝</span>' : `<span class="ptile">${initial}</span>`;
  const photo = state.photos.get(c.id);
  const art = placeholder + (photo
    ? `<img src="${esc(photo)}" alt="${esc(c.name)}" loading="lazy" onerror="this.remove()">`
    : '');
  const special = c.special_name
    ? `<div class="special">★ ${esc(c.special_name)}${c.special_power ? ` · ${esc(c.special_power)}` : ''}<small> ${esc(c.special_desc)}</small></div>`
    : '';
  const flavor = c.flavor_text ? `<div class="flavor">“${esc(c.flavor_text)}”</div>` : '';
  return `<div class="cw">
    ${count > 1 ? `<span class="dupe">×${count}</span>` : ''}
    <div class="card r-${c.rarity}" data-card="${c.id}">
      <div class="photo"><div class="art">${art}</div></div>
      <span class="cbadge" aria-hidden="true">RIZZ</span><span class="rtag">${label}</span><span class="hp">${esc(c.hp)}</span>
      <div class="cband"><span class="cname${c.name.length > 18 ? ' long' : ''}">${esc(c.name)}</span>${flavor}${special}</div>
      <div class="cinfo"><div class="cstats"><span>RIZZ<b>${esc(c.attack)}</b></span><span>AURA<b>${esc(c.defense)}</b></span>${no}</div></div>
    </div></div>`;
}

// ---------- Achtergrond ----------
// Rustig en statisch (CSS). Het confetti-canvas draait enkel zolang er confetti valt.
function initBackground() {
  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.setAttribute('aria-hidden', 'true');
  scene.innerHTML = '<canvas id="bgfx"></canvas>';
  document.body.prepend(scene);
  const cv = scene.querySelector('#bgfx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = matchMedia('(max-width: 899px)').matches;
  const CONFETTI = ['#B89A5E', '#D2BA86', '#7C2A33', '#E9E1D3', '#4F7F5D'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let W = 0, H = 0, bits = [], running = false;
  const size = () => {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(size, 200); });
  size();

  // Confetti
  let last = 0;
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
    for (const b of bits) {
      b.vy += 380 * dt; b.vx *= .985; b.vy = Math.min(b.vy, 260);
      b.x += (b.vx + Math.sin(b.flip) * 30) * dt; b.y += b.vy * dt;
      b.rot += b.vr * dt; b.flip += b.vf * dt;
      if (b.y > H * .8) b.life -= dt * 1.5;
    }
    bits = bits.filter(b => b.life > 0 && b.y < H + 40);
    ctx.clearRect(0, 0, W, H);
    for (const b of bits) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.scale(1, Math.cos(b.flip));
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
    if (bits.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  const start = () => { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } };
  const spawn = (x, y, n, speed, up) => {
    for (let i = 0; i < n && bits.length < (small ? 250 : 450); i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(speed * .4, speed);
      bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - up, rot: rnd(0, 6.28), vr: rnd(-9, 9), flip: rnd(0, 6.28), vf: rnd(5, 14),
        w: rnd(6, 11), h: rnd(9, 16), c: pick(CONFETTI), life: 1.4 });
    }
    start();
  };
  // Confetti-regen vanuit de lucht (bij een gewonnen Wordle of een zeldzame kaart)
  window.celebrate = (level = 'common') => {
    if (reduce) return;
    const n = (level === 'legendary' ? 220 : level === 'epic' ? 140 : 80) * (small ? .6 : 1);
    for (let i = 0; i < n; i++) setTimeout(() => spawn(rnd(0, W), -20, 1, 120, -rnd(40, 160)), i * 7);
    spawn(W * .2, H * .35, n / 6, 520, 260);
    spawn(W * .8, H * .35, n / 6, 520, 260);
  };
}

// ---------- Kaarten kantelen in 3D en glanzen mee met muis of vinger ----------
function initTilt() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let cur = null;
  const reset = el => { el.classList.remove('tilting'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); };
  addEventListener('pointermove', e => {
    const card = e.target.closest ? e.target.closest('.card:not(.locked)') : null;
    if (cur && cur !== card) { reset(cur); cur = null; }
    if (!card) return;
    const r = card.parentElement.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    const k = r.width > 260 ? 1 : .75;
    card.style.setProperty('--rx', `${((.5 - y) * 20 * k).toFixed(2)}deg`);
    card.style.setProperty('--ry', `${((x - .5) * 24 * k).toFixed(2)}deg`);
    card.style.setProperty('--mx', `${(x * 100).toFixed(1)}%`);
    card.style.setProperty('--my', `${(y * 100).toFixed(1)}%`);
    card.classList.add('tilting');
    cur = card;
  }, { passive: true });
  const leave = () => { if (cur) { reset(cur); cur = null; } };
  document.addEventListener('pointerleave', leave);
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') leave(); });
  addEventListener('blur', leave);
}

// ---------- Zuinige stand: meet na het laden hoe vlot het toestel tekent ----------
// Haalt het geen 45 beelden per seconde, dan gaan de zwaarste achtergrondeffecten uit.
function autoLite() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setTimeout(() => {
    if (document.hidden) return;
    let n = 0;
    const t0 = performance.now();
    const f = now => {
      n++;
      if (now - t0 < 2000) return requestAnimationFrame(f);
      if (!document.hidden && n / ((now - t0) / 1000) < 45) document.documentElement.classList.add('lite');
    };
    requestAnimationFrame(f);
  }, 2500);
}

// ---------- Stempel, flits en schok voor de grote momenten ----------
const prefersReduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function showStamp(text, cls = '', sub = '', wait = 1100) {
  if (prefersReduced()) return Promise.resolve();
  const el = document.createElement('div');
  el.className = `stamp k-${cls}`;
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ''}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1950);
  return sleep(wait);
}
function flashScreen(kind) {
  if (prefersReduced()) return;
  const el = document.createElement('div');
  el.className = `flash ${kind}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function quake() {
  if (prefersReduced()) return;
  app.classList.remove('quake'); void app.offsetWidth; app.classList.add('quake');
  setTimeout(() => app.classList.remove('quake'), 600);
}

function resizeImageToDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Foto kon niet gelezen worden.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ongeldige afbeelding.'));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', .85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function mulberry32(a) {

}

// Canvas met een vaste logische grootte (400×500), geschaald naar de breedte van het scherm
function gameCanvas(box) {

}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- Di · Speed Math ----------
function gameMath(box, rnd) {
  return new Promise(resolve => {
    let score = 0, n = 0, end = performance.now() + 60000, q;
    box.innerHTML = `<div class="math-game"><div class="mg-top"><span id="mgScore">0 juist</span><span class="mg-time"><i id="mgBar"></i></span></div>
      <div class="mg-q" id="mgQ"></div><div class="mg-opts" id="mgOpts"></div></div>`;
    const next = () => {
      n++;
      const lvl = Math.min(4, Math.floor(n / 6));
      const op = ['+', '−', '×', '+', '×'][Math.floor(rnd() * (lvl < 1 ? 2 : lvl < 2 ? 4 : 5))];
      let a, b, ans;
      if (op === '×') { a = 2 + Math.floor(rnd() * (6 + lvl * 2)); b = 2 + Math.floor(rnd() * 9); ans = a * b; }
      else { a = 5 + Math.floor(rnd() * (20 + lvl * 25)); b = 2 + Math.floor(rnd() * (10 + lvl * 15)); if (op === '−' && b > a) [a, b] = [b, a]; ans = op === '+' ? a + b : a - b; }
      const opts = new Set([ans]);
      while (opts.size < 4) { const d = (1 + Math.floor(rnd() * 6)) * (rnd() < .5 ? -1 : 1) * (op === '×' && rnd() < .5 ? b : 1); if (ans + d >= 0) opts.add(ans + d); }
      q = ans;
      $('#mgQ').textContent = `${a} ${op} ${b}`;
      $('#mgOpts').innerHTML = [...opts].sort(() => rnd() - .5).map(v => `<button type="button" data-v="${v}">${v}</button>`).join('');
    };
    $('#mgOpts').onclick = e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      const ok = Number(b.dataset.v) === q;
      score = Math.max(0, score + (ok ? 1 : -1));
      $('#mgScore').textContent = `${score} juist`;
      const qEl = $('#mgQ'); qEl.className = 'mg-q ' + (ok ? 'ok' : 'bad'); void qEl.offsetWidth;
      next();
    };
    next();
    const tick = () => {
      const left = end - performance.now();
      if (!$('#mgBar')) return resolve(score);
      $('#mgBar').style.width = `${clamp(left / 600, 0, 100)}%`;
      if (left <= 0) return resolve(score);
      requestAnimationFrame(tick);
    };
    tick();
  });
}

  ['Eerste vlucht van de gebroeders Wright', 1903], ['De Titanic zinkt', 1912], ['Begin Eerste Wereldoorlog', 1914], ['Penicilline ontdekt', 1928],
  ['Eerste WK voetbal', 1930], ['Eerste McDonald\'s', 1940], ['Einde Tweede Wereldoorlog', 1945], ['Het Atomium wordt gebouwd', 1958],
  ['Eerste album van The Beatles', 1963], ['Eerste mens op de maan', 1969], ['Eerste Star Wars-film', 1977], ['Thriller van Michael Jackson', 1982],
  ['Ramp van Tsjernobyl', 1986], ['Val van de Berlijnse Muur', 1989], ['PlayStation 1 komt uit', 1994], ['Eerste Harry Potter-boek', 1997],
  ['Google wordt opgericht', 1998], ['De euro in je portemonnee', 2002], ['Facebook gaat online', 2004], ['YouTube gaat online', 2005],
  ['Eerste iPhone', 2007], ['Spotify start', 2008], ['Bitcoin bestaat', 2009], ['Instagram start', 2010], ['Minecraft komt uit', 2011],
  ['Fortnite komt uit', 2017], ['Rode Duivels 3e op het WK', 2018], ['Corona-lockdowns', 2020], ['ChatGPT verschijnt', 2022], ['Eerste Tomorrowland', 2005],
];
const yearLabel = y => (y < 0 ? `${-y} v.C.` : String(y));
function gameHistory(box, rnd) {
  return new Promise(resolve => {
    const ev = HISTORY_EVENTS.slice().sort(() => rnd() - .5);
    const pairs = [];
    for (let i = 0; i + 1 < ev.length && pairs.length < 10; i += 2) if (Math.abs(ev[i][1] - ev[i + 1][1]) >= 2) pairs.push([ev[i], ev[i + 1]]);
    let i = 0, score = 0, timer = null;
    box.innerHTML = `<div class="hist-game"><div class="mg-top"><span id="hgScore">0 juist</span><span id="hgN">1/10</span><span class="mg-time"><i id="mgBar"></i></span></div>
      <p class="hg-ask">Wat gebeurde er eerst?</p><div class="hg-opts" id="hgOpts"></div></div>`;
    const show = () => {
      if (i >= pairs.length || !$('#hgOpts')) return resolve(score);
      $('#hgN').textContent = `${i + 1}/${pairs.length}`;
      const [a, b] = pairs[i];
      $('#hgOpts').innerHTML = [a, b].map((e, k) => `<button type="button" data-k="${k}"><b>${esc(e[0])}</b><small class="hg-year">${yearLabel(e[1])}</small></button>`).join('<span class="hg-or">of</span>');
      const t0 = performance.now();
      const run = () => {
        if (!$('#mgBar')) return;
        const left = 8000 - (performance.now() - t0);
        $('#mgBar').style.width = `${clamp(left / 80, 0, 100)}%`;
        if (left <= 0) return answer(-1);
        timer = requestAnimationFrame(run);
      };
      run();
    };
    const answer = k => {
      cancelAnimationFrame(timer);
      const [a, b] = pairs[i], first = a[1] < b[1] ? 0 : 1;
      if (k === first) score++;
      $('#hgScore').textContent = `${score} juist`;
      const opts = $('#hgOpts');
      opts.classList.add('reveal');
      opts.querySelectorAll('[data-k]').forEach(btn => btn.classList.add(Number(btn.dataset.k) === first ? 'ok' : (Number(btn.dataset.k) === k ? 'bad' : 'other')));
      i++;
      setTimeout(show, 1100);
    };
    $('#hgOpts').onclick = e => { const b = e.target.closest('[data-k]'); if (b && !$('#hgOpts').classList.contains('reveal')) answer(Number(b.dataset.k)); };
    const obs = new MutationObserver(() => { $('#hgOpts')?.classList.remove('reveal'); });
    obs.observe($('#hgOpts'), { childList: true });
    show();
  });
}

// ---------- Swipe-worp (basketbal en beer pong) ----------
function swipeInput(c, pos, onThrow) {
  let start = null;
  c.addEventListener('pointerdown', e => { start = { ...pos(e), t: performance.now() }; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointerup', e => {
    if (!start) return;
    const p = pos(e), dx = p.x - start.x, dy = p.y - start.y;
    start = null;
    if (dy < -30) onThrow(dx, -dy);
  });
}

// ---------- Wo · Free Throws ----------
function gameHoops(box, rnd) {
  return new Promise(resolve => {
    const { c, ctx, pos, hud } = gameCanvas(box);
    let shot = 0, made = 0, ball = null, hx = 200, t0 = performance.now(), msg = '', msgT = 0, done = false;
    const RIM_Y = 150, RIM_W = 34;
    const hoopX = now => (shot < 3 ? 200 : 200 + Math.sin((now - t0) / (shot < 6 ? 900 : 560)) * (shot < 6 ? 70 : 95));
    swipeInput(c, pos, (dx, p) => {
      if (ball || done) return;
      // kracht bepaalt of de bal tot aan de ring komt; links/rechts wordt beslist bij aankomst
      ball = { t: 0, xl: 200 + dx * 1.15, kind: p < 160 ? 'short' : p > 345 ? 'long' : 'ok' };
    });
    const draw = now => {
      if (done) return;
      hx = hoopX(now);
      ctx.clearRect(0, 0, 400, 500);
      // vloer en muur
      const g = ctx.createLinearGradient(0, 0, 0, 500); g.addColorStop(0, '#1A2340'); g.addColorStop(.62, '#20294A'); g.addColorStop(.62, '#B9824C'); g.addColorStop(1, '#8E5E33');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 500);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(200, 470, 120, 30, 0, Math.PI, 0); ctx.stroke();
      // bord
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(hx - 62, 60, 124, 84);
      ctx.strokeStyle = '#C8102E'; ctx.lineWidth = 3; ctx.strokeRect(hx - 62, 60, 124, 84); ctx.strokeRect(hx - 22, 100, 44, 34);
      // net (achter)
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
      for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(hx + k * 11, RIM_Y); ctx.lineTo(hx + k * 7, RIM_Y + 42); ctx.stroke(); }
      // bal
      const drawBall = (x, y, r) => {
        const bg = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .2, x, y, r); bg.addColorStop(0, '#F5A35A'); bg.addColorStop(1, '#C2601E');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(40,20,10,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
      };
      let front = null;
      if (ball) {
        ball.t += 1 / 50;
        const t = Math.min(ball.t, 1), b = ball;
        if (ball.t >= 1 && b.kind === 'ok') b.kind = Math.abs(b.xl - hx) < RIM_W - 6 ? 'in' : Math.abs(b.xl - hx) < RIM_W + 14 ? 'rim' : 'miss';
        const tx = b.xl;
        let x = lerp(200, tx, t), y, r = lerp(26, 15, t);
        const endY = b.kind === 'short' ? 250 : b.kind === 'long' ? 70 : RIM_Y - 8;
        y = lerp(430, endY, t) - Math.sin(t * Math.PI) * 170;
        if (ball.t > 1) {
          const u = ball.t - 1;
          if (b.kind === 'in') { x = lerp(tx, hx, Math.min(1, u * 4)); y = RIM_Y - 8 + u * 160; front = true; }
          else if (b.kind === 'rim') { x = tx + (tx < hx ? -1 : 1) * u * 120; y = RIM_Y - 8 - Math.sin(u * 4) * 30 + u * 160; }
          else { y = endY + u * 260; }
          if (u > .7) {
            if (b.kind === 'in') { made++; msg = ['Swish!', 'Money!', 'Buckets!'][made % 3]; } else msg = { short: 'Te kort', long: 'Te ver', rim: 'Op de ring…', miss: 'Mis' }[b.kind];
            msgT = now; shot++; ball = null;
            if (shot >= 10) { done = true; setTimeout(() => resolve(made), 700); }
          }

// ---------- Za · Beer Pong ----------
function gamePong(box, rnd) {
  return new Promise(resolve => {
    const { c, ctx, pos, hud } = gameCanvas(box);
    const cups = [[160, 105], [200, 105], [240, 105], [180, 138], [220, 138], [200, 171]].map(([x, y]) => ({ x, y, hit: false }));
    let balls = 0, hits = 0, ball = null, msg = '', msgT = 0, done = false;
    swipeInput(c, pos, (dx, p) => {
      if (ball || done) return;

    });
    const draw = now => {
      if (done) return;
      ctx.clearRect(0, 0, 400, 500);
      ctx.fillStyle = '#0C1120'; ctx.fillRect(0, 0, 400, 500);
      // tafel in perspectief
      ctx.fillStyle = '#1F5C38'; ctx.beginPath(); ctx.moveTo(110, 60); ctx.lineTo(290, 60); ctx.lineTo(390, 500); ctx.lineTo(10, 500); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(200, 60); ctx.lineTo(200, 500); ctx.stroke();
      // bekers
      for (const cp of cups) {
        if (cp.hit) continue;
        ctx.fillStyle = '#C8102E'; ctx.beginPath(); ctx.moveTo(cp.x - 17, cp.y); ctx.lineTo(cp.x + 17, cp.y); ctx.lineTo(cp.x + 13, cp.y + 26); ctx.lineTo(cp.x - 13, cp.y + 26); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#D9A441'; ctx.beginPath(); ctx.ellipse(cp.x, cp.y + 1, 13, 4, 0, 0, 7); ctx.fill();

      if (ball) {

          if (cp) { cp.hit = true; hits++; msg = ['Splash!', 'Drink!', 'Re-rack!'][hits % 3]; } else msg = 'Mis';
          msgT = now; balls++; ball = null;

}

// ---------- Vr · Darts ----------
const DART_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
function dartScore(dx, dy) {
  const r = Math.hypot(dx, dy);
  if (r <= 8) return 50; if (r <= 18) return 25; if (r > 170) return 0;
  const ang = (Math.atan2(dx, -dy) * 180 / Math.PI + 360 + 9) % 360;
  const base = DART_ORDER[Math.floor(ang / 18)];
  return r >= 96 && r <= 106 ? base * 3 : r >= 160 ? base * 2 : base;
}
function gameDarts(box, rnd) {
  return new Promise(resolve => {
    const { c, ctx, pos, hud } = gameCanvas(box);
    const CX = 200, CY = 235;
    let aim = null, holdT = 0, darts = [], total = 0, msg = '', msgT = 0, done = false;
    const touch = matchMedia('(pointer: coarse)').matches;
    c.addEventListener('pointerdown', e => { if (done || darts.length >= 6) return; aim = pos(e); holdT = performance.now(); c.setPointerCapture(e.pointerId); });
    c.addEventListener('pointermove', e => { if (aim) aim = pos(e); });
    c.addEventListener('pointerup', () => {
      if (!aim) return;
      const p = sway(performance.now());
      const s = dartScore(p.x - CX, p.y - CY);
      darts.push({ x: p.x, y: p.y }); total += s; msg = s ? (s === 50 ? 'BULLSEYE!' : `+${s}`) : 'Naast';
      msgT = performance.now(); aim = null;
      if (darts.length >= 6) { done = true; setTimeout(() => resolve(total), 900); }
    });
    // Hand trilt meer naarmate je langer mikt
    const sway = now => {
      const h = (now - holdT) / 1000, amp = 5 + 18 * Math.min(1, h / 2.2);
      const off = touch ? -70 : 0;
      return { x: aim.x + Math.sin(now / 190) * amp + Math.sin(now / 77) * amp * .35, y: aim.y + off + Math.cos(now / 230) * amp + Math.sin(now / 61) * amp * .3 };
    };
    const drawBoard = () => {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(CX, CY, 192, 0, 7); ctx.fill();
      for (let i = 0; i < 20; i++) {
        const a0 = (i * 18 - 9 - 90) * Math.PI / 180, a1 = a0 + 18 * Math.PI / 180, even = i % 2 === 0;
        const ring = (r0, r1, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(CX, CY, r1, a0, a1); ctx.arc(CX, CY, r0, a1, a0, true); ctx.fill(); };
        ring(18, 170, even ? '#1A1A1A' : '#EFE3C4');
        ring(96, 106, even ? '#C8102E' : '#2E7A44');
        ring(160, 170, even ? '#C8102E' : '#2E7A44');
        ctx.fillStyle = '#F4EBDD'; ctx.font = '700 15px Inter, Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const am = (i * 18 - 90) * Math.PI / 180; ctx.fillText(DART_ORDER[i], CX + Math.cos(am) * 182, CY + Math.sin(am) * 182);
      }
      ctx.fillStyle = '#2E7A44'; ctx.beginPath(); ctx.arc(CX, CY, 18, 0, 7); ctx.fill();
      ctx.fillStyle = '#C8102E'; ctx.beginPath(); ctx.arc(CX, CY, 8, 0, 7); ctx.fill();
    };
    const draw = now => {
      ctx.fillStyle = '#2A1C14'; ctx.fillRect(0, 0, 400, 500);
      drawBoard();
      for (const d of darts) { ctx.fillStyle = '#FFE9A8'; ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, 7); ctx.fill(); ctx.strokeStyle = '#3A2A10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 10, d.y + 14); ctx.stroke(); }
      if (aim) {
        const p = sway(now);
        ctx.strokeStyle = '#7FD3A0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 7); ctx.moveTo(p.x - 16, p.y); ctx.lineTo(p.x + 16, p.y); ctx.moveTo(p.x, p.y - 16); ctx.lineTo(p.x, p.y + 16); ctx.stroke();
      } else if (!done) { ctx.fillStyle = 'rgba(244,235,221,.75)'; ctx.font = '600 14px Inter, Arial'; ctx.textAlign = 'center'; ctx.fillText('Hou ingedrukt om te mikken, laat los om te gooien', 200, 480); }
      if (msg && now - msgT < 800) { ctx.fillStyle = '#FFE9A8'; ctx.font = '700 30px Graduate, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(msg, 200, 45); }
      hud(`<span>Punten <b>${total}</b></span><span>Pijl <b>${Math.min(darts.length + 1, 6)}/6</b></span>`);
      if (c.isConnected && (!done || now - msgT < 900)) requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  });
}

// ---------- Zo · Pour the Pint ----------
function gamePour(box, rnd) {
  return new Promise(resolve => {
    const { c, ctx, hud } = gameCanvas(box);
    const targets = Array.from({ length: 5 }, () => .62 + rnd() * .26);
    let glass = 0, level = 0, foam = 0, pouring = false, settle = 0, total = 0, scores = [], msg = '', msgT = 0, done = false, last = performance.now();
    const speed = () => .22 + glass * .07;
    c.addEventListener('pointerdown', e => { if (done || settle) return; pouring = true; c.setPointerCapture(e.pointerId); });
    const stop = () => { if (!pouring) return; pouring = false; settle = performance.now(); };
    c.addEventListener('pointerup', stop); c.addEventListener('pointercancel', stop);
    const draw = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (pouring) { level += speed() * dt; foam = Math.min(.12, foam + dt * .25); }
      else if (settle) {
        // het schuim stijgt nog even na
        const s = (now - settle) / 1000;
        if (s < .6) level += speed() * dt * .35 * (1 - s / .6);
        if (s > 1.1) {
          const top = level + foam * .4, t = targets[glass];
          const sc = top > 1 ? 0 : Math.max(0, Math.round(100 - Math.abs(top - t) * 420));
          scores.push(sc); total += sc; msg = top > 1 ? 'Overgelopen!' : sc >= 90 ? 'Perfect pint!' : sc >= 70 ? 'Mooi getapt' : `+${sc}`; msgT = now;
          glass++; level = 0; foam = 0; settle = 0;
          if (glass >= 5) { done = true; setTimeout(() => resolve(total), 900); }
        }
      }
      ctx.fillStyle = '#1B120C'; ctx.fillRect(0, 0, 400, 500);
      // tap
      ctx.fillStyle = '#B8933F'; ctx.fillRect(176, 20, 48, 34); ctx.fillRect(192, 54, 16, 40);
      if (pouring) { ctx.fillStyle = 'rgba(230,170,60,.9)'; ctx.fillRect(196, 94, 8, 330); }
      // glas
      const gx0 = 130, gx1 = 270, gy0 = 130, gy1 = 460, H = gy1 - gy0;
      const fillTop = gy1 - clamp(level, 0, 1.05) * H;
      if (level > 0) {
        const bg = ctx.createLinearGradient(0, fillTop, 0, gy1); bg.addColorStop(0, '#F2B640'); bg.addColorStop(1, '#C97A16');
        ctx.fillStyle = bg; ctx.fillRect(gx0 + 4, fillTop, gx1 - gx0 - 8, gy1 - fillTop);
        ctx.fillStyle = '#FBF3E0'; ctx.fillRect(gx0 + 4, fillTop - foam * H, gx1 - gx0 - 8, foam * H);
      }
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx0, gy0); ctx.lineTo(gx0 + 6, gy1); ctx.lineTo(gx1 - 6, gy1); ctx.lineTo(gx1, gy0); ctx.stroke();
      if (glass < 5) {
        const ty = gy1 - targets[glass] * H;
        ctx.strokeStyle = '#FFD86B'; ctx.lineWidth = 3; ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.moveTo(gx0 - 20, ty); ctx.lineTo(gx1 + 20, ty); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#FFD86B'; ctx.font = '700 12px Inter, Arial'; ctx.textAlign = 'left'; ctx.fillText('STOP', gx1 + 24, ty + 4);
      }
      if (!pouring && !settle && !done) { ctx.fillStyle = 'rgba(244,235,221,.8)'; ctx.font = '600 14px Inter, Arial'; ctx.textAlign = 'center'; ctx.fillText('Hou ingedrukt om te tappen', 200, 490); }
      if (msg && now - msgT < 900) { ctx.fillStyle = '#FFE9A8'; ctx.font = '700 26px Graduate, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(msg, 200, 115); }
      hud(`<span>Punten <b>${total}</b></span><span>Glas <b>${Math.min(glass + 1, 5)}/5</b></span>`);
      if (c.isConnected && (!done || now - msgT < 950)) requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  });
}

const wordle = { data: null, slot: null, input: '', busy: false, timer: null, loadedAt: 0 };
let WORDS = null; // geldige gokwoorden (words.txt), één keer geladen

async function loadWords() {
  if (!WORDS) {
    const res = await fetch('words.txt');
    if (!res.ok) throw new Error('Woordenlijst kon niet geladen worden.');
    WORDS = new Set((await res.text()).split('\n').map(w => w.trim().toUpperCase()).filter(Boolean));
  }
  return WORDS;
}

const isDone = s => s.status === 'won' || s.status === 'lost';
const fmtDuration = sec => {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}u ${String(m).padStart(2, '0')}m` : `${m}m ${String(s).padStart(2, '0')}s`;
};
function roundStatus(s) {
  if (!s.open) return `🔒 opent om ${s.opens}`;
  if (s.status === 'won') return `✓ opgelost in ${s.attempts}/${s.max_guesses || 6}`;
  if (s.status === 'lost') return '✗ niet opgelost';
  if (s.rows.length) return `bezig · ${s.rows.length}/${s.max_guesses || 6}`;
  return 'klaar om te spelen';
}
function roundSummary(s) {
  if (s.status === 'won') return `Opgelost in ${s.attempts} ${plural(s.attempts)}! Je pakje is geopend.`;
  if (s.status === 'lost') return `Niet opgelost. Het woord was <strong>${esc(s.answer || '?')}</strong>. Gebuisd: F, geen kaart.`;
  return '';
}

function boardHtml(s) {
  return Array.from({ length: s.max_guesses || 6 }, (_, i) => {
    const row = s.rows[i];
    const letters = row ? row.w : (i === s.rows.length && !isDone(s) ? wordle.input : '');
    return `<div class="wrow" id="wr-${i}">${Array.from({ length: 5 }, (_, j) => {
      const ch = letters[j] || '';
      const cls = row ? ` ${row.r[j]}` : ch ? ' filled' : '';
      return `<div class="wtile${cls}">${esc(ch)}</div>`;
    }).join('')}</div>`;
  }).join('');
}

function keyboardHtml(s) {
  const rank = { g: 3, y: 2, x: 1 }, best = {};
  for (const row of s.rows) [...row.w].forEach((ch, i) => {
    const r = row.r[i];
    if (!best[ch] || rank[r] > rank[best[ch]]) best[ch] = r;
  });
  return KB_ROWS.map(row => `<div class="wkrow">${[...row].map(k => {
    const wide = k === '⏎' || k === '⌫';
    const label = k === '⏎' ? 'Enter' : k;
    return `<button type="button" class="wkey${wide ? ' wide' : ''}${best[k] ? ' ' + best[k] : ''}" data-key="${k}" aria-label="${k === '⌫' ? 'Wissen' : label}">${label}</button>`;
  }).join('')}</div>`).join('');
}

  const card = s.card_id ? state.cards.find(c => c.id === s.card_id) : null;

    <div class="col">
      <div class="round-tabs" id="roundTabs"${slots.length < 2 ? ' hidden' : ''}>${roundTabsHtml()}</div>
      ${s.open ? `<div class="board-frame">
        <div class="bf-head"><span class="bf-title">The Wordle</span><span class="bf-num">Nº ${wordleNumber(wordle.data.date)}</span>${infoBtn('today')}</div>
        <div class="wboard" id="wboard" style="--rows:${s.max_guesses || 6}">${boardHtml(s)}</div>
        <p class="msg wmsg${isDone(s) ? ' ok' : ''}" id="wmsg" role="alert">${roundSummary(s)}</p>
        ${isDone(s) ? '' : `<div class="wkeys" id="wkeys">${keyboardHtml(s)}</div>
        <div class="whelp" id="whelp">${helpHtml(s)}</div>`}
      </div>`
      : `${pageHead('Exam Hall', 'today')}<div class="round-closed">
          <div class="big-lock" aria-hidden="true">🔒</div>
          <p>De volgende Wordle opent om <strong>${s.opens}</strong> (Belgische tijd).</p>
          <p class="countdown" id="wcount"></p>
        </div>`}
    </div>
    <div class="stage" id="stage" aria-live="polite">${card
      ? `<div class="cardflip">${renderCard(card)}</div>`
      : '<div class="stage-placeholder"><div class="ghost-pack" aria-hidden="true">?</div><p>Solve it. Earn your envelope.</p></div>'}
</div>
  </section>`;
  attachWelcome();
  bindRoundTabs(view);
  // Eén handler op het hele toetsenbord: blijft werken als de toetsen opnieuw getekend worden
  const keys = $('#wkeys');
  if (keys) keys.onclick = e => { const b = e.target.closest('[data-key]'); if (b) wordleKey(b.dataset.key); };
  bindHelp(s);

  // Aftellen tot een ronde opent; op 0 herladen we de rondes
  clearInterval(wordle.timer);
  const waits = slots.filter(x => !x.open).map(x => wordle.loadedAt + x.seconds_until_open * 1000);
  if (waits.length) {
    const openAt = Math.min(...waits);
    const tick = () => {
      const left = Math.max(0, Math.round((openAt - Date.now()) / 1000));
      const el = $('#wcount');
      if (el) el.textContent = `Nog ${fmtDuration(left)}`;
      if (left === 0) {
        clearInterval(wordle.timer);
        if (state.tab === 'today' && $('#roundTabs')) renderToday(view);
      }
    };
    tick();
    wordle.timer = setInterval(tick, 1000);
  }
}

// Wordle-hulp uit de Shop: onthulde letters + knoppen
function helpHtml(s) {
  const hints = s.hints || [];
  return `${hints.map(h => `<span class="hint-chip">💡 ${esc(h.letter)} op plaats ${h.pos}</span>`).join('')}
    <button type="button" class="link" data-help="hint" ${hints.length >= 2 ? 'disabled' : ''}>💡 Letter onthullen · ${SHOP.hint} 🪙 (${hints.length}/2)</button>
    ${(s.max_guesses || 6) < 7 ? `<button type="button" class="link" data-help="extra">➕ 7e poging · ${SHOP.extra} 🪙</button>` : '<span class="hint-chip">➕ 7e poging gekocht</span>'}`;
}
function bindHelp(s) {
  const box = $('#whelp');
  if (!box) return;
  box.onclick = async e => {
    const b = e.target.closest('[data-help]');
    if (!b || b.disabled || wordle.busy) return;
    const kind = b.dataset.help;
    if (!confirm(kind === 'hint' ? `Een letter onthullen voor ${SHOP.hint} credits?` : `Een 7e poging kopen voor ${SHOP.extra} credits?`)) return;
    wordle.busy = true;
    const { data, error } = await sb.rpc(kind === 'hint' ? 'wordle_hint' : 'wordle_extra_guess', { p_slot: s.slot });
    wordle.busy = false;
    const msg = $('#wmsg');
    if (error) { msg.className = 'msg wmsg err'; msg.textContent = error.message; return; }
    setWallet(data.wallet);
    if (kind === 'hint') {
      s.hints = [...(s.hints || []), { pos: data.pos, letter: data.letter }];
      msg.className = 'msg wmsg ok'; msg.textContent = `De letter ${data.letter} staat op plaats ${data.pos}.`;
    } else {
      s.max_guesses = data.max_guesses;
      $('#wboard').style.setProperty('--rows', s.max_guesses);
      $('#wboard').innerHTML = boardHtml(s);
      msg.className = 'msg wmsg ok'; msg.textContent = 'Je hebt nu 7 pogingen voor deze ronde.';
    }
    box.innerHTML = helpHtml(s);
  };
}

function roundTabsHtml() {
  return wordle.data.slots.map(x => `<button type="button" class="round-tab${x.slot === wordle.slot ? ' active' : ''}${isDone(x) ? ' done' : ''}" data-round="${x.slot}">
    <span>${ROUNDS[x.slot]?.icon || '📜'} ${ROUNDS[x.slot]?.name || `Ronde ${x.slot}`}</span><small>${roundStatus(x)}</small></button>`).join('');
}
function bindRoundTabs(view) {
  view.querySelectorAll('[data-round]').forEach(b => {
    b.onclick = () => {
      if (wordle.busy) return;
      wordle.slot = Number(b.dataset.round); wordle.input = '';
      drawToday(view);
    };
  });
}

function currentRound() {
  if (state.tab !== 'today' || !wordle.data || !$('#wboard')) return null;
  return wordle.data.slots.find(x => x.slot === wordle.slot) || null;
}

function wordleKey(k) {
  const s = currentRound();
  if (!s || !s.open || isDone(s) || wordle.busy) return;
  if (k === '⌫') { wordle.input = wordle.input.slice(0, -1); return drawInputRow(s); }
  if (k === '⏎') return submitGuess(s);
  if (/^[A-Z]$/.test(k) && wordle.input.length < 5) { wordle.input += k; drawInputRow(s); }
}

function drawInputRow(s) {
  const row = $(`#wr-${s.rows.length}`);
  if (!row) return;
  [...row.children].forEach((t, i) => {
    t.textContent = wordle.input[i] || '';
    t.className = 'wtile' + (wordle.input[i] ? ' filled' : '');
  });
}

async function submitGuess(s) {
  const msg = $('#wmsg'), row = $(`#wr-${s.rows.length}`);
  const fail = text => {
    msg.className = 'msg wmsg err'; msg.textContent = text;
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
  };
  if (wordle.input.length < 5) return fail('Te weinig letters.');
  if (WORDS && !WORDS.has(wordle.input)) return fail('Dat woord staat niet in de woordenlijst.');
  wordle.busy = true;
  msg.className = 'msg wmsg'; msg.textContent = '';
  const { data, error } = await sb.rpc('wordle_guess', { p_slot: s.slot, p_guess: wordle.input });
  if (error) { wordle.busy = false; return fail(error.message); }

  s.rows.push({ w: data.guess, r: data.result });
  wordle.input = '';
  // Tegels één voor één omdraaien en halverwege hun kleur tonen
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  [...row.children].forEach((t, i) => {
    t.textContent = data.guess[i];
    if (reduce) { t.className = `wtile ${data.result[i]}`; return; }
    t.className = 'wtile filled flip';
    t.style.setProperty('--i', i);
    setTimeout(() => { t.className = `wtile flip ${data.result[i]}`; }, i * 220 + 250);
  });
  if (!reduce) await sleep(4 * 220 + 520);
  if ($('#wkeys')) $('#wkeys').innerHTML = keyboardHtml(s);

  if (data.status !== 'playing') {
    Object.assign(s, { status: data.status, attempts: data.attempts, card_id: data.card?.id || null, answer: data.answer });
    if (data.card) state.owned.set(data.card.id, (state.owned.get(data.card.id) || 0) + 1);
    state.playDates.add(todayBrussels());
    if (data.coinsEarned) state.wallet += data.coinsEarned;
    syncCoinUI();
    $('#wkeys')?.remove();
    $('#whelp')?.remove();
    msg.className = 'msg wmsg ok'; msg.innerHTML = roundSummary(s);
    $('#roundTabs').innerHTML = roundTabsHtml();
    bindRoundTabs($('#view'));
    const stage = $('#stage');
    stage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (data.card) {
      window.celebrate?.('common');
      await showStamp(data.grade, 'grade', GRADE_TEXT[data.grade]);
      await revealCard(data);
    } else {
      await showStamp('F', 'fail', 'Gebuisd');
      stage.innerHTML = `<p class="result">Gebuisd${data.answer ? `: het woord was ${esc(data.answer)}` : ''}. Geen kaart vandaag.</p>`;
    }
  } else {
    $('#roundTabs').innerHTML = roundTabsHtml();
    bindRoundTabs($('#view'));
  }
  wordle.busy = false;
}

// Fysiek toetsenbord (één keer geregistreerd, enkel actief op Today tijdens een ronde)
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (!currentRound()) return;
  if (e.key === 'Enter') { e.preventDefault(); wordleKey('⏎'); }
  else if (e.key === 'Backspace') { e.preventDefault(); wordleKey('⌫'); }
  else if (/^[a-z]$/i.test(e.key)) wordleKey(e.key.toUpperCase());
});

// Deeltjes rond een net onthulde kaart
function particlesHtml(rarity) {
  const colors = PARTICLE_COLORS[rarity] || PARTICLE_COLORS.common;

  return `<div class="particles">${Array.from({ length: n }, () => {
    const a = Math.random() * 360, d = 70 + Math.random() * 90, delay = Math.random() * .25;
    const c = colors[Math.floor(Math.random() * colors.length)];
    return `<span class="particle" style="--a:${a}deg;--d:${d}px;--pd:${delay}s;--pc:${c}"></span>`;
  }).join('')}</div>`;
}

// Cijfer per aantal pogingen (1 t.e.m. 7)
const GRADES = [['A+', 'Summa cum laude'], ['A', 'Magna cum laude'], ['B+', 'Cum laude'], ['B', 'Well done'], ['C', 'Passed'], ['D', 'Barely passed'], ['D-', 'Close call']];
const PULL_STAMP = {
  legendary: ['HALL OF FAME', 'legendary', 'Legendary pull'],
  epic: ["DEAN'S LIST", 'epic', 'Epic pull'],
  common: ['ENROLLED', 'common', 'Welkom in het huis'],
